<text x="28.0" y="667.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">If a drug you rely on carries the paediatric flag, its risk is a shortage that does not clear, not a market exit — plan sourcing, not substitution.</text>
<text x="28.0" y="682.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Two of them are lidocaine and dobutamine, sitting inside Cardiovascular, where 22 of the other 29 substances are leaving.</text>
<text x="28.0" y="697.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Counted as distinct substances: 12, 0 of them exits. Against the 149 substances sharing a co-tag, which exit at 72%, expected is 8.6 — P(0 of 12) &lt; 0.0001.</text>
<text x="28.0" y="712.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Why is not in this capture. A paediatric formulation often has no substitute, and the statutory framework around paediatric drugs is its own subject.</text>
