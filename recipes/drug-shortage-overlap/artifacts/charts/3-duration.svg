<text x="125.5" y="387.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#7a776e" text-anchor="start" font-weight="normal" style="">the register's apparent median:</text>
<text x="125.5" y="401.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#7a776e" text-anchor="start" font-weight="normal" style="">62 days, from the 203 resolved rows alone</text>
<text x="261.0" y="309.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#1b4f8a" text-anchor="start" font-weight="600" style="">corrected median: 387 days</text>
<text x="261.0" y="324.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#1b4f8a" text-anchor="start" font-weight="normal" style="">612 shortages observed, 203 resolutions</text>
<text x="578.8" y="443.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#1b4f8a" text-anchor="end" font-weight="normal" style="">one in four still short at 3.3 years</text>
<text x="704.0" y="303.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">band: 95% Greenwood</text>
<text x="704.0" y="317.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">axis cut at four years;</text>
<text x="704.0" y="331.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">the longest ran 6,538 days</text>
<line x1="28" y1="615.0" x2="932.0" y2="615.0" stroke="#ebeae3" stroke-width="1"/>
<text x="28.0" y="635.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Size a bridge for a year, not two months: half of shortages are still open at 387 days, and one in four at 1209 days.</text>
<text x="28.0" y="650.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Injectables resolve faster here than oral solids — KM medians 182 against 394 days (56 and 133 resolutions). TGA's own severity class does not order durations at all.</text>
<text x="28.0" y="665.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Australia is the only one of the three registers that can support this: FDA kept seven resolved rows and France records no start date.</text>
<text x="28.0" y="680.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Kaplan-Meier, left-truncated at the window start and right-censored at capture; discontinuations and anticipated shortages excluded. See survival.py.</text>
</svg>