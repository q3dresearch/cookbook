<text x="28.0" y="42.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">A resolved Australian shortage lasted two months. A shortage lasts about a year.</text>
<text x="28.0" y="66.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">Share of TGA-listed shortages still unresolved, by time since they began. The dashed curve is the register read</text>
<text x="28.0" y="82.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">naively — resolved rows only. The solid one counts every shortage open in the last twelve months, the 409 still</text>
<text x="28.0" y="98.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">running included, censored at capture. The gap is the purge: long shortages that ended are gone, long ones still</text>
<text x="28.0" y="114.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">running are not yet resolved.</text>
