<text x="28.0" y="774.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">If you need how long shortages last, only Australia can answer, and only for shortages open in the last year — and its resolved rows understate it six-fold (figure 3).</text>
<text x="28.0" y="789.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">If you need a trend — are shortages getting longer? — no register can give it and none ever will; each deletes the evidence at about twelve months. Only an archive can.</text>
<text x="28.0" y="804.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The lone older resolved rows are the control: a resolved row CAN persist, so the emptiness beside it is deletion rather than a field that was only recently kept.</text>
