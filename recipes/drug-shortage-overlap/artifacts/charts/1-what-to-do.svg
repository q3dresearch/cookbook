<text x="724.0" y="445.8" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">the half of the picture a</text>
<text x="724.0" y="458.8" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">bar chart of four</text>
<text x="724.0" y="471.8" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">percentages hides.</text>
<line x1="28" y1="611.0" x2="892.0" y2="611.0" stroke="#ebeae3" stroke-width="1"/>
<text x="28.0" y="631.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">If one firm reports it, plan a therapeutic substitution: 127 of those 133 are exits, and no procurement lever reaches a company that is leaving.</text>
<text x="28.0" y="646.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The 6 substances that genuinely are sole-supplier shortages — the real re-tender worklist — are named in the README rather than crowded onto this figure.</text>
<text x="28.0" y="661.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Permutation p &lt; 0.0001 between one firm and two or more. A firm counts as leaving only when every package NDC it lists for that molecule is discontinued.</text>
<text x="28.0" y="676.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Supplier counts are the US column only; France and Australia publish no firm, so a drug at 1 may have several suppliers elsewhere and this cannot see it.</text>
</svg>