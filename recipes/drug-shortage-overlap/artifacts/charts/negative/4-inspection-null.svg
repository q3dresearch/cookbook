<text x="28.0" y="580.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Pooled from 39,988 drug inspection rows across fiscal years 2009-2026. The serious outcome, OAI, runs 7%, 6% and 7% — there is no difference to explain.</text>
<text x="28.0" y="595.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">This is the control for 3-suppliers: nine of the nineteen are short at several independent firms at once, and it is not because those firms are worse operators.</text>
<text x="28.0" y="610.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">A single capture file holds 1,167 rows and matched 15% of shortage firms, which looked like a broken name join. The 14 captures pool to 73%. It was a paginated slice.</text>
<text x="28.0" y="625.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">A reporting firm is a marketing company, so these establishments are closer to the plant than company_name, and still not the API supplier two tiers upstream.</text>
<text x="28.0" y="640.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Of 234 establishments behind the 73 matched firms, 61 firms have a US site, 11 an Indian one and 2 a Chinese one — small, not absent, which is a difference that matters.</text>
</svg>