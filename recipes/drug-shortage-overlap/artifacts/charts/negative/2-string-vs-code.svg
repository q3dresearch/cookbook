<text x="28.0" y="706.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Two keys on the same three registers: a normalised name stem finds 22, an RxNorm ingredient code finds 24, and they agree on 19.</text>
<text x="28.0" y="721.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The code wins where countries spell a molecule differently by convention, and where one word covers several molecules. Neither case is reachable by a better regular expression.</text>
<text x="28.0" y="736.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">A first pass reported 14 and looked like it caught five string errors. Four were the CLEANER: 'Lamotrigine Tablet, Extended Release' failed to resolve and looked absent.</text>
<text x="28.0" y="751.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">RxNav places 85% of register rows and 82% of distinct names; the rest are unresolved, not absent.</text>
<text x="28.0" y="766.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Combination products roll up to one ingredient, which is the code key's own over-merging — Q11, and the resolver has since been fixed to keep the full set.</text>
