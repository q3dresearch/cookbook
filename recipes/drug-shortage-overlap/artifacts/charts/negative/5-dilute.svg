<text x="890.0" y="272.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">date is the 2012 bulk load —</text>
<text x="890.0" y="286.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">the real start is earlier</text>
<text x="880.0" y="320.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">Exits are young at every</text>
<text x="880.0" y="333.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">concentration, which is the</text>
<text x="880.0" y="346.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">control. But all four censored</text>
<text x="880.0" y="359.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">points are dilute and none of</text>
<text x="880.0" y="372.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">the eleven concentrated ones</text>
<text x="880.0" y="385.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">is — so the gap is censored in</text>
<text x="880.0" y="398.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">the direction that flatters</text>
<text x="880.0" y="411.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">it.</text>
<line x1="28" y1="677.0" x2="1052.0" y2="677.0" stroke="#ebeae3" stroke-width="1"/>
<text x="28.0" y="697.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Shipped as advice on half the register. On all 39 chronic injectables the gap is p = 0.037; without the 4 bulk-load dates, p = 0.079. A prior at best, not a rule.</text>
<text x="28.0" y="712.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Split at the median, 10 mg/mL, not an optimised cut. All 39: gap 3.5y, p = 0.037, rho -0.45. Excluding the 4 censored: gap 2.3y, p = 0.079, rho -0.36 on 35.</text>
<text x="28.0" y="727.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Concentration parses for 61 of 73 injectables (84%). Lyophilised powders and unit-dosed biologics have no mg/mL and are absent, not zero.</text>
<text x="28.0" y="742.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Package counts (rho +0.51) and firm counts (+0.37) track age better and are unusable: both accumulate BECAUSE a shortage persists.</text>
<text x="28.0" y="757.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">A molecule's mg/mL cannot be caused by its own shortage, which is why the weaker correlate is the one drawn. It is not separable from mass per container (rho +0.77).</text>
<text x="28.0" y="772.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Age is time on the list, not expected duration: every row is still open, so this is the age of the current backlog. Concentration proxies value density, not margin.</text>
</svg>