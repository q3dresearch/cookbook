<text x="222.8" y="270.0" font-size="7.5" fill="#ffffff" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Perc</text>
<rect x="250.5" y="259.0" width="16.5" height="15" fill="#4a7fa8"/>
<rect x="270.0" y="259.0" width="11.7" height="15" fill="#4a7fa8"/>
<text x="28.0" y="293.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">density — per VOLUME</text>
<text x="458.0" y="293.0" font-size="9" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">16 records · 4 strings</text>
<rect x="28.0" y="302.0" width="28.6" height="15" fill="#2a6f7f"/>
<text x="32.0" y="313.0" font-size="7.5" fill="#ffffff" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">numb</text>
<rect x="59.6" y="302.0" width="11.7" height="15" fill="#2a6f7f"/>
<rect x="74.3" y="302.0" width="11.0" height="15" fill="#2a6f7f"/>
<rect x="88.3" y="302.0" width="11.0" height="15" fill="#2a6f7f"/>
<text x="28.0" y="336.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">counts of individuals</text>
<text x="458.0" y="336.0" font-size="9" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">274 records · 15 strings</text>
