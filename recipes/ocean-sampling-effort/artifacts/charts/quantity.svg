<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect width="1200" height="740" fill="#fcfcfb"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">The field that would give you biomass exists, and cannot be added up</text>
<text x="28.0" y="62.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">FOR</text>
<text x="28.0" y="77.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">anyone planning to compute density or biomass from occurrence</text>
<text x="28.0" y="90.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">data</text>
<text x="409.3" y="62.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">DECIDE</text>
<text x="409.3" y="77.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">whether to build on organismQuantity or go to a survey source</text>
<text x="790.7" y="62.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">WRONG IF</text>
<text x="790.7" y="77.0" font-size="11.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">a controlled vocabulary appears and the strings collapse to a</text>
<text x="790.7" y="90.5" font-size="11.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">few units</text>
<line x1="28" y1="100.0" x2="1172" y2="100.0" stroke="#e3e2db"/>
<text x="28.0" y="206.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">what the quantity field is actually measuring</text>
<text x="28.0" y="222.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">one mark per distinct string; width is how many records carry it, square-root scale</text>
<text x="28.0" y="250.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">density — per AREA</text>
<text x="458.0" y="250.0" font-size="9" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">361 records · 5 strings</text>
<rect x="28.0" y="259.0" width="148.8" height="15" fill="#4a7fa8"/>
<text x="32.0" y="270.0" font-size="7.5" fill="#ffffff" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">number of individuals per 60 m</text>
<rect x="179.8" y="259.0" width="36.0" height="15" fill="#4a7fa8"/>
<text x="183.8" y="270.0" font-size="7.5" fill="#ffffff" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">percen</text>
