<text x="376.0" y="570.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Reaching four thousand metres needs a ship, a winch and a week;</text>
<text x="376.0" y="583.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">reaching ten needs a snorkel. This is what oceanography costs,</text>
<text x="376.0" y="597.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">not a failing — but the same records are read as a map of where</text>
<text x="376.0" y="610.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">life is, and a map built from a snorkel finds the most life at</text>
<text x="376.0" y="624.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">snorkel depth.</text>
<text x="800.0" y="174.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">temperature says it too</text>
<text x="800.0" y="190.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">records by sea surface temperature</text>
