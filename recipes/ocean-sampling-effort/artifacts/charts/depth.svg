<text x="328.0" y="565.2" fill="#1b7f5a" font-size="9.5" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">3,700 m — the ocean's mean depth</text>
<text x="28.0" y="644.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The median record comes from 10 metres. The median</text>
<text x="28.0" y="657.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">cubic metre of ocean is nearer four thousand. Bar</text>
<text x="28.0" y="671.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">length is a fourth-root scale or the deep bars</text>
<text x="28.0" y="684.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">vanish.</text>
<text x="376.0" y="174.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">and the deep is almost absent</text>
<text x="376.0" y="190.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">share of the 118 million records carrying a depth</text>
