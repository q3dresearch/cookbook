<text x="800.0" y="488.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The 5-to-20°C bins — temperate and subpolar water, where</text>
<text x="800.0" y="501.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the research fleets are based — holds 64.2% of everything.</text>
<text x="800.0" y="515.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Water above 25°C holds 15.6%. The warmest bin, above 30°C,</text>
<text x="800.0" y="528.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">holds 7,573 records in a register of 229 million.</text>
<line x1="28" y1="732.0" x2="1172" y2="732.0" stroke="#e3e2db"/>
<text x="28.0" y="752.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">OBIS v3 statistics/env, fetched 2026-09-18. 118,227,796 records carry a depth of the 229,611,782 in the register, so 48% are excluded entirely. OBIS</text>
<text x="28.0" y="766.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">reports the depth a record was taken at and not the depth of sea beneath it, so a surface tow over an abyssal plain counts as shallow. The 3,700 m</text>
<text x="28.0" y="780.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">line is the ocean's accepted mean depth and is the only number on this figure not from OBIS.</text>
