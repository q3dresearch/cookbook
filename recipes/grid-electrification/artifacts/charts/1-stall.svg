<text x="774.8" y="508.7" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">flat for forty years, then a 32% improvement</text>
<text x="774.8" y="508.7" fill="#52514e" font-size="9.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">flat for forty years, then a 32% improvement</text>
<text x="774.8" y="495.7" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">in the fuel burned per unit delivered</text>
<text x="774.8" y="495.7" fill="#52514e" font-size="9.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">in the fuel burned per unit delivered</text>
<text x="28.0" y="662.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">so the reversal is the generators improving, not the country un-electrifying</text>
<text x="28.0" y="682.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">From 2000 to 2024 electricity delivered rose 16.2%, from 3,421 to 3,975 TWh. The losses attributed to delivering it fell 21.3%. The primary ratio is a fraction whose numerator contains</text>
<text x="28.0" y="696.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">both, so it falls when the waste term shrinks faster than the useful term grows -- which is what an improving fleet looks like. Anyone quoting the primary basis alone would report that</text>
<text x="28.0" y="711.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the United States is de-electrifying, and anyone quoting the meter basis alone would miss that a third of the fuel cost of electricity has disappeared.</text>
<line x1="28" y1="756.0" x2="1212" y2="756.0" stroke="#e3e2db"/>
<text x="28.0" y="774.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">EIA State Energy Data System, bulk endpoint, no key, fetched 2026-09-23; series ESTXB, TNTCB and LOTXB for the US roll-up, 1960 to 2024. CAVEAT: the denominator is dominated by transport</text>
<text x="28.0" y="788.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">and industrial heat, so the ratio also moves when petrol demand moves and not only when an end use converts. This is the US only; the same ratio for other countries needs a different</text>
<text x="28.0" y="802.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">source.</text>
</svg>