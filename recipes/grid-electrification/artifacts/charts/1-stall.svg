<text x="108.0" y="400.1" font-size="9" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">20%</text>
<line x1="116.0" y1="315.7" x2="602.0" y2="315.7" stroke="#f0efe9"/>
<text x="108.0" y="318.7" font-size="9" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">30%</text>
<line x1="116.0" y1="234.3" x2="602.0" y2="234.3" stroke="#f0efe9"/>
<text x="108.0" y="237.3" font-size="9" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">40%</text>
