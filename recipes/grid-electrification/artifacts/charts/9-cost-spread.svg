<text x="28.0" y="60.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Levelised cost in 2030, every published value. The bar is the full range of official numbers; the tick is their median. 8 further technologies publish no LCOE at all -- see figure 11.</text>
