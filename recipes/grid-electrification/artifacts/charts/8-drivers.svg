<text x="28.0" y="618.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">EIA Hourly Electric Grid Monitor and PeeringDB, fetched 2026-09-23; state predictors from EIA SEDS 2023. Difficulty is the error a same-hour-last-week forecast makes, as a</text>
<text x="28.0" y="632.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">share of mean demand, 2025. CAVEAT: the data-centre variable exists only for the 41 balancing authorities whose footprint sits inside one state, against a directory nobody is</text>
<text x="28.0" y="646.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">obliged to file into, and only per capita -- the raw facility count correlates at -0.03. It is a lead, not a finding.</text>
