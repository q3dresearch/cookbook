<text x="264.0" y="210.7" font-size="9.5" fill="#4a7fa8" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">PJM   +3.2 points, about 10 GW of implied flat load</text>
<text x="264.0" y="226.3" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the largest implied flat load of any US grid</text>
<text x="264.0" y="270.6" font-size="9.5" fill="#8c2318" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">CISO   +5.8 points -- a LARGER gap than PJM's</text>
<text x="264.0" y="286.2" font-size="9.5" fill="#8c2318" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">and California's electricity consumption fell 5.9%</text>
<text x="264.0" y="301.8" font-size="9.5" fill="#8c2318" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">rooftop solar suppresses the peak, not the trough</text>
<text x="42.0" y="208.0" font-size="10.5" fill="#4a7fa8" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">above the line</text>
<text x="42.0" y="223.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">9 of 17 grids. The overnight</text>
<text x="42.0" y="235.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">trough grew faster than the</text>
<text x="42.0" y="248.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">afternoon peak.</text>
<text x="42.0" y="276.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">what puts it there</text>
<text x="42.0" y="291.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Flat load raises both halves</text>
<text x="42.0" y="304.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">of the day, so it moves a grid</text>
<text x="42.0" y="316.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">right as well as up.</text>
<text x="42.0" y="345.0" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">what also puts it there</text>
<text x="42.0" y="360.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Daytime demand that stops</text>
<text x="42.0" y="372.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">being recorded. Rooftop solar</text>
<text x="42.0" y="385.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">moves a grid straight up.</text>
<text x="42.0" y="413.5" font-size="10.5" fill="#c07a1e" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">the dashed ring</text>
<text x="42.0" y="428.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">A year where trough and peak</text>
<text x="42.0" y="441.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">both rose over 10% at once. No</text>
<text x="42.0" y="453.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">other grid lost matching load,</text>
<text x="42.0" y="466.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">so the cause is unresolved.</text>
<line x1="28" y1="820.0" x2="1122" y2="820.0" stroke="#e3e2db"/>
<text x="28.0" y="838.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">EIA Hourly Electric Grid Monitor (EBA) bulk file, no key, fetched 2026-09-23. Trough and peak are the median daily minimum and maximum of LOCAL-time hourly demand; UTC</text>
<text x="28.0" y="852.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">would split every night across two days. CAVEAT: behind-the-meter solar is absent from EBA, appearing only as demand that did not happen. EIA estimates it per STATE in the</text>
<text x="28.0" y="866.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ELEC file, which figure 6 uses and which is too coarse to correct a balancing authority; the two readings here are separated by shape alone.</text>
</svg>