<text x="28.0" y="768.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">EIA Hourly Electric Grid Monitor (EBA) bulk file, no key, fetched 2026-09-23. Consumed carbon and demand are summed over the 7,666 hours of 2025 that both series cover: CO2</text>
<text x="28.0" y="782.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">reporting began mid-2024, and an annual ratio understates every intensity by 11% to 15%. Carbon-free counts water, sun, wind, nuclear and geothermal at generation. CAVEAT: this</text>
<text x="28.0" y="796.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">is what the wires carried, not what anyone contracted for -- a power purchase agreement is invisible here. Under 8 TWh is not drawn.</text>
