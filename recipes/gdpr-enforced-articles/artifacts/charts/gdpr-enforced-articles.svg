<text x="286" y="244" font-size="11" fill="#8a8880" text-anchor="end">lawfulness of processing</text>
<rect x="300" y="215" width="396.5" height="26" rx="3.5" fill="#2361b0"/>
<text x="707.5" y="233" font-size="13" font-weight="600" fill="#0b0b0b">34%</text>
<text x="286" y="271" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="end">Article 32</text>
<text x="286" y="287" font-size="11" fill="#8a8880" text-anchor="end">security of processing</text>
<rect x="300" y="258" width="235.1" height="26" rx="3.5" fill="#2361b0"/>
<text x="546.1" y="276" font-size="13" font-weight="600" fill="#0b0b0b">20%</text>
<text x="286" y="314" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">Article 12</text>
<text x="286" y="330" font-size="11" fill="#8a8880" text-anchor="end">transparent information</text>
<rect x="300" y="301" width="220.9" height="26" rx="3.5" fill="#c9c8c0"/>
<text x="531.9" y="319" font-size="13" font-weight="400" fill="#0b0b0b">19%</text>
<text x="286" y="357" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">Article 13</text>
