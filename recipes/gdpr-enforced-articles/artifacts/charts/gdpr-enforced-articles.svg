<svg xmlns="http://www.w3.org/2000/svg" width="980" height="752" viewBox="0 0 980 752" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="980" height="752" fill="#fcfcfb"/>
<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">Ninety-nine articles. Three of them are the game.</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Share of 3,361 published GDPR decisions citing each article (GDPRhub, the whole corpus, not a sample). The decision this</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">supports: what to get right first, if you are building something and have not read the regulation.</text>
<text x="36" y="150" font-size="11.5" fill="#8a8880">share of all decisions citing the article</text>
<text x="286" y="185" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="end">Article 5</text>
<text x="286" y="201" font-size="11" fill="#8a8880" text-anchor="end">principles of processing</text>
<rect x="300" y="172" width="530.0" height="26" rx="3.5" fill="#2361b0"/>
<text x="841.0" y="190" font-size="13" font-weight="600" fill="#0b0b0b">46%</text>
