<line x1="36" y1="606" x2="944" y2="606" stroke="#e3e2db"/>
<text x="36" y="628" font-size="13" fill="#52514e">Articles 5, 6 and 32 &#8212; <tspan font-weight="600" fill="#0b0b0b">have a lawful basis, collect only what you need, and secure it</tspan> &#8212; are 44% of all enforced citations.</text>
<text x="36" y="649" font-size="13" fill="#52514e">The remaining 55 cited articles share the rest. The regulation&#8217;s surface area is far larger than its enforced surface area.</text>
<text x="36" y="680" font-size="11.5" fill="#8a8880">Excluded as scaffolding &#8212; cited, but a controller cannot breach them: Art 1, Art 2, Art 3, Art 4, Art 51, Art 52, Art 53, Art 54, Art 55, Art 56, Art 57, Art 58, Art 59, Art 60, Art 61, Art 62, Art 63, Art 64, Art 65, Art 66, Art 67, Art 68, Art 69, Art 70, Art 71, Art 72, Art 73, Art 74, Art 75, Art 76, Art 77, Art 78, Art 79, Art 80, Art 83. You are fined under Art 83, not for it.</text>
<text x="36" y="698" font-size="11.5" fill="#8a8880">Jurisdiction mix reflects which authorities publish, not where breaches happen, and there is no denominator to normalise it. Citation is not a finding of breach.</text>
<text x="36" y="716" font-size="11.5" fill="#8a8880">Source and method: github.com/q3dresearch/cookbook &#183; recipes/gdpr-enforced-articles</text>
</svg>