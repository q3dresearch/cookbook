<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">The articles you are most likely to be cited for sit in the cheaper cases.</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Each article that appears in at least 10 fined decisions, placed by how often it is cited and the median fine when it is.</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">The fine belongs to the decision, not the article: most decisions cite several, so every article inherits the whole fine of each case</text>
<text x="36" y="106" font-size="13.5" fill="#52514e">it appears in. Read the vertical axis as &#8220;the company this article keeps&#8221;, never as a price.</text>
