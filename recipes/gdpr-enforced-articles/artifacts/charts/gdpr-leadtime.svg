<text x="632" y="412" font-size="11" fill="#8a8880">No single authority dominates the</text>
<text x="632" y="427" font-size="11" fill="#8a8880">dated set, so the line is not one</text>
<text x="632" y="442" font-size="11" fill="#8a8880">regulator&#8217;s habits.</text>
<text x="36" y="518" font-size="11.5" fill="#8a8880">Decisions recording both dates only; a case opened before the regulation cannot appear. Counts are panel cases of all dated cases; the band is the panel&#8217;s middle half.</text>
<text x="36" y="536" font-size="11.5" fill="#8a8880">The final year is partial: cases still open are not in it, and slow cases finish late, so the last point understates its year.</text>
<text x="36" y="554" font-size="11.5" fill="#8a8880">Method and code: github.com/q3dresearch/cookbook &#183; recipes/gdpr-enforced-articles</text>
</svg>