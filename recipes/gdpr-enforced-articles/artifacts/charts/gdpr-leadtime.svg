<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">The same regulators take +72% longer than they did in 2022.</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Days from the authority opening a case to deciding it, by year of decision. Band is the middle half of cases.</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">Only the 849 decisions (25%) that record both dates, so read the coverage panel before the line.</text>
