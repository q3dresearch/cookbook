<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="1000" height="640" fill="#fcfcfb"/>
<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">The queue processes modifications and holds new capacity</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Share of each family still waiting, against how fast it is being resolved. Area is the number of applications; fill is</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">whether granting it would create capacity that did not exist before.</text>
<circle cx="42" cy="116" r="7" fill="#a8324a" fill-opacity="0.34" stroke="#a8324a" stroke-width="2"/>
<text x="56" y="120" font-size="12.5" fill="#a8324a" font-weight="600">creates new capacity</text>
<circle cx="242" cy="116" r="7" fill="#2361b0" fill-opacity="0.34" stroke="#2361b0" stroke-width="2"/>
<text x="256" y="120" font-size="12.5" fill="#2361b0" font-weight="600">modifies an existing site</text>
<line x1="631.0" y1="208" x2="631.0" y2="490" stroke="#8a8880" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="623.0" y="222" font-size="11.5" fill="#8a8880" text-anchor="end">keeping up</text>
<line x1="229.7" y1="208" x2="229.7" y2="490" stroke="#e3e2db"/>
<text x="229.7" y="511" font-size="11.5" fill="#8a8880" text-anchor="middle">25%</text>
<line x1="363.5" y1="208" x2="363.5" y2="490" stroke="#e3e2db"/>
<text x="363.5" y="511" font-size="11.5" fill="#8a8880" text-anchor="middle">50%</text>
<line x1="497.2" y1="208" x2="497.2" y2="490" stroke="#e3e2db"/>
<text x="497.2" y="511" font-size="11.5" fill="#8a8880" text-anchor="middle">75%</text>
<line x1="631.0" y1="208" x2="631.0" y2="490" stroke="#e3e2db"/>
<text x="631.0" y="511" font-size="11.5" fill="#8a8880" text-anchor="middle">100%</text>
<line x1="764.7" y1="208" x2="764.7" y2="490" stroke="#e3e2db"/>
<text x="764.7" y="511" font-size="11.5" fill="#8a8880" text-anchor="middle">125%</text>
<line x1="96" y1="410.5" x2="790" y2="410.5" stroke="#e3e2db"/>
<text x="86" y="414.5" font-size="11.5" fill="#8a8880" text-anchor="end">20%</text>
<line x1="96" y1="330.9" x2="790" y2="330.9" stroke="#e3e2db"/>
<text x="86" y="334.9" font-size="11.5" fill="#8a8880" text-anchor="end">40%</text>
<line x1="96" y1="251.4" x2="790" y2="251.4" stroke="#e3e2db"/>
<text x="86" y="255.4" font-size="11.5" fill="#8a8880" text-anchor="end">60%</text>
<text x="36" y="194" font-size="11.5" fill="#8a8880">share of that family still waiting</text>
<text x="443" y="532" font-size="11.5" fill="#8a8880" text-anchor="middle">decisions per application received, since 2025</text>
<circle cx="427.2" cy="286.6" r="13.7" fill="#a8324a" fill-opacity="0.32" stroke="#a8324a" stroke-width="2.2"/>
<circle cx="715.6" cy="377.1" r="21.0" fill="#2361b0" fill-opacity="0.32" stroke="#2361b0" stroke-width="2.2"/>
<circle cx="559.2" cy="431.2" r="19.4" fill="#2361b0" fill-opacity="0.32" stroke="#2361b0" stroke-width="2.2"/>
<circle cx="419.8" cy="291.2" r="12.7" fill="#a8324a" fill-opacity="0.32" stroke="#a8324a" stroke-width="2.2"/>
<circle cx="277.9" cy="244.8" r="12.5" fill="#a8324a" fill-opacity="0.32" stroke="#a8324a" stroke-width="2.2"/>
<circle cx="283.2" cy="254.8" r="13.0" fill="#a8324a" fill-opacity="0.32" stroke="#a8324a" stroke-width="2.2"/>
<line x1="263.4" y1="244.8" x2="261.4" y2="218.3" stroke="#a8324a" stroke-width="0.7"/>
<text x="224.4" y="222.3" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Land-based</text>
<line x1="298.3" y1="254.8" x2="300.3" y2="227.7" stroke="#a8324a" stroke-width="0.7"/>
<text x="340.6" y="231.7" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">New licence</text>
<line x1="442.9" y1="286.6" x2="444.9" y2="258.8" stroke="#a8324a" stroke-width="0.7"/>
<text x="488.5" y="262.8" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">New sea site</text>
<line x1="405.1" y1="291.2" x2="403.1" y2="264.5" stroke="#a8324a" stroke-width="0.7"/>
<text x="349.6" y="268.5" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Special purpose</text>
<text x="715.6" y="346.1" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Change existing site</text>
<text x="559.2" y="401.8" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Co-location</text>
<line x1="36" y1="550" x2="964" y2="550" stroke="#e3e2db"/>
<text x="36" y="572" font-size="13" fill="#0b0b0b"><tspan font-weight="600">New capacity averages 55% outstanding; modifications 22%.</tspan> The two groups do not overlap on either axis.</text>
<text x="36" y="594" font-size="12.5" fill="#52514e">Land-based is the most outstanding family of all at 62%, having previously been described in this recipe as close to automatic.</text>
<text x="36" y="627" font-size="11.5" fill="#8a8880">Clear rate is decisions over arrivals since 2025 and can exceed 100% when a family is working through its own backlog. Families under 25 applications omitted.</text>
</svg>