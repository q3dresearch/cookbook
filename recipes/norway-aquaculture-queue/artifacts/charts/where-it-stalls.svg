<text x="36" y="712" font-size="13" fill="#0b0b0b"><tspan font-weight="600">Where you apply changes the wait more than what you apply for</tspan> &#8212; and the county is the wrong unit to ask it in.</text>
<text x="36" y="734" font-size="13" fill="#0b0b0b">Nordland&#8217;s two production areas sit at opposite ends of this chart, 3.6x apart, inside one county and one application type.</text>
<text x="36" y="760" font-size="11.5" fill="#8a8880">Read with drift.svg, which shows the same thing in time: the national median barely moved while the 90th percentile went 202 to 1,000 days. This chart says where that tail lives.</text>
<text x="36" y="782" font-size="11.5" fill="#8a8880">The register does not say why. Vestfjorden og Vester&#229;len is production area 8, repeatedly red under the traffic-light system, but that is an outside fact this recipe has not tested.</text>
<text x="36" y="804" font-size="11.5" fill="#8a8880">46 pending and 49 decided sea-site applications carry no production area and cannot appear here &#8212; the largest single pending group in the register.</text>
<text x="36" y="826" font-size="11.5" fill="#8a8880">Areas under 10 decisions are omitted. Source: Fiskeridirektoratet Akvakults&#248;knader, layers 0 and 4.</text>
</svg>