<text x="790" y="314" font-size="12" fill="#52514e">one area only</text>
<text x="766" y="364" font-size="11.5" font-weight="600" fill="#52514e">Decisions</text>
<circle cx="782" cy="394" r="12.6" fill="none" stroke="#8a8880" stroke-width="1.2"/>
<text x="810" y="398" font-size="11" fill="#8a8880">10</text>
<circle cx="782" cy="434" r="18.2" fill="none" stroke="#8a8880" stroke-width="1.2"/>
<text x="810" y="438" font-size="11" fill="#8a8880">30</text>
<line x1="36" y1="844" x2="1004" y2="844" stroke="#e3e2db"/>
<text x="36" y="868" font-size="13" fill="#0b0b0b"><tspan font-weight="600">Where you apply moves the wait more than what you apply for.</tspan> Vestfjorden og Vester&#229;len is slow for everyone; Nordhordland til Stadt</text>
<text x="36" y="889" font-size="13" fill="#0b0b0b">is fast for most and catastrophic for a tenth. Those need opposite responses, and one national median hides both.</text>
<text x="36" y="914" font-size="11.5" fill="#8a8880">Dividers are the median across areas, not a chosen threshold. 10&#8211;29 decisions per area, so read the two extremes, not the middle. 46 pending applications carry no production area.</text>
<text x="36" y="934" font-size="11.5" fill="#8a8880">Source: Fiskeridirektoratet Akvakults&#248;knader, layers 0 and 4. Why area 8 runs at 754 days is not in this register &#8212; see the recipe.</text>
</svg>