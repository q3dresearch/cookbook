<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">Two different ways to wait, and the county average describes neither</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Sea-site applications by production area. Across is the typical wait, up is the unlucky one. Far right means slow for everyone;</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">high but left means a lottery &#8212; most applicants fine, one in ten stranded. Grey lines join areas in the same county.</text>
<text x="36" y="112" font-size="12" fill="#8a8880">Nordland holds both extremes: 754 days in Vestfjorden og Vester&#229;len, 212 in Helgeland til Bod&#248;. One application type throughout.</text>
