<text x="243.1" y="671.0" font-size="11.5" fill="#52514e" text-anchor="start">Nordmøre og Sør-Trøndelag</text>
<text x="198.6" y="388.7" font-size="11.5" fill="#52514e" text-anchor="start">Helgeland til Bodø</text>
