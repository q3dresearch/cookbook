<line x1="36" y1="538" x2="964" y2="538" stroke="#e3e2db"/>
<text x="36" y="560" font-size="13" fill="#0b0b0b"><tspan font-weight="600">New sea space is 14%&#8211;39%; going onto land is 27%&#8211;94%.</tspan> The gap holds at every reading, but neither is the single number it was reported as.</text>
<text x="36" y="582" font-size="12.5" fill="#52514e">Land-based was previously called &#8220;close to automatic&#8221; at 94%. Counting the applicants who withdrew, it is 70%.</text>
<text x="36" y="610" font-size="11.5" fill="#8a8880">Families with fewer than 25 applications are omitted. Source: Fiskeridirektoratet Akvakultursøknader, layers 0 and 4, fetched 2026-09-10.</text>
</svg>