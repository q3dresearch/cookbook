<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="704" viewBox="0 0 1000 704" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="1000" height="704" fill="#fcfcfb"/>
<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">The approval rate is a range, and the published number is its ceiling</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Each bar runs from the floor &#8212; every pending application refused &#8212; to the figure a decided-only reading gives.</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">Refusals take a median of 359 days against 129 for grants, so the pending pile skews toward refusal and the truth sits low in each bar.</text>
<circle cx="42" cy="118" r="6" fill="#a8324a"/>
<text x="54" y="122" font-size="12" fill="#52514e">floor: pending all refused</text>
<circle cx="266" cy="118" r="6" fill="#2361b0"/>
<text x="278" y="122" font-size="12" fill="#52514e">counting withdrawals as not granted</text>
<circle cx="596" cy="118" r="6" fill="#b9c9e2" stroke="#8a8880" stroke-width="1.2"/>
<text x="608" y="122" font-size="12" fill="#52514e">as previously published</text>
