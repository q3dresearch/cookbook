<text x="36" y="630" font-size="13" fill="#0b0b0b"><tspan font-weight="600">The register shed 1,358 net sites while national output rose.</tspan> Capacity came from replacing 780-tonne sites with 3,000-tonne ones,</text>
<text x="36" y="650" font-size="13" fill="#0b0b0b">not from opening ground. That lever is spent: the deletion flow has fallen from 372 sites a year to 19.</text>
<text x="36" y="676" font-size="11.5" fill="#8a8880">Read with constraint.svg. No site lifespan is plotted: the register starts 1991, so age at deletion is left-truncated and rises one year per calendar year as an artefact.</text>
<text x="36" y="696" font-size="11.5" fill="#8a8880">Pre-2006 clearances are digitisation, not building. Capacity of active sites is as recorded today. Source: Fiskeridirektoratet Akvakulturregisteret, layers 0 and 1, paged.</text>
