<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">Norway grew salmon by deleting sites, not adding them</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Every licensed site entering or leaving the register, 2006&#8211;2025. Height is the median capacity of the sites moving that year;</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">area is how many. 2,462 sites were struck off against 1,104 cleared &#8212; a net loss of 1,358 sites.</text>
<text x="36" y="112" font-size="12" fill="#8a8880">The ones leaving were small and the ones arriving were not, so capacity rose while the site count fell. After 2016 both flows go quiet.</text>
