<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">The typical wait barely moved. The unlucky one quadrupled.</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Days from application to decision, by quarter decided. Box is the middle half, whiskers reach the 10th and 90th</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">percentiles, the line inside is the median. Boxes widening around a stable centre is a queue growing a tail, not slowing evenly.</text>
<text x="36" y="112" font-size="12.5" fill="#8a8880">Median 161d to 265d. Ninetieth percentile 202d to 1000d.</text>
<text x="36" y="208" font-size="12.5" font-weight="600" fill="#b5651d">days to a decision</text>
