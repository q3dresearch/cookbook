<text x="36" y="588" font-size="13" fill="#0b0b0b"><tspan font-weight="600">A median would have reported this as &#8220;decisions slowed from 161 to 265 days&#8221;.</tspan> The middle half barely moved; the top tenth went from 202 days to 1000.</text>
<text x="36" y="610" font-size="12.5" fill="#52514e">Refusals take a median 359 days against 129 for grants, so a lengthening tail is where the refusals accumulate &#8212; and the pending pile inherits them.</text>
<text x="36" y="632" font-size="11.5" fill="#8a8880">Two scales on one plot: boxes read the left axis in days, the line reads the right in per cent. They are independent &#8212; the vertical distance between them means nothing.</text>
<text x="36" y="656" font-size="11.5" fill="#8a8880">Quarters with fewer than 12 decisions omitted; the final quarter is partial. Withdrawn applications carry no date and cannot appear.</text>
<text x="36" y="678" font-size="11.5" fill="#8a8880">Source: Fiskeridirektoratet Akvakultursøknader.</text>
