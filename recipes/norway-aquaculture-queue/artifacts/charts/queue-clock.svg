<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">The queue has never once shrunk</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Applications waiting at the end of each month, and the monthly flows that produce it. The register opens in 2023-02 with</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">4 applications, so the first year is a system filling up. What follows is not.</text>
<text x="36" y="112" font-size="12" fill="#8a8880">The stock is an upper bound: 80 applications were withdrawn and no withdrawal date is published, so they cannot be removed on the month they left.</text>
<text x="36" y="178" font-size="12.5" font-weight="600" fill="#0b0b0b">Applications waiting, end of month</text>
