<text x="36" y="688" font-size="13" fill="#0b0b0b"><tspan font-weight="600">Since 2025 the regulator has decided 396 applications and received 522.</tspan> It resolves about 76% of what arrives, so the pile grows by roughly one in 4.</text>
<text x="36" y="710" font-size="12.5" fill="#52514e">A queue that clears would show the two lines crossing. They have not crossed for a sustained period in three and a half years.</text>
<text x="36" y="738" font-size="11.5" fill="#8a8880">Source: Fiskeridirektoratet Akvakultursøknader, layers 0 and 4. The final month is partial. Withdrawals leave the stock only at the end, not when they occurred.</text>
