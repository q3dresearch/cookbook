<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" role="img" aria-label="A replaced human-hour costs $0.74 to $1.45, not $70">
<title>A replaced human-hour costs $0.74 to $1.45, not $70</title>
<desc>Dot plot on a log scale of AI dollars per human-hour equivalent for six task types against a $70 loaded human hourly rate. Agentic code is $0.74 (95x cheaper), CAD $1.45 (48x cheaper).</desc>
