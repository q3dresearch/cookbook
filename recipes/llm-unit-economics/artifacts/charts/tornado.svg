<text x="36.0" y="89.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Model: llm_econ.py Monte Carlo, Claude Sonnet 4.6 · 4,000 runs per driver · base cost in each panel title</text>
