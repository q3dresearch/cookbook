<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-label="Optimize tokens for reliable work; reliability for judgment work">
<title>Optimize tokens for reliable work; reliability for judgment work</title>
<desc>Two tornado panels comparing one-at-a-time P10 to P90 cost swings for agentic code and a knowledge deliverable. Code is driven by token volume ($6.18), knowledge work by remediation ($12.27).</desc>
