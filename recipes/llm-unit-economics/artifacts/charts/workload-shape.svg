<svg xmlns="http://www.w3.org/2000/svg" width="980" height="590" viewBox="0 0 980 590" role="img" aria-label="Code and RAG are input-heavy; SVG is output-heavy">
<title>Code and RAG are input-heavy; SVG is output-heavy</title>
<desc>Dumbbell chart of input and output tokens per task on a log scale. RAG is 83:1 input-heavy, agentic code 55:1, knowledge work 23:1, chat 7.5:1, CAD 3:1 and SVG 1:6 output-heavy.</desc>
