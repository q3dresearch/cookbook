<text x="36.0" y="44.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="600">Code and RAG are input-heavy; SVG is output-heavy</text>
<text x="36.0" y="69.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">Tokens per task on a log scale. The ratio decides which lever exists: a cache can only help the side that is re-sent.</text>
<text x="36.0" y="89.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Model: llm_econ.py task profiles, seeded from Vantage, GDPval and Playcode · 2026</text>
