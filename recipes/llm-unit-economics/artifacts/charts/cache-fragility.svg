<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-label="The cache is either warm or it is not">
<title>The cache is either warm or it is not</title>
<desc>Two panels. Left: session cost against seconds between turns for three models, with a cliff at the 300-second TTL. Right: session cost against cache hit rate, showing that a 70% hit rate costs 2.7x the fully-warm bill.</desc>
<rect width="980" height="540" fill="#fcfcfb"/>
<text x="36.0" y="44.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="600">The cache is either warm or it is not</text>
<text x="36.0" y="69.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">Left: idle time between turns against session cost. Right: the fraction of the prefix that hits. One is a cliff; the other is a slow leak.</text>
<text x="36.0" y="89.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Model: llm_econ.py · 30-turn agent loop, append caching · Claude Sonnet 4.6, Gemini 3.1 Pro, DeepSeek V4 Flash</text>
