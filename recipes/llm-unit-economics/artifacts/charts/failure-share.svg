<text x="230.0" y="522.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" font-variant-numeric="tabular-nums">$0</text>
<line x1="344.0" y1="148.0" x2="344.0" y2="504.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="344.0" y="522.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" font-variant-numeric="tabular-nums">$2</text>
<line x1="457.9" y1="148.0" x2="457.9" y2="504.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="457.9" y="522.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" font-variant-numeric="tabular-nums">$4</text>
<line x1="571.9" y1="148.0" x2="571.9" y2="504.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="571.9" y="522.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" font-variant-numeric="tabular-nums">$6</text>
<line x1="685.8" y1="148.0" x2="685.8" y2="504.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="685.8" y="522.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" font-variant-numeric="tabular-nums">$8</text>
<text x="475.0" y="546.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">$ per solved task</text>
