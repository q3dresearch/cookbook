<text x="36.0" y="586.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Moving this task from DeepSeek to Sonnet changes the solved cost only ~1.3x, despite a ~30x token-price gap: remediation dominates.</text>
