<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-label="For hard work, most of the bill is failure cleanup">
<title>For hard work, most of the bill is failure cleanup</title>
<desc>Stacked horizontal bars of expected cost per solved task for six task types, split into attempt cost and failure cleanup. Knowledge work is 77% cleanup, CAD 83%, agentic code 20% and chat 8%.</desc>
<rect width="980" height="600" fill="#fcfcfb"/>
<text x="36.0" y="44.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="600">For hard work, most of the bill is failure cleanup</text>
<text x="36.0" y="69.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">Expected cost per solved task, Claude Sonnet 4.6. Orange is (1 - p) times remediation, blue is attempts divided by p. The total is the bar.</text>
<text x="36.0" y="89.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Model: llm_econ.py task profiles · p(success) and remediation are assumptions, not invoices</text>
<circle cx="41.0" cy="112.0" r="5.0" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/>
<text x="60.0" y="116.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">attempt cost</text>
<circle cx="165.8" cy="112.0" r="5.0" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/>
<text x="184.8" y="116.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">failure cleanup</text>
