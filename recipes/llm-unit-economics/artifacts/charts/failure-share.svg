<text x="36.0" y="185.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">p(success) 60%</text>
<path d="M230.0,153.0 h97.7 q4.0,0 4.0,4.0 v14.0 q0,4.0 -4.0,4.0 h-97.7 z" fill="#2a78d6" fill-opacity="1.0"/>
