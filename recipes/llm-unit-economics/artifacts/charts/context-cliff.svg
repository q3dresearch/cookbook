<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="The 200K cliff is a step, not a slope">
<title>The 200K cliff is a step, not a slope</title>
<desc>Cost of one request with a 5,000-token output against prompt length for Claude Sonnet 4.6, Gemini 3.1 Pro and DeepSeek V4 Flash. The tiered Gemini line steps at 200K and rises 8.9x to 1M, against 4.6x for the flat model.</desc>
<rect width="980" height="560" fill="#fcfcfb"/>
<text x="36.0" y="44.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="600">The 200K cliff is a step, not a slope</text>
<text x="36.0" y="69.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">One request with 5,000 output tokens. The tiered prompt is re-priced in full above the line, so 200K to 1M costs 8.9x against 4.6x flat.</text>
<text x="36.0" y="89.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Model: llm_econ.py · list prices, early 2026 · tier multiplier applies to the whole request</text>
