<text x="36.0" y="89.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Sources: Requesty coding-agent telemetry, GitHub Copilot production study · Apr 2026 · shares are fractions of the cacheable prefix</text>
