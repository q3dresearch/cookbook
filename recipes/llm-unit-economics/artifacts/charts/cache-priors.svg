<svg xmlns="http://www.w3.org/2000/svg" width="980" height="610" viewBox="0 0 980 610" role="img" aria-label="Real cache-hit rates are 8% to 92%, not 100%">
<title>Real cache-hit rates are 8% to 92%, not 100%</title>
<desc>Horizontal bars of session-level cache hit rate for ten coding agents and conditions, from Claude Code at 91.9% to Copilot on a model switch at 8%, against a 100% reference line.</desc>
