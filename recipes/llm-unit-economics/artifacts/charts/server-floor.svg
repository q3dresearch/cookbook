<line x1="336.8" y1="144.0" x2="354.8" y2="144.0" stroke="#1baf7a" stroke-width="2"/>
<text x="360.8" y="148.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">671B MLA (40B active)</text>
<line x1="519.2" y1="144.0" x2="537.2" y2="144.0" stroke="#52514e" stroke-width="2"/>
