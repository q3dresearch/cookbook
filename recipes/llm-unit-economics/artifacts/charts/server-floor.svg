<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-label="At 1M context the GPU floor crosses the list price">
<title>At 1M context the GPU floor crosses the list price</title>
<desc>Log-log chart of server GPU cost per request against context length for 70B GQA, hybrid-attention 70B and 671B MLA, against a flat $3 per million list price. At 1M the GQA floor is $3.92 against $3.02 list, while hybrid is $1.16.</desc>
<rect width="980" height="600" fill="#fcfcfb"/>
<text x="36.0" y="44.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="600">At 1M context the GPU floor crosses the list price</text>
<text x="36.0" y="69.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">One request, 1,000 output tokens, batch 64 (compute only). Long-context serving is compute-bound, so the floor rises faster than a per-token quote.</text>
<text x="36.0" y="89.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Model: llm_econ.py · H100 at $2.50/hr, 8x H100 at $20/hr · MFU 0.50, MBU 0.75 · floor only</text>
