<text x="421.9" y="231.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">against a $3.02 list price. Hybrid:</text>
<text x="421.9" y="247.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">$1.16, still above water.</text>
<text x="36.0" y="548.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Hybrid attention (one full layer in four) cuts the 1M floor 3.4x. A cache hit removes prefill but not the KV reads during decode.</text>
<text x="36.0" y="566.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Compute floor only: at 1M the 70B GQA KV is 164 GB per sequence, beyond one 80 GB H100. Not a deployable configuration.</text>
</svg>
