<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-label="Cache the whole history, not a prefix">
<title>Cache the whole history, not a prefix</title>
<desc>Session cost of a 30-turn agent loop for five models under three caching policies. No cache and fixed-prefix caching are almost identical; appending the whole history cuts the Claude Sonnet bill from $17.44 to $3.23, 82%.</desc>
<rect width="980" height="620" fill="#fcfcfb"/>
<text x="36.0" y="44.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="600">Cache the whole history, not a prefix</text>
<text x="36.0" y="69.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">30-turn agent loop, 10K to 372K context. Appending the history cuts the bill 82%; caching a fixed 8K prefix cuts it 4%.</text>
<text x="36.0" y="89.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Model: llm_econ.py · Claude Sonnet 4.6 list prices, early 2026 · $ per 30-turn session</text>
