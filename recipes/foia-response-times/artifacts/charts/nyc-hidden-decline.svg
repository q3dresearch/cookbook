 x="978.0" y="288.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#eb6834" text-anchor="start" font-weight="600">it reports 79% against a true 56%.</text><text x="978.0" y="316.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Requests not yet past their due date</text><text x="978.0" y="331.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">are excluded from both measures</text><text x="978.0" y="346.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">rather than counted as failures.</text><text x="978.0" y="361.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">2026 is a partial year.</text><text x="74.0" y="528.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: data.cityofnewyork.us/kegn-anvq (OpenRecords FOIL), requests submitted 2016-2026 carrying a due date.</text></svg>