<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="732" viewBox="0 0 1200 732"><rect width="1200" height="732" fill="#ffffff"/><text x="74.0" y="46.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1c2530" text-anchor="start" font-weight="600">Two agencies are the whole backlog, and only one of them moved its deadline</text><text x="74.0" y="74.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7684" text-anchor="start" font-weight="normal">Every New York City agency with at least 200 dated requests in both 2018 and 2025, ranked by its share of the 71,326 requests</text><text x="74.0" y="94.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7684" text-anchor="start" font-weight="normal">sitting open past their deadline. The citywide figures in this recipe are these agencies wearing a city's name.</text><text x="330.0" y="172.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">Median days the agency allowed itself</text><circle cx="336.0" cy="192.0" r="4.6" fill="#8a8880" stroke="none" stroke-width="1"/><text x="346.0" y="196.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">2018</text><circle cx="396.0" cy="192.0" r="5.4" fill="#c9541f" stroke="none" stroke-width="1"/><text x="408.0" y="196.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9541f" text-anchor="start" font-weight="600">2025</text><text x="706.0" y="172.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="sta