rect x="706.0" y="298.0" width="261.3" height="16.0" fill="#b3261e" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="976.3" y="310.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#b3261e" text-anchor="start" font-weight="600">87%</text><text x="316.0" y="356.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">Department of Housing Preservation</text><text x="316.0" y="371.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">574 open · 1% of the backlog</text><line x1="406.4" y1="352.0" x2="475.4" y2="352.0" stroke="#c9541f" stroke-width="2.4"/><circle cx="406.4" cy="352.0" r="4.6" fill="#8a8880" stroke="none" stroke-width="1"/><circle cx="475.4" cy="352.0" r="5.4" fill="#c9541f" stroke="none" stroke-width="1"/><text x="486.4" y="356.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9541f" text-anchor="start" font-weight="600">51 to 97   +46d</text><rect x="706.0" y="344.0" width="14.3" height="16.0" fill="#8a8880" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="729.3" y="356.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">5%</text><text x="316.0" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">Department of Transportation</text><text x="316.0" y="417.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">294 open · 0% of the backlog</text><line x1="542.8" y1="398.0" x2="602.7" y2="398.0" stroke="#c9541f" stroke-width="2.4"/><circle cx="542.8" cy="398.0" r="4.6" fill="#8a8880" stroke="none" stroke-width="1"/><circle cx="602.7" cy="398.0" r="5.4" fill="#c9541f" stroke="none" stroke-width="1"/><text x="613.7" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9541f" text-anchor="start" font-weight="600">142 to 182   +40d</text><rect x="706.0" y="390.0" width="2.2" height="16.0" fill="#8a8880" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="717.2" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">1%</text><text x="316.0" y="448.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">Department of Environmental Protec</text><text x="316.0" y="463.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">249 open · 0% of the backlog</text><line x1="538.3" y1="444.0" x2="476.9" y2="444.0" stroke="#8a8880" stroke-width="2.4"/><circle cx="538.3" cy="444.0" r="4.6" fill="#8a8880" stroke="none" stroke-width="1"/><circle cx="476.9" cy="444.0" r="5.4" fill="#8a8880" stroke="none" stroke-width="1"/><text x="549.3" y="448.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">139 to 98</text><rect x="706.0" y="436.0" width="2.2" height="16.0" fill="#8a8880" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="717.2" y="448.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">1%</text><text x="316.0" y="494.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">Department of City Planning</text><text x="316.0" y="509.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">170 open · 0% of the backlog</text><line x1="424.4" y1="490.0" x2="389.9" y2="490.0" stroke="#8a8880" stroke-width="2.4"/><circle cx="424.4" cy="490.0" r="4.6" fill="#8a8880" stroke="none" stroke-width="1"/><circle cx="389.9" cy="490.0" r="5.4" fill="#8a8880" stroke="none" stroke-width="1"/><text x="435.4" y="494.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">63 to 40</text><rect x="706.0" y="482.0" width="25.1" height="16.0" fill="#8a8880" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="740.1" y="494.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">8%</text><text x="316.0" y="540.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">Department of Buildings</text><text x="316.0" y="555.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">16 open · 0% of the backlog</text><line x1="467.9" y1="536.0" x2="472.4" y2="536.0" stroke="#8a8880" stroke-width="2.4"/><circle cx="467.9" cy="536.0" r="4.6" fill="#8a8880" stroke="none" stroke-width="1"/><circle cx="472.4" cy="536.0" r="5.4" fill="#8a8880" stroke="none" stroke-width="1"/><text x="483.4" y="540.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">92 to 95</text><rect x="706.0" y="528.0" width="2.0" height="16.0" fill="#8a8880" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="715.1" y="540.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">0%</text><line x1="74.0" y1="602.0" x2="1160.0" y2="602.0" stroke="#dfe4ea" stroke-width="1"/><text x="74.0" y="624.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="normal">Extending the window and abandoning the queue are different failures. The police department did the first — 55 days to 139 — and its on-time</text><text x="74.0" y="642.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="normal">rate rose without answering anything faster. The fire department did the second: it never moved its deadline and simply stopped closing.</text><text x="74.0" y="660.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="normal">Capping the allowed window would reach one of them and not the other.</text><text x="74.0" y="702.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: data.cityofnewyork.us/kegn-anvq. Backlog measured on requests received from 2021; window medians on requests received in 2018 and 2025.</text><text x="74.0" y="719.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Agencies with fewer than 200 dated requests in either year, or fewer than 500 since 2021, are omitted.</text></svg>