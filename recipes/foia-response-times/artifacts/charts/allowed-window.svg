<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="716" viewBox="0 0 1180 716"><rect width="1180" height="716" fill="#ffffff"/><text x="74.0" y="46.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1c2530" text-anchor="start" font-weight="600">New York almost tripled its own deadline and did not get any faster</text><text x="74.0" y="114.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">This citywide median is mostly one agency: see agency-backlog.svg. The police department went 55 days to 139; the fire department, holding a third of the backlog, never moved.</text><text x="74.0" y="73.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7684" text-anchor="start" font-weight="normal">Median days a request was ALLOWED, against median days it actually TOOK. 641,517 FOIL requests carrying both dates.</text><text x="74.0" y="95.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7684" text-anchor="start" font-weight="normal">The deadline is set by the agency. Raising it raises the on-time rate without answering anything faster.</text><circle cx="79.0" cy="126.0" r="5" fill="#c9541f" stroke="none" stroke-width="1"/><text x="90.0" y="130.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9541f" text-anchor="start" font-weight="600">Days allowed — the agency's own deadline</text><circle cx="404.0" cy="126.0" r="5" fill="#5b5f66" stroke="none" stroke-width="1"/><text x="415.0" y="130.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b5f66" text-anchor="start" font-weight="600">Days actually taken to close</text><line x1="74.0" y1="343.6" x2="930.0" y2="343.6" stroke="#dfe4ea" stroke-width="1"/><text x="64.0" y="347.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">40</text><line x1="74.0" y1="283.3" x2="930.0" y2="283.3" stroke="#dfe4ea" stroke-width="1"/><text x="64.0" y="287.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">80</text><line x1="74.0" y1="222.9" x2="930.0" y2="222.9" stroke="#dfe4ea" stroke-width="1"/><text x="64.0" y="226.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">120</text><text x="64.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">days</text><line x1="74.0" y1="348.2" x2="159.6" y2="349.7" stroke="#c9541f" stroke-width="2.6"/><line x1="159.6" y1="349.7" x2="245.2" y2="324.0" stroke="#c9541f" stroke-width="2.6"/><line x1="245.2" y1="324.0" x2="330.8" y2="265.2" stroke="#c9541f" stroke-width="2.6"/><line x1="330.8" y1="265.2" x2="416.4" y2="325.5" stroke="#c9541f" stroke-width="2.6"/><line x1="416.4" y1="325.5" x2="502.0" y2="259.1" stroke="#c9541f" stroke-width="2.6"/><line x1="502.0" y1="259.1" x2="587.6" y2="244.1" stroke="#c9541f" stroke-width="2.6"/><line x1="587.6" y1="244.1" x2="673.2" y2="200.3" stroke="#c9541f" stroke-width="2.6"/><line x1="673.2" y1="200.3" x2="758.8" y2="198.8" stroke="#c9541f" stroke-width="2.6"/><line x1="758.8" y1="198.8" x2="844.4" y2="198.8" stroke="#c9541f" stroke-width="2.6"/><line x1="844.4" y1="198.8" x2="930.0" y2="200.3" stroke="#c9541f" stroke-width="2.6"/><circle cx="74.0" cy="348.2" r="4.6" fill="#c9541f" stroke="none" stroke-width="1"/><circl