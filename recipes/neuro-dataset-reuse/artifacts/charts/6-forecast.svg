<text x="912.0" y="168.0" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">if you are told to fund on expected reuse</text>
<text x="912.0" y="183.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">You cannot. At the decision, 61%</text>
<text x="912.0" y="195.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">of the eventual cost per</text>
<text x="912.0" y="208.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">download is undetermined by</text>
<text x="912.0" y="220.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">anything on the application. The</text>
<text x="912.0" y="233.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">$340 dataset and the $4.85m one</text>
<text x="912.0" y="245.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">look the same.</text>
<text x="912.0" y="272.0" font-size="10.5" fill="#c07a1e" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">if you are tempted by an in-sample fit</text>
<text x="912.0" y="287.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Every hollow mark is a model</text>
<text x="912.0" y="299.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">flattering itself. On 86 rows,</text>
<text x="912.0" y="312.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">'everything observable' explains</text>
<text x="912.0" y="324.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">19% of its own data and less</text>
<text x="912.0" y="337.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">than nothing of anyone else's.</text>
<text x="912.0" y="363.5" font-size="10.5" fill="#9aa4ad" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">what the money actually buys</text>
<text x="912.0" y="378.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Not reuse. Award against</text>
<text x="912.0" y="391.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">downloads is r = -0.15, t =</text>
<text x="912.0" y="403.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">-1.40. A bigger grant does not</text>
<text x="912.0" y="416.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">produce a more-taken dataset.</text>
<text x="912.0" y="442.5" font-size="10.5" fill="#4a7fa8" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">the one lever, and it is not financial</text>
<text x="912.0" y="457.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Holding subject count fixed,</text>
<text x="912.0" y="470.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">every modality beats MRI -- PET</text>
<text x="912.0" y="482.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">by 2.53x -- and MRI is 66% of</text>
<text x="912.0" y="495.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the archive. Scale is not a</text>
<text x="912.0" y="507.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">lever: doubling a cohort returns</text>
<text x="912.0" y="520.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">16%.</text>
<text x="912.0" y="546.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">what would change this</text>
<text x="912.0" y="561.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">A predictor nobody has tried:</text>
<text x="912.0" y="574.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the task or paradigm. It is the</text>
<text x="912.0" y="586.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">field most likely to carry</text>
<text x="912.0" y="599.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">demand and OpenNeuro does not</text>
<text x="912.0" y="611.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">record it in countable form.</text>
<line x1="28" y1="700.0" x2="1152" y2="700.0" stroke="#e3e2db"/>
<text x="28.0" y="718.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">OpenNeuro GraphQL and NIH RePORTER v2, both keyless, fetched 2026-09-24. Target is log10 downloads per year since publication, which removes the age confound in a cumulative</text>
<text x="28.0" y="732.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">count. Held-out R2 from ten-fold cross-validation, seeded. The variance split is exact in log units because award and downloads are uncorrelated. CAVEAT: a download is not a</text>
<text x="28.0" y="746.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">citation, and 'everything observable' is only everything OpenNeuro records.</text>
