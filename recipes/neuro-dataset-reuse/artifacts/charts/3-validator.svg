<text x="880.0" y="307.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">move the year instead: 2024</text>
<text x="880.0" y="319.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">54%, 2025 70%. The rate rose.</text>
<text x="880.0" y="346.0" font-size="10.5" fill="#c07a1e" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">v2 reclassifies, it does not miss</text>
