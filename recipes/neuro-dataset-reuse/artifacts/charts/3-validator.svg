<text x="880.0" y="465.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">field -- see superseded/.</text>
<line x1="28" y1="800.0" x2="1152" y2="800.0" stroke="#e3e2db"/>
<text x="28.0" y="818.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">OpenNeuro GraphQL API, no key, fetched 2026-09-24; latestSnapshot.validation and summary.validatorMetadata. Drawn from 2023 because fewer than a fifth of earlier datasets</text>
<text x="28.0" y="832.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">carry a version stamp at all. A version line is plotted only where that cell holds at least 15 datasets. CAVEAT: v3 is grouped with v2, which its rate supports; and the 803</text>
<text x="28.0" y="846.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">unstamped datasets are excluded from the split rather than assigned to v1.</text>
