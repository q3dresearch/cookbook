<text x="892.0" y="178.0" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">one critique answered, one not</text>
<text x="892.0" y="193.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Median 54% female here,</text>
<text x="892.0" y="205.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">against 18-25s at 4.4x their</text>
<text x="892.0" y="218.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">population share on plate 11.</text>
<text x="892.0" y="230.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The same community did one and</text>
<text x="892.0" y="243.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">not the other.</text>
<text x="892.0" y="269.5" font-size="10.5" fill="#1b7f5a" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">it is not an averaging artifact</text>
<text x="892.0" y="284.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The median WITHIN a dataset is</text>
<text x="892.0" y="297.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">54%, not just the pool. It</text>
<text x="892.0" y="309.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">holds in every modality, from</text>
<text x="892.0" y="322.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">iEEG at 49% to MRI at 55%.</text>
<text x="892.0" y="348.5" font-size="10.5" fill="#c07a1e" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">a third are still outside the band</text>
<text x="892.0" y="363.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">32% sit beyond 35-65, which is</text>
<text x="892.0" y="376.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">not automatically a fault — a</text>
<text x="892.0" y="388.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">study of pregnancy has a</text>
<text x="892.0" y="401.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">reason.</text>
<text x="892.0" y="427.5" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">the gap is blank, not wrong</text>
<text x="892.0" y="442.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">44,309 records have no sex at</text>
<text x="892.0" y="455.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">all. A further 3,980 are bare</text>
<text x="892.0" y="467.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">numbers whose meaning lives in</text>
<text x="892.0" y="480.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">a per-dataset convention that</text>
<text x="892.0" y="492.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">is not in the record.</text>
<line x1="28" y1="630.0" x2="1152" y2="630.0" stroke="#e3e2db"/>
<text x="28.0" y="648.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">OpenNeuro GraphQL API, no key, fetched 2026-09-24; latestSnapshot.summary.subjectMetadata.sex, a field never requested until now. Classifiable means f/female/m/male in any</text>
<text x="28.0" y="662.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">case; 192 distinct raw values appear in total. Datasets need at least 10 classifiable subjects to be drawn. CAVEAT: recorded sex, not gender, and a participant in two</text>
<text x="28.0" y="676.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">datasets is counted twice.</text>
