<text x="443.0" y="530.9" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">of those checked, carried at least one error</text>
<text x="443.0" y="530.9" fill="#8c2318" font-size="9.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">of those checked, carried at least one error</text>
<rect x="794.0" y="191.5" width="90.0" height="494.0" fill="#c07a1e" fill-opacity="0.07" stroke="#c07a1e" stroke-width="1" stroke-dasharray="3 3"/>
<text x="800.0" y="183.5" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9.5" text-anchor="end" font-weight="700" style="font-variant-numeric: tabular-nums">21 and 5 datasets checked out of 318 and 336</text>
<text x="800.0" y="183.5" fill="#c07a1e" font-size="9.5" text-anchor="end" font-weight="700" style="font-variant-numeric: tabular-nums">21 and 5 datasets checked out of 318 and 336</text>
<text x="940.0" y="185.5" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">if you are picking a dataset</text>
<text x="940.0" y="200.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">From 2025 the archive gives you</text>
<text x="940.0" y="213.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">no quality signal at all. A</text>
<text x="940.0" y="225.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">recent dataset with no error</text>
<text x="940.0" y="238.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">count has not passed -- it has</text>
<text x="940.0" y="250.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">not been checked. Budget for</text>
<text x="940.0" y="263.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">running the validator yourself</text>
<text x="940.0" y="275.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">before you build on it.</text>
<text x="940.0" y="304.0" font-size="10.5" fill="#4a7fa8" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">if you are running the repository</text>
<text x="940.0" y="319.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The backlog is 819 datasets and</text>
<text x="940.0" y="331.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">it is almost entirely recent, so</text>
<text x="940.0" y="344.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">it is a re-run job and not a</text>
<text x="940.0" y="356.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">data-quality job. Clearing it is</text>
<text x="940.0" y="369.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the only thing that makes the</text>
<text x="940.0" y="381.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">last two years auditable.</text>
<text x="940.0" y="410.0" font-size="10.5" fill="#c07a1e" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">if you are citing a breakage rate</text>
<text x="940.0" y="425.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">"17% of public datasets carry</text>
<text x="940.0" y="437.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">errors" is true only of deposits</text>
<text x="940.0" y="450.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">made before 2021, because those</text>
<text x="940.0" y="462.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">are the ones that were checked.</text>
<text x="940.0" y="475.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Quoting it as a current figure</text>
<text x="940.0" y="487.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">inverts what this plate says.</text>
<text x="940.0" y="516.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">when this plate fails you</text>
<text x="940.0" y="531.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">It cannot tell an unrun</text>
<text x="940.0" y="543.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">validator from an unrecorded</text>
<text x="940.0" y="556.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">result, and those imply opposite</text>
<text x="940.0" y="568.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">repair work. If OpenNeuro's</text>
<text x="940.0" y="581.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">changelog says the field moved,</text>
<text x="940.0" y="593.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the blue line is a schema change</text>
<text x="940.0" y="606.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">and the backlog is not real.</text>
<text x="940.0" y="634.5" font-size="10.5" fill="#9aa4ad" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">the correlation is not an argument</text>
<text x="940.0" y="649.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Checked datasets with errors get</text>
<text x="940.0" y="662.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">8.8 downloads a year against</text>
<text x="940.0" y="674.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">13.5 for clean ones. Errors and</text>
<text x="940.0" y="687.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">age move together on this very</text>
<text x="940.0" y="699.5" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">plate, so do not read it as a</text>
<text x="940.0" y="712.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">penalty for being broken.</text>
<line x1="28" y1="780.0" x2="1152" y2="780.0" stroke="#e3e2db"/>
<text x="28.0" y="798.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">OpenNeuro GraphQL API, no key, fetched 2026-09-24; latestSnapshot.issuesStatus, which reports error and warning counts from the BIDS validator. A year's error rate is drawn</text>
<text x="28.0" y="812.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">only where at least 8 of its deposits were checked. CAVEAT: an absent validation result means the field is empty, not that the dataset failed -- and nothing here</text>
<text x="28.0" y="826.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">distinguishes a validator that was not run from one whose result was not attached.</text>
</svg>