<text x="28.0" y="592.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">University, hospital and individual sponsors are 74,574 of 99,557 trials here — 75% —</text>
<text x="28.0" y="607.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">so the register-wide 24.6% is mostly their rate, pulled up by a much smaller group</text>
<text x="28.0" y="622.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">reporting three times as often. Every class sits well below the diagonal, so reporting</text>
<text x="28.0" y="637.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">in years two and three is the norm everywhere, not the exception.</text>
