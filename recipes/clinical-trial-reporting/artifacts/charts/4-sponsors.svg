<text x="700.0" y="522.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">the pooled line is flat because the flat group is most of it</text>
<text x="700.0" y="540.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">NIH gained about 43 points and industry about 10 across these</text>
<text x="700.0" y="554.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">cohorts, while university and hospital sponsors gained 3 and other</text>
<text x="700.0" y="568.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">government lost ground. The dashed pooled line barely moves because</text>
<text x="700.0" y="582.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the group that did not improve is three quarters of the register.</text>
<text x="700.0" y="596.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Figure 3's flat series is composition, not stasis — and reading it</text>
<text x="700.0" y="610.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">as “nothing changed” misses that the improvement is real and</text>
<text x="700.0" y="624.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">confined.</text>
<line x1="28" y1="716.0" x2="1172" y2="716.0" stroke="#e3e2db"/>
<text x="28.0" y="734.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ClinicalTrials.gov API v2, fetched 2026-09-22. Population as figure 3: interventional, ACTUAL primary completion, not phase 1; here restricted to</text>
<text x="28.0" y="748.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">completions 2015–2021 so every class has three years of follow-up, 99,557 trials. `leadSponsorClass` names the *lead* sponsor only — a university</text>
<text x="28.0" y="762.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">running an industry-funded trial files as OTHER — so this separates who filed, not who paid, and the industry figure is a floor. Classes with under</text>
<text x="28.0" y="776.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">150 trials in the window are not drawn. Reporting means a results submission date exists; non-reporters stay in every denominator.</text>
