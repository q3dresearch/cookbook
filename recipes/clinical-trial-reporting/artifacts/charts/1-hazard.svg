<line x1="28" y1="606.0" x2="1172" y2="606.0" stroke="#e3e2db"/>
<text x="28.0" y="624.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ClinicalTrials.gov API v2, fetched 2026-09-22. Population as figure 3: interventional, ACTUAL primary completion, not phase 1 — 253,429 studies.</text>
<text x="28.0" y="638.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Hazard is computed on trials observed for the whole window and not yet reported at its start, so administrative censoring removes a trial from the</text>
<text x="28.0" y="652.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">denominator rather than counting it as a non-event. Baseline is the mean of the first four windows. Windows with under 300 trials at risk are not</text>
<text x="28.0" y="666.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">drawn, and per class the floor is 150. The hazard says nothing about the roughly three quarters who never report at all — that is figure 3's gap, and</text>
<text x="28.0" y="680.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">this figure sits on top of it.</text>
