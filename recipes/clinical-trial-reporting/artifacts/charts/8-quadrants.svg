<text x="28.0" y="598.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">they multiply, and one class is flat against both</text>
<text x="28.0" y="618.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Each variable keeps roughly its full effect with the other held fixed, so they are not</text>
<text x="28.0" y="633.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">two measurements of one thing. Other government is the exception and the interesting</text>
<text x="28.0" y="648.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">one: 2.4%, 4.5%, 4.7%, 4.3% across lead time is no gradient at all. Every other class</text>
<text x="28.0" y="663.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">responds to registration timing; that one responds to nothing measured here, which makes</text>
<text x="28.0" y="678.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">it a different problem rather than a worse version of the same one.</text>
<text x="798.0" y="600.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">what this does not separate</text>
<text x="798.0" y="600.0" fill="#8a8880" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">what this does not separate</text>
<text x="798.0" y="618.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Lead time is partly a property of the trial:</text>
<text x="798.0" y="632.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">a long study registered properly has a long</text>
<text x="798.0" y="646.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">lead by construction. “longer lead” and</text>
<text x="798.0" y="660.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">“larger, slower, better-resourced” are not</text>
<text x="798.0" y="674.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">pulled apart here.</text>
<line x1="28" y1="730.0" x2="1172" y2="730.0" stroke="#e3e2db"/>
<text x="28.0" y="748.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ClinicalTrials.gov API v2, fetched 2026-09-22. Population as figure 3, completions 2012–2021 — 130,441 trials across 17,748 distinct lead sponsors.</text>
<text x="28.0" y="762.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Sponsor scale counts trials filed under that exact sponsor name in this window, so a name that changed spelling counts twice and the large end is a</text>
<text x="28.0" y="776.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">floor. Cells with under 120 trials at three years of follow-up are not drawn.</text>
