<text x="886.0" y="392.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">registered after</text>
<text x="660.0" y="412.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The gap holds inside every class, so it is not the sponsor effect</text>
<text x="660.0" y="426.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">from figure 2 in disguise. The same trials miss both duties — one</text>
<text x="660.0" y="440.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">thing with two symptoms, and a policy aimed at either alone is aimed</text>
<text x="660.0" y="454.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">at half of it. Direction is not established: nothing here says which</text>
<text x="660.0" y="468.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">failure causes the other, or whether both follow from a third thing</text>
<text x="660.0" y="482.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the register does not record.</text>
<line x1="28" y1="636.0" x2="1172" y2="636.0" stroke="#e3e2db"/>
<text x="28.0" y="654.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ClinicalTrials.gov API v2, fetched 2026-09-22. Population as figure 3: interventional, ACTUAL primary completion, not phase 1 — 253,429 studies with</text>
<text x="28.0" y="668.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">both a first-posted date and a completion date. “Retrospective” means first posted to the register after the primary completion date: stricter than</text>
<text x="28.0" y="682.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">FDAAA, which allows 21 days after first enrolment, and looser than ICMJE, which requires registration before the first participant. It is the version</text>
<text x="28.0" y="696.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">these two fields support. Right panel is completions 2012–2021 so every cell has three years of follow-up; classes with under 150 trials on either</text>
<text x="28.0" y="710.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">side are not drawn, which is why NIH's retrospective arm is absent — it has 30.</text>
