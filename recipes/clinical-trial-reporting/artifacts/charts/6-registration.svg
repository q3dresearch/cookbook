<text x="28.0" y="568.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ICMJE has required registration before the first participant since 2005, as</text>
<text x="28.0" y="583.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">a condition of publication. A tenth of all trials are registered more than</text>
<text x="28.0" y="598.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">385 days after the work ended. The policy is twenty years old and the rate</text>
<text x="28.0" y="613.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">has not moved.</text>
