<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect width="1200" height="800" fill="#fcfcfb"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">The missing results are mostly outside the law</text>
<text x="28.0" y="62.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">FOR</text>
<text x="28.0" y="77.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">anyone reading a register-wide reporting rate as compliance</text>
<text x="409.3" y="62.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">DECIDE</text>
<text x="409.3" y="77.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">whether the gap is apathy or scope</text>
<text x="790.7" y="62.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">WRONG IF</text>
<text x="790.7" y="77.0" font-size="11.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the two statutory tests interact, or one of them does little</text>
<line x1="28" y1="86.5" x2="1172" y2="86.5" stroke="#e3e2db"/>
<text x="28.0" y="164.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">share reporting within three years, by the two tests FDAAA 801 applies</text>
<text x="367.0" y="208.0" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums">has a US site</text>
<text x="591.0" y="208.0" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums">no US site recorded</text>
<text x="246.0" y="282.0" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">drug, biologic</text>
<text x="246.0" y="295.0" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">or device</text>
<rect x="260.0" y="220.0" width="214" height="132" fill="#f0efe9" fill-opacity="0.5"/>
<rect x="260.0" y="263.5" width="214" height="88.5" fill="#1b7f5a" fill-opacity="0.55"/>
<text x="367.0" y="288.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="22" text-anchor="middle" font-weight="700" style="font-variant-numeric: tabular-nums">67.1%</text>
<text x="367.0" y="288.0" fill="#1b7f5a" font-size="22" text-anchor="middle" font-weight="700" style="font-variant-numeric: tabular-nums">67.1%</text>
<text x="367.0" y="342.0" font-size="9.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">31,934 trials</text>
<rect x="484.0" y="220.0" width="214" height="132" fill="#f0efe9" fill-opacity="0.5"/>
<rect x="484.0" y="334.4" width="214" height="17.6" fill="#c07a1e" fill-opacity="0.55"/>
<text x="591.0" y="288.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="22" text-anchor="middle" font-weight="700" style="font-variant-numeric: tabular-nums">13.3%</text>
<text x="591.0" y="288.0" fill="#c07a1e" font-size="22" text-anchor="middle" font-weight="700" style="font-variant-numeric: tabular-nums">13.3%</text>
<text x="591.0" y="342.0" font-size="9.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">38,970 trials</text>
<text x="246.0" y="424.0" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">everything else</text>
<rect x="260.0" y="362.0" width="214" height="132" fill="#f0efe9" fill-opacity="0.5"/>
<rect x="260.0" y="470.4" width="214" height="23.6" fill="#c07a1e" fill-opacity="0.55"/>
<text x="367.0" y="430.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="22" text-anchor="middle" font-weight="700" style="font-variant-numeric: tabular-nums">17.9%</text>
<text x="367.0" y="430.0" fill="#c07a1e" font-size="22" text-anchor="middle" font-weight="700" style="font-variant-numeric: tabular-nums">17.9%</text>
<text x="367.0" y="484.0" font-size="9.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">18,275 trials</text>
<rect x="484.0" y="362.0" width="214" height="132" fill="#f0efe9" fill-opacity="0.5"/>
<rect x="484.0" y="489.5" width="214" height="4.5" fill="#8c2318" fill-opacity="0.55"/>
<text x="591.0" y="430.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="22" text-anchor="middle" font-weight="700" style="font-variant-numeric: tabular-nums">3.4%</text>
<text x="591.0" y="430.0" fill="#8c2318" font-size="22" text-anchor="middle" font-weight="700" style="font-variant-numeric: tabular-nums">3.4%</text>
<text x="591.0" y="484.0" font-size="9.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">31,805 trials</text>
<text x="260.0" y="514.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">each cell is filled in proportion to its rate; the count underneath is what it rests on</text>
<text x="760.0" y="164.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">each test measured inside both levels of the other</text>
<text x="760.0" y="210.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">a US site</text>
<rect x="764.0" y="221.0" width="189.0" height="13" fill="#4a7fa8" fill-opacity="0.6"/>
<text x="957.0" y="231.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">5.0x</text>
<text x="957.0" y="231.0" fill="#4a7fa8" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">5.0x</text>
<text x="1028.0" y="231.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">among drug/device</text>
<rect x="764.0" y="243.0" width="197.1" height="13" fill="#4a7fa8" fill-opacity="0.6"/>
<text x="965.1" y="253.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">5.3x</text>
<text x="965.1" y="253.0" fill="#4a7fa8" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">5.3x</text>
<text x="1028.0" y="253.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">among everything else</text>
<text x="760.0" y="286.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">a regulated product</text>
<rect x="764.0" y="297.0" width="140.7" height="13" fill="#4a7fa8" fill-opacity="0.6"/>
<text x="908.7" y="307.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">3.8x</text>
<text x="908.7" y="307.0" fill="#4a7fa8" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">3.8x</text>
<text x="1028.0" y="307.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">where there is a US site</text>
<rect x="764.0" y="319.0" width="146.7" height="13" fill="#4a7fa8" fill-opacity="0.6"/>
<text x="914.7" y="329.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">3.9x</text>
<text x="914.7" y="329.0" fill="#4a7fa8" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">3.9x</text>
<text x="1028.0" y="329.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">where there is not</text>
<text x="760.0" y="362.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Each multiplier is the same wherever it is applied,</text>
<text x="760.0" y="376.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">so the tests stack rather than interact — hence</text>
<text x="760.0" y="390.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">twentyfold across the diagonal.</text>
<rect x="750.0" y="392.0" width="412" height="76" fill="#1b7f5a" fill-opacity="0.07"/>
<text x="760.0" y="408.0" font-size="11" fill="#1b7f5a" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">and it is not the sponsor effect</text>
<text x="760.0" y="425.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Inside university and hospital sponsors — the worst</text>
<text x="760.0" y="439.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">class in figure 4 — the same tests give 68.8%</text>
<text x="760.0" y="453.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">against 5.2%. That gap is largely what they study,</text>
<text x="760.0" y="467.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">and where.</text>
<text x="28.0" y="538.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">the pooled 25.6% was measuring scope, not apathy</text>
<text x="28.0" y="558.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Where the law applies, two trials in three report. Where it does not, one in thirty.</text>
<text x="28.0" y="573.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Every earlier figure here quotes a number near a quarter and calls the gap a</text>
<text x="28.0" y="588.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">compliance problem — this is the correction.</text>
<line x1="28" y1="716.0" x2="1172" y2="716.0" stroke="#e3e2db"/>
<text x="28.0" y="734.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ClinicalTrials.gov API v2, fetched 2026-09-22. Population as figure 3, completions 2012–2021, restricted to the 120,984 trials recording both an</text>
<text x="28.0" y="748.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">intervention type and at least one country. Still not a compliance rate: IND/IDE status is never published, so a trial with no US site may be an</text>
<text x="28.0" y="762.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">applicable clinical trial and is counted out of scope here. The regulated-product grouping — drug, biologic, device, combination, genetic, radiation —</text>
<text x="28.0" y="776.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">is declared in the script. 10% of studies record no country and are excluded rather than assumed domestic, and a country list is the sites, not the</text>
<text x="28.0" y="790.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">sponsor's address.</text>
</svg>