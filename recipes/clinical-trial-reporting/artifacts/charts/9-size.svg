<text x="87.0" y="530.0" fill="#8c2318" font-size="9.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">2,511 trials enrolled nobody</text>
<text x="87.0" y="541.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">and none of them reported — correct, not delinquent</text>
<text x="87.0" y="541.0" fill="#8c2318" font-size="9" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">and none of them reported — correct, not delinquent</text>
<text x="28.0" y="626.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">the pooled U is the mixing ratio, not a relationship</text>
<text x="28.0" y="646.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Industry rises monotonically with size and universities drift the other way, so the</text>
<text x="28.0" y="661.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">dashed pooled curve is neither. The industry share of trials climbs with enrollment and</text>
<text x="28.0" y="676.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">industry reports three times as often, which bends the average upward at the top and</text>
<text x="28.0" y="691.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">pulls it down in the middle. Sample size is not a property of the trial here — it is a</text>
<text x="28.0" y="706.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">proxy for who is running it, and it reverses sign for one of the two classes once that</text>
<text x="28.0" y="721.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">is held fixed.</text>
<text x="818.0" y="628.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">the field's own limits</text>
<text x="818.0" y="628.0" fill="#8a8880" font-size="11" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">the field's own limits</text>
<text x="818.0" y="646.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Enrollment spans eight orders of magnitude,</text>
<text x="818.0" y="660.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">0 to a recorded 188,814,085, so it is logged</text>
<text x="818.0" y="674.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">here and its top end holds values no trial</text>
<text x="818.0" y="688.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">has. 35% of the numbers are ESTIMATED — a</text>
<text x="818.0" y="702.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">plan, not a measurement.</text>
