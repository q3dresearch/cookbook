<text x="28.0" y="768.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ClinicalTrials.gov API v2, fetched 2026-09-22. Population as figure 3, completions 2012–2021 with an enrollment recorded — 130,335 trials. Points sit</text>
<text x="28.0" y="782.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">at each band's midpoint on a log axis; the zero-enrollment group cannot be placed on a log scale and is drawn hollow at the left margin. Bands with</text>
<text x="28.0" y="796.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">under 150 trials pooled, or 100 within a class, are not drawn.</text>
