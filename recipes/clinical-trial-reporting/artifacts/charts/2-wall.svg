<text x="760.0" y="456.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="10" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">the Final Rule took effect January 2017</text>
<text x="760.0" y="456.0" fill="#1b7f5a" font-size="10" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">the Final Rule took effect January 2017</text>
<text x="760.0" y="472.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Completions from 2008–2012 already spike 22.1x over</text>
<text x="760.0" y="486.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">their own baseline — the same multiple as 2017–2020.</text>
<text x="760.0" y="500.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The rule that widened the scope did not create the</text>
<text x="760.0" y="514.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">wall and did not sharpen it. Figure 3 finds no step in</text>
<text x="760.0" y="528.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the reporting series at that date either.</text>
<rect x="750.0" y="530.0" width="414.0" height="80" fill="#8c2318" fill-opacity="0.07"/>
<text x="760.0" y="546.0" font-size="11" fill="#8c2318" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">what that locates</text>
<text x="760.0" y="563.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">A wall one day wide, present in the first measurable</text>
<text x="760.0" y="577.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">cohort, unchanged by the rule that widened it, and</text>
<text x="760.0" y="591.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">concentrated 82x among sponsors with regulatory staff</text>
<text x="760.0" y="605.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">— that is not a rule persuading anyone. It is a</text>
<text x="760.0" y="619.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">compliance function executing a date.</text>
<line x1="28" y1="670.0" x2="1172" y2="670.0" stroke="#e3e2db"/>
<text x="28.0" y="688.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ClinicalTrials.gov API v2, fetched 2026-09-22. Population as figure 3. Left panel uses only the 151,345 trials whose primary completion date carries a</text>
<text x="28.0" y="702.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">day of month, so no date is placed by hand and no round-offset artefact is possible; right panel uses the full population. Hazard is computed on</text>
<text x="28.0" y="716.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">trials observed for the whole window and not yet reported at its start. Baseline is the mean of each era's first four 30-day windows, so each era is</text>
<text x="28.0" y="730.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">measured against itself.</text>
