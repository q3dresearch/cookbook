<text x="428.7" y="489.9" fill="#52514e" font-size="10" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">a 7-fold drop in seven days</text>
<text x="381.5" y="224.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="10" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">day 365</text>
<text x="381.5" y="224.0" fill="#8c2318" font-size="10" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">day 365</text>
<text x="28.0" y="576.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">At day resolution the three most common lags in the whole 330–400 day range are 364 days</text>
<text x="28.0" y="591.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">(1,621 trials), 365 (1,420) and 363 (870). Sponsors are not filing sometime the following</text>
<text x="28.0" y="606.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">year — they are filing against a date arithmetic gives them.</text>
<text x="760.0" y="158.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the same spike, by when the trial finished</text>
