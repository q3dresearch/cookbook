<text x="326.0" y="544.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">dot area is how many sites it averages</text>
<text x="610.0" y="544.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The top three rows are 41% of America's open landfills and 5.1%</text>
<text x="610.0" y="559.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">of the waste it buries. That is why missing them costs the site</text>
<text x="610.0" y="574.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">count and not the tonnage.</text>
<line x1="28" y1="578.0" x2="992" y2="578.0" stroke="#e3e2db"/>
<text x="28.0" y="598.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Read figures 1, 2 and 4 as claims about national capacity, which they cover at 94%, not about the typical landfill, which they cover at 68%.</text>
<text x="28.0" y="613.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Above 10k tons a year the private-public gap is 3 to 15 points, against a 36-point raw gap between counted and uncounted sites. The top row's 44-point gap rests on 15 private sites.</text>
<text x="28.0" y="628.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">1,193 of 1,266 open sites report a rate and can be banded; the other 73 count as uncovered. A sliding window over size rank gives the same gradient.</text>
