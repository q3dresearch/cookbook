<circle cx="202.0" cy="540.0" r="5" fill="#1b4f8a" fill-opacity="0.85"/>
<text x="214.0" y="544.0" font-size="11" fill="#1b4f8a" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">publicly owned</text>
