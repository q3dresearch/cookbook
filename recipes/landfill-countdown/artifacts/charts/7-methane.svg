<text x="214.0" y="555.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">closed landfill</text>
<text x="336.0" y="538.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">dot area is how many sites</text>
<text x="606.0" y="538.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">66% of the uncaptured waste is in the two middle bands,</text>
<text x="606.0" y="553.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">where capture is a coin flip. The giants are already done</text>
<text x="606.0" y="568.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">and the small sites hold almost nothing.</text>
<line x1="28" y1="566.0" x2="992" y2="566.0" stroke="#e3e2db"/>
<text x="28.0" y="586.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">If you are looking for a site to harvest, 52 landfills hold over five million tons each with no collection at all — 0.41bn tons between them.</text>
<text x="28.0" y="601.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">1.40bn of 13.55bn buried tons sit under sites with no gas system. Closed sites keep emitting for decades and only 43% of them capture.</text>
<text x="28.0" y="616.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The EPA rule triggers at 2.5 million megagrams of design capacity and the curve shows no step there; the sharpest split sits at 1.5 million tons instead. The line is not doing the work.</text>
</svg>