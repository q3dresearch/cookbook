<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="548" viewBox="0 0 1000 548" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="1000" height="548" fill="#fcfcfb"/>
<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">Compared fairly, storage is not the worst bet in the queue</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Share of projects still alive after exactly 5 years, grouped by when they entered the queue. Same technology, same</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">exposure, same era &#8212; so a gap between lines is the technology, not fourteen years of changing rules.</text>
<text x="36" y="150" font-size="12" fill="#8a8880">MISO cannot appear: it publishes no withdrawal date, so a death can be counted but never placed in time. Included, every one of its families scored exactly 100%.</text>
<text x="36" y="110" font-size="12.5" fill="#8a8880">Gas appears only in the two older cohorts and storage only in the two newer ones: they barely overlapped in time, so read down a cohort, not across.</text>
