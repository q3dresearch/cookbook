<text x="36" y="484" font-size="11" fill="#8a8880">Projects per point: Solar CAISO n=232-414, Storage CAISO n=90-309, Gas CAISO n=68-126, Wind CAISO n=33-93.</text>
<text x="36" y="502" font-size="12.5" fill="#0b0b0b"><tspan font-weight="600">All-time survival said storage was worst at 8.1%.</tspan> Age-matched it is 19.6%, level with combined-cycle gas and above solar.</text>
<text x="36" y="522" font-size="11.5" fill="#8a8880">Storage projects have had time to be withdrawn (median 1 year) but not to be built (median 6.1 years), so counting all of them understates it.</text>
<text x="36" y="538" font-size="11.5" fill="#8a8880">CAISO only. A technology is shown in a cohort only with at least 30 projects there. Source: PublicQueueReport.xlsx, fetched 2026-09-10.</text>
