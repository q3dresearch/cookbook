<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="682" viewBox="0 0 1000 682" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="1000" height="682" fill="#fcfcfb"/>
<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">Everything before the facilities study resolves in a year. After it, years.</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Time from joining the queue to the outcome, by the furthest study a project reached. Bar spans the middle half,</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">the line runs to the 90th percentile, the dot is the median.</text>
<circle cx="42" cy="118" r="6" fill="#2361b0"/>
<text x="54" y="122" font-size="12.5" font-weight="600" fill="#2361b0">withdrawn</text>
<circle cx="164" cy="118" r="6" fill="#3f7d3a"/>
<text x="176" y="122" font-size="12.5" font-weight="600" fill="#3f7d3a">built and energised</text>
