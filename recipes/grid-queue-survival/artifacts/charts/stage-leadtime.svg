<circle cx="413.1" cy="386" r="5.5" fill="#2361b0" stroke="#fcfcfb" stroke-width="1.6"/>
<text x="778" y="390" font-size="12" fill="#2361b0">3.8y median &#183; n=274</text>
<text x="222" y="407" font-size="11" fill="#8a8880" text-anchor="end">3.7&#215; the row above</text>
<text x="222" y="453" font-size="13" fill="#0b0b0b" text-anchor="end">signed an agreement</text>
<line x1="444.3" y1="440" x2="734.3" y2="440" stroke="#2361b0" stroke-width="1.4" stroke-opacity="0.55"/>
<rect x="444.3" y="434" width="130.9" height="12" rx="2" fill="#2361b0" fill-opacity="0.35"/>
<circle cx="502.9" cy="440" r="5.5" fill="#2361b0" stroke="#fcfcfb" stroke-width="1.6"/>
<text x="778" y="444" font-size="12" fill="#2361b0">5.8y median &#183; n=82</text>
<line x1="444.2" y1="458" x2="714.3" y2="458" stroke="#3f7d3a" stroke-width="1.4" stroke-opacity="0.55"/>
<rect x="444.2" y="452" width="171.4" height="12" rx="2" fill="#3f7d3a" fill-opacity="0.35"/>
<circle cx="521.4" cy="458" r="5.5" fill="#3f7d3a" stroke="#fcfcfb" stroke-width="1.6"/>
<text x="778" y="462" font-size="12" fill="#3f7d3a">6.2y median &#183; n=230</text>
<line x1="36" y1="516" x2="964" y2="516" stroke="#e3e2db"/>
<text x="36" y="538" font-size="13" fill="#0b0b0b"><tspan font-weight="600">A project that dies holding a signed agreement has waited 5.8 years. One that gets built waited 6.2.</tspan> Almost the same investment, no asset.</text>
<text x="36" y="560" font-size="12.5" fill="#52514e">Two different bottlenecks. Intake is high-volume and fast: half the queue leaves inside a year having consumed no study at all.</text>
<text x="36" y="579" font-size="12.5" fill="#52514e">The facilities stage is low-volume and slow. Study capacity does not fix the first; entry deposits do not fix the second.</text>
<text x="36" y="608" font-size="11.5" fill="#8a8880">CAISO publishes study statuses, not study dates, so this is time to OUTCOME for projects that stopped at each stage, not the duration of that stage.</text>
<text x="36" y="626" font-size="11.5" fill="#8a8880">The jump between adjacent rows is an upper bound on that stage&#8217;s cost. Rows under 20 projects are not drawn; only the last stage has enough built projects to compare.</text>
<text x="36" y="650" font-size="11.5" fill="#8a8880">Source: CAISO PublicQueueReport.xlsx. MISO publishes no study milestones for any of its 3,833 projects, so this cannot be split by grid.</text>
</svg>