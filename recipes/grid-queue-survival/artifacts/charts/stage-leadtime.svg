<text x="422.1" y="496" font-size="11.5" fill="#8a8880" text-anchor="middle">4y</text>
<line x1="513.2" y1="172" x2="513.2" y2="476" stroke="#e3e2db"/>
<text x="513.2" y="496" font-size="11.5" fill="#8a8880" text-anchor="middle">6y</text>
<line x1="604.2" y1="172" x2="604.2" y2="476" stroke="#e3e2db"/>
<text x="604.2" y="496" font-size="11.5" fill="#8a8880" text-anchor="middle">8y</text>
<line x1="695.3" y1="172" x2="695.3" y2="476" stroke="#e3e2db"/>
<text x="695.3" y="496" font-size="11.5" fill="#8a8880" text-anchor="middle">10y</text>
<text x="222" y="205" font-size="13" fill="#0b0b0b" text-anchor="end">never studied</text>
<line x1="252.8" y1="200" x2="329.1" y2="200" stroke="#2361b0" stroke-width="1.4" stroke-opacity="0.55"/>
<rect x="252.8" y="194" width="38.1" height="12" rx="2" fill="#2361b0" fill-opacity="0.35"/>
<circle cx="277.3" cy="200" r="5.5" fill="#2361b0" stroke="#fcfcfb" stroke-width="1.6"/>
<text x="778" y="204" font-size="12" fill="#2361b0">0.8y median &#183; n=908</text>
<text x="222" y="267" font-size="13" fill="#0b0b0b" text-anchor="end">in feasibility</text>
<line x1="262.3" y1="262" x2="371.6" y2="262" stroke="#2361b0" stroke-width="1.4" stroke-opacity="0.55"/>
<rect x="262.3" y="256" width="78.4" height="12" rx="2" fill="#2361b0" fill-opacity="0.35"/>
<circle cx="262.4" cy="262" r="5.5" fill="#2361b0" stroke="#fcfcfb" stroke-width="1.6"/>
<text x="778" y="266" font-size="12" fill="#2361b0">0.5y median &#183; n=46</text>
<text x="222" y="329" font-size="13" fill="#0b0b0b" text-anchor="end">through system impact</text>
<line x1="281.9" y1="324" x2="320.9" y2="324" stroke="#2361b0" stroke-width="1.4" stroke-opacity="0.55"/>
<rect x="281.9" y="318" width="30.7" height="12" rx="2" fill="#2361b0" fill-opacity="0.35"/>
<circle cx="286.5" cy="324" r="5.5" fill="#2361b0" stroke="#fcfcfb" stroke-width="1.6"/>
<text x="778" y="328" font-size="12" fill="#2361b0">1.0y median &#183; n=413</text>
<text x="222" y="391" font-size="13" fill="#0b0b0b" text-anchor="end">through facilities study</text>
<line x1="362.8" y1="386" x2="507.4" y2="386" stroke="#2361b0" stroke-width="1.4" stroke-opacity="0.55"/>
