<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">These technologies were never in the queue at the same time</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">When each family entered. The bar is the middle half of its entry years, the line its full range, the notch its median.</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">This is why every comparison in this recipe is made within a cohort: rank two families whose bars do not overlap and you have</text>
<text x="36" y="106" font-size="13.5" fill="#52514e">compared two decades of interconnection policy, not two technologies.</text>
