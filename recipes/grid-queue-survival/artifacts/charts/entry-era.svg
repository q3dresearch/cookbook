<text x="36" y="612" font-size="13" fill="#0b0b0b"><tspan font-weight="600">California&#8217;s gas sits in 2006&#8211;2012 and its storage in 2018&#8211;2021. The two never overlap.</tspan> The first version of this recipe ranked them against each other.</text>
<text x="36" y="636" font-size="12.5" fill="#52514e">The two queues are at different points in their own lives: California&#8217;s families are strung across two decades, the Midwest&#8217;s are stacked in the last six.</text>
<text x="36" y="655" font-size="12.5" fill="#52514e">And gas runs opposite ways: it is California&#8217;s oldest family (median 2008) and the Midwest&#8217;s newest (median 2024).</text>
<text x="36" y="686" font-size="11.5" fill="#8a8880">Families with fewer than 40 projects in a grid are omitted. Families keyed on fuel, not turbine type. Entry year is the queue date.</text>
<text x="36" y="704" font-size="11.5" fill="#8a8880">Sources: CAISO PublicQueueReport.xlsx, MISO api/giqueue/getprojects.</text>
