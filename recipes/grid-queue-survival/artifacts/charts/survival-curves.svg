<text x="36" y="572" font-size="13" fill="#0b0b0b"><tspan font-weight="600">Median 1.0 year to a withdrawal, 6.1 years to an energisation.</tspan> Survive the first two years and the odds change entirely.</text>
<text x="36" y="592" font-size="11.5" fill="#8a8880">CAISO only: MISO publishes an application status but no withdrawal date, so it can say how many died and not when. Technologies with fewer than 60 dated projects are omitted.</text>
<text x="36" y="608" font-size="11.5" fill="#8a8880">Source: CAISO PublicQueueReport.xlsx, fetched 2026-09-10. Curve stops where fewer than 25 projects of that technology remain at risk, so a line ending early means its cohort is young, not that it stopped dying.</text>
