<text x="36" y="68" font-size="13.5" fill="#52514e">Where 1,762 withdrawn California projects stopped, as a share of each technology&#8217;s own withdrawals. The rows barely differ:</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">the filter falls at intake, and it falls on everything equally.</text>
