<text x="36" y="506" font-size="13" fill="#0b0b0b"><tspan font-weight="600">52% never reached a study at all, and 6% died holding a signed interconnection agreement.</tspan></text>
<text x="36" y="528" font-size="12.5" fill="#52514e">Those are different problems. The first is an intake that accepts more than it can filter; the second is a project that cleared every study and still could not proceed.</text>
<text x="36" y="558" font-size="11.5" fill="#8a8880">Capacity follows count almost exactly &#8212; 49% of the 382 GW abandoned is at intake against 52% of projects, and average size is flat across stages.</text>
<text x="36" y="576" font-size="11.5" fill="#8a8880">Big projects do not die later than small ones, so screening by size would not work. Stage is inferred from CAISO&#8217;s study-completion fields, which it fills in order;</text>
<text x="36" y="594" font-size="11.5" fill="#8a8880">a project with no milestone recorded is counted as never studied.</text>
<text x="36" y="618" font-size="11.5" fill="#8a8880">CAISO only &#8212; MISO publishes no study milestones for any of its 3,833 projects, so this cannot be split by grid. Technologies with fewer than 60 withdrawals are omitted. Source: PublicQueueReport.xlsx.</text>
