<text x="462.8" y="399.7" font-size="11.5" fill="#8a8880" text-anchor="middle">8.4y median &#183; 15.9y p90 &#183; 19 GW</text>
<text x="36" y="554" font-size="12.5" fill="#0b0b0b"><tspan font-weight="600">Every Midwest family has waited less than every California one &#8212; 4.0 years at worst against 5.4 at best.</tspan> The two do not overlap at all.</text>
<text x="36" y="573" font-size="12.5" fill="#52514e">The tails are proportionally similar &#8212; p90 is 1.7&#215; the median in California and 1.8&#215; in the Midwest &#8212; so this is not a few stragglers. The whole queue is slower.</text>
<text x="36" y="593" font-size="11.5" fill="#8a8880">173 active projects fall outside these families and are not plotted ((blank) 157, Nuclear 8). Families keyed on fuel, not turbine type.</text>
