<text x="36" y="42" font-size="20" font-weight="600" fill="#0b0b0b">What is stuck in the queue now, and how long it has been stuck</text>
<text x="36" y="68" font-size="13.5" fill="#52514e">Active projects only &#8212; nothing here has resolved. Fill is the family, border the grid, area the project count, and the</text>
<text x="36" y="87" font-size="13.5" fill="#52514e">whisker runs from the median wait to the ninetieth percentile.</text>
<text x="36" y="164" font-size="12" fill="#8a8880">MISO shows more families because its live queue is larger: 1,130 active projects against CAISO&#8217;s 265.</text>
<text x="36" y="180" font-size="12" fill="#8a8880">On resolved history the asymmetry reverses &#8212; CAISO has 2,013 finished projects to MISO&#8217;s 2,700 &#8212; which is the population every other chart here uses.</text>
