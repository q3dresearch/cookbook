<text x="161.5" y="441.5" font-size="11.5" fill="#8a8880" text-anchor="middle">1.6y median &#183; 4.0y p90 &#183; 30 GW</text>
<text x="197.8" y="387.6" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Storage, MISO</text>
<text x="197.8" y="402.6" font-size="11.5" fill="#8a8880" text-anchor="middle">2.4y median &#183; 4.4y p90 &#183; 49 GW</text>
