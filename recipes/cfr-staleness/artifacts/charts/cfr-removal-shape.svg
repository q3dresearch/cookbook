al,sans-serif" font-size="10.5" fill="#4a3aa7" text-anchor="end" font-weight="normal">everything lost in one action</text><circle cx="153.8" cy="616.9" r="18.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="168.3" cy="616.9" r="14.730128091148496" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="162.5" cy="616.9" r="14.684553470151856" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="153.8" cy="565.8" r="14.216420583771303" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="168.3" cy="616.9" r="14.16829273218502" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="165.4" cy="514.7" r="14.071271030852472" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="150.9" cy="616.9" r="13.973200354797047" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="156.7" cy="565.8" r="13.773771001777003" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="162.5" cy="412.4" r="13.413402421977457" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="150.9" cy="616.9" r="13.091751342606612" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="168.3" cy="565.8" r="12.813600707800624" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="150.9" cy="616.9" r="12.163754024793754" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="150.9" cy="616.9" r="12.101729012981416" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="573.9" cy="259.1" r="12.101729012981416" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="171.2" cy="565.8" r="11.912315437828477" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="150.9" cy="616.9" r="11.84801343150809" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="150.9" cy="616.9" r="11.651378631256462" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="171.2" cy="616.9" r="11.651378631256462" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="153.8" cy="565.8" r="11.239546231319618" fill="#2a78d6" stroke="none" stroke-width