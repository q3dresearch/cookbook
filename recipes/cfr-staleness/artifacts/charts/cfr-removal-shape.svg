<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="876" viewBox="0 0 1080 876"><rect width="1080" height="876" fill="#ffffff"/><rect x="0.0" y="0.0" width="1080.0" height="876.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Parts are not pruned. They are opened once and closed.</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Each dot is one part of CFR Title 12 that lost sections. Across: how many it lost. Up: how many separate days it took.</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">If removal were attrition, dots would climb with the axis. They sit on the floor: whatever a part loses, it loses in one action.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Area is how many sections the part still holds. The 836 removed on 11 October 2018 — the Office of Thrift Supervision's whole rulebook — are excluded.</text><line x1="148.0" y1="668.0" x2="608.0" y2="668.0" stroke="#dfe4ea" stroke-width="1"/><text x="138.0" y="672.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0</text><line x1="148.0" y1="565.8" x2="608.0" y2="565.8" stroke="#dfe4ea" stroke-width="1"/><text x="138.0" y="569.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">2</text><line x1="148.0" y1="463.6" x2="608.0" y2="463.6" stroke="#dfe4ea" stroke-width="1"/><text x="138.0" y="467.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">4</text><line x1="148.0" y1="361.3" x2="608.0" y2="361.3" stroke="#dfe4ea" stroke-width="1"/><text x="138.0" y="365.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">6</text><line x1="148.0" y1="259.1" x2="608.0" y2="259.1" stroke="#dfe4ea" stroke-width="1"/><text x="138.0" y="263.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">8</text><line x1="148.0" y1="208.0" x2="148.0" y2="668.0" stroke="#dfe4ea" stroke-width="1"/><text x="148.0" y="688.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">0</text><line x1="220.4" y1="208.0" x2="220.4" y2="668.0" stroke="#dfe4ea" stroke-width="1"/><text x="220.4" y="688.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">25</text><line x1="292.9" y1="208.0" x2="292.9" y2="668.0" stroke="#dfe4ea" stroke-width="1"/><text x="292.9" y="688.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">50</text><line x1="365.3" y1="208.0" x2="365.3" y2="668.0" stroke="#dfe4ea" stroke-width="1"/><text x="365.3" y="688.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor=