h="1"/><circle cx="168.3" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="165.4" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="200.2" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="208.8" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="174.1" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="179.9" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="182.8" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="162.5" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="174.1" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="171.2" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="156.7" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="150.9" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="150.9" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="174.1" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="165.4" cy="616.9" r="5.0" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="593.0" y="263.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">part 390 · 147 lost</text><text x="281.3" y="603.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="middle" font-weight="normal">part 109 · 46 lost</text><text x="272.4" y="518.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">part 25 · 37 lost</text><text x="250.7" y="569.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">part 1091 · 30 lost</text><line x1="40.0" y1="730.0" x2="1040.0" y2="730.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="756.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Of the 55 parts that lost three or more sections, 43 lost every one of them on a single day.</text><text x="40.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">So there is no attrition to predict and no decay curve to fit. The question “which section will be removed next” has no answer; the question “which part is about to be</text><text x="40.0" y="795.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">opened” has one, and it is a rulemaking calendar, not this dataset. What this dataset can do is hand that rulemaking a list of what to delete while the part is open.</text><text x="40.0" y="819.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Which is the point of the dead-letter scan: 12 CFR 208.23 expired in 1999, and part 208 lost eight OTHER sections in 2019 without anyone noticing that one.</text><text x="40.0" y="836.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Removals are only recorded from 2017, when the eCFR version record opens. Source: eCFR versions API, snapshot 2026-09-01.</text></svg>