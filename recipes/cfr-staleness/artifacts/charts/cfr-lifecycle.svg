<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="862" viewBox="0 0 1120 862"><rect width="1120" height="862" fill="#ffffff"/><rect x="0.0" y="0.0" width="1120.0" height="862.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">What the code keeps writing, and what it stops touching</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Each dot is one functional category within a title. Across: share of its sections first published in 2010 or later. Up: share older than</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">that title's median age. Area is how many sections. Both axes are shares of the same population, so the diagonal is a fair reference.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Top-left is abandoned; bottom-right is actively rewritten. Top-right is both at once — new rules piling up beside old ones nobody reopens.</text><circle cx="44.0" cy="141.0" r="6" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="56.0" y="145.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Title 12 — Banks and Banking</text><circle cx="304.0" cy="141.0" r="6" fill="#eb6834" stroke="none" stroke-width="1"/><text x="316.0" y="145.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Title 29 — Labor</text><line x1="168.0" y1="666.0" x2="638.0" y2="666.0" stroke="#dfe4ea" stroke-width="1"/><text x="158.0" y="670.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0%</text><line x1="168.0" y1="196.0" x2="168.0" y2="666.0" stroke="#dfe4ea" stroke-width="1"/><text x="168.0" y="686.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">0%</text><line x1="168.0" y1="548.5" x2="638.0" y2="548.5" stroke="#dfe4ea" stroke-width="1"/><text x="158.0" y="552.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">25%</text><line x1="285.5" y1="196.0" x2="285.5" y2="666.0" stroke="#dfe4ea" stroke-width="1"/><text x="285.5" y="686.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">25%</text><line x1="168.0" y1="431.0" x2="638.0" y2="431.0" stroke="#dfe4ea" stroke-width="1"/><text x="158.0" y="435.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">50%</text><line x1="403.0" y1="196.0" x2="403.0" y2="666.0" stroke="#dfe4ea" stroke-width="1"/><text x="403.0" y="686.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">50%</text><line x1="168.0" y1="313.5" x2="638.0" y2="313.5" stroke="#dfe4ea" stroke-width="1"/><text x="158.0" y="317.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">75%</text><line x1="520.5" y1="196.0" x2="520.5" y2="666.0" stroke="#dfe4ea" stroke-width="1"/><text x="520.5" y="686.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">75%</text><line x1="168.0" y1="196.0" x2="638.0" y2="196.0" stroke="#dfe4ea" stroke-width="1"/><text x="158.0" y="200.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">100%</text><line x1="638.0" y1="196.0" x2="638.0" y2="666.0" stroke="#dfe4ea" stroke-width="1"/><text x="638.0" y="686.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">100%</text><text x="156.0" y="170.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="end" font-weight="600">stopped touching</text><text x="156.0" y="186.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">older than the title median</text><text x="638.0" y="710.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="end" font-weight="600">still writing  ·  share born 2010 or later</text><line x1="168.0" y1="666.0" x2="638.0" y2="196.0" stroke="#dfe4ea" stroke-width="1" stroke-dasharray="5 5"/><text x="176.0" y="268.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal" font-style="font-style:italic">abandoned</text><text x="630.0" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal" font-style="font-style:italic">actively rewritten</text><circle cx="427.8" cy="462.1" r="22.0" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="356.0" cy="525.0" r="19.006267550481716" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="270.4" cy="453.9" r="18.0381186054745" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="561.3" cy="550.9" r="16.512840899992078" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="257.7" cy="424.8" r="15.257929093556593" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="370.4" cy="388.6" r="15.011006485707496" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="418.0" cy="456.0" r="14.91664779665068" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="360.9" cy="431.0" r="14.692495117377907" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="367.4" cy="434.6" r="14.627381877584533" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="295.5" cy="392.7" r="14.528779989290783" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="416.4" cy="375.6" r="14.328074699102585" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="352.1" cy="481.9" r="14.225885863412248" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="177.0" cy="218.4" r="13.694611650898945" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="348.0" cy="411.0" r="13.280412439302022" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="278.6" cy="372.9" r="12.923114574994568" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="276.9" cy="385.1" r="12.79984451752796" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="287.1" cy="421.6" r="12.503133775240858" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="296.8" cy="324.8" r="12.415839430247118" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="260.7" cy="407.8" r="12.327340854636242" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="345.4" cy="426.6" r="11.466759785747502" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="365.4" cy="402.8" r="11.309786492799777" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="450.0" cy="515.6" r="11.309786492799777" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="288.0" cy="476.0" r="11.148029005665354" fill="#eb6834" stroke="none" stroke-width="1"/><text x="456.8" y="466.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Definitions &amp; scope (454)</text><text x="330.0" y="529.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="end" font-weight="normal">Procedure &amp; appeals (300)</text><text x="584.8" y="554.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Capital &amp; risk (196)</text><text x="437.7" y="379.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Disclosure &amp; consumer (123)</text><text x="197.6" y="222.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Interpretation (105)</text><text x="316.2" y="328.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Interpretation (73)</text><text x="468.3" y="519.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Computation &amp; method (50)</text><line x1="40.0" y1="724.0" x2="1080.0" y2="724.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="750.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Banking rewrites itself where the statute told it to, and nowhere else. Labour law barely rewrites itself at all.</text><text x="40.0" y="772.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Capital &amp; risk is 84% written since 2010 and only 24% stale — Dodd-Frank and Basel III arriving as text. Consumer disclosure is 53% new AND 62% stale: new products get new</text><text x="40.0" y="789.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">rules while the old disclosure regime is never reopened. Title 29's most-renewed category is Procedure &amp; appeals at 40% — what changes there is how you file, not what the rule says.</text><text x="40.0" y="813.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Categories are inferred from section headings by keyword and are ours, not the publisher's; “Other” (688 and 1,078 sections) is excluded, as is any category under 40.</text><text x="40.0" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Shares are of the dated subset (35% and 33%). “Born” is the earliest surviving citation, so a wholly rewritten section reads as new. Source: eCFR full-text API, snapshot 2026-09-01.</text></svg>