<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="912.0" viewBox="0 0 1180 912.0"><rect width="1180" height="912.0" fill="#ffffff"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1c2530" text-anchor="start" font-weight="600">Pruning is one event, not a habit</text><text x="40.0" y="68.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">Sections of CFR Title 12 first published in each decade and still in force today (up), against sections removed (down). One linear scale both ways.</text><text x="40.0" y="86.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">836 of the 1,588 removals ever recorded went on a single day. Strip that and removal runs at about 78 sections a year.</text><text x="40.0" y="104.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">These are NOT two halves of a balance. Up counts survivors by birth decade; down counts deaths by death decade, and only from 2017. A section born in 1995 and removed in 2018</text><text x="40.0" y="120.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">appears below and not above. The eCFR version record begins with a 2016–17 baseline load, so a true additions series is not recoverable and no net figure is drawn here.</text><rect x="40.0" y="137.0" width="11.0" height="11.0" fill="#2a78d6" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="57.0" y="146.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">amended at least once since</text><rect x="253.1" y="137.0" width="11.0" height="11.0" fill="#4a3aa7" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="270.1" y="146.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">never amended since first published</text><rect x="515.3" y="137.0" width="11.0" height="11.0" fill="#eb6834" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="532.3" y="146.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">removed, routine</text><rect x="660.7" y="137.0" width="11.0" height="11.0" fill="#8c3b17" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="677.7" y="146.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">removed, the 2018 clean-up</text><line x1="96.0" y1="288.0" x2="1140.0" y2="288.0" stroke="#dfe4ea" stroke-width="1"/><text x="86.0" y="292.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">500</text><line x1="96.0" y1="176.0" x2="1140.0" y2="176.0" stroke="#dfe4ea" stroke-width="1"/><text x="86.0" y="180.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">1,000</text><line x1="96.0" y1="512.0" x2="1140.0" y2="512.0" stroke="#dfe4ea" stroke-width="1"/><text x="86.0" y="516.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">500</text><line x1="96.0" y1="624.0" x2="1140.0" y2="624.0" stroke="#dfe4ea" stroke-width="1"/><text x="86.0" y="628.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">1,000</text><line x1="96.0" y1="736.0" x2="1140.0" y2="736.0" stroke="#dfe4ea" stroke-width="1"/><text x="86.0" y="740.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">1,500</text><text x="86.0" y="162.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">sections</text><rect x="96.0" y="402.0" width="812.0" height="334.0" fill="#6b7684" fill-opacity="0.055" stroke="none" stroke-width="1" rx="0"/><text x="502.0" y="564.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="normal">no removal record before 2017</text><text x="502.0" y="581.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">(eCFR version history starts here)</text><rect x="114.6" y="398.9" width="78.9" height="1.1" fill="#2a78d6" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><rect x="114.6" y="399.1" width="78.9" height="0.9" fill="#4a3aa7" fill-opacity="0.95" stroke="none" stroke-width="1" rx="0"/><text x="154.0" y="390.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">5</text><text x="154.0" y="766.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="normal">1940s</text><rect x="230.6" y="397.3" width="78.9" height="2.7" fill="#2a78d6" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><rect x="230.6" y="398.9" width="78.9" height="1.1" fill="#4a3aa7" fill-opacity="0.95" stroke="none" stroke-width="1" rx="0"/><text x="270.0" y="389.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">12</text><text x="270.0" y="766.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="normal">1950s</text><rect x="346.6" y="393.7" width="78.9" height="6.3" fill="#2a78d6" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><rect x="346.6" y="398.7" width="78.9" height="1.3" fill="#4a3aa7" fill-opacity="0.95" stroke="none" stroke-width="1" rx="0"/><text x="386.0" y="385.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">28</text><text x="386.0" y="766.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="normal">1960s</text><rect x="462.6" y="378.5" width="78.9" height="21.5" fill="#2a78d6" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><rect x="462.6" y="395.1" width="78.9" height="4.9" fill="#4a3aa7" fill-opacity="0.95" stroke="none" stroke-width="1" rx="0"/><text x="502.0" y="370.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">96</text><text x="502.0" y="766.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="normal">1970s</text><rect x="578.6" y="359.0" width="78.9" height="41.0" fill="#2a78d6" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><rect x="578.6" y="391.9" width="78.9" height="8.1" fill="#4a3aa7" fill-opacity="0.95" stroke="none" stroke-width="1" rx="0"/><text x="618.0" y="351.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">183</text><text x="618.0" y="766.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="normal">1980s</text><rect x="694.6" y="265.2" width="78.9" height="134.8" fill="#2a78d6" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><rect x="694.6" y="383.4" width="78.9" height="16.6" fill="#4a3aa7" fill-opacity="0.95" stroke="none" stroke-width="1" rx="0"/><text x="734.0" y="257.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">602</text><text x="734.0" y="766.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="normal">1990s</text><rect x="810.6" y="321.2" width="78.9" height="78.8" fill="#2a78d6" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><rect x="810.6" y="387.7" width="78.9" height="12.3" fill="#4a3aa7" fill-opacity="0.95" stroke="none" stroke-width="1" rx="0"/><text x="850.0" y="313.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">352</text><text x="850.0" y="766.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="normal">2000s</text><rect x="926.6" y="176.0" width="78.9" height="224.0" fill="#2a78d6" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><rect x="926.6" y="341.5" width="78.9" height="58.5" fill="#4a3aa7" fill-opacity="0.95" stroke="none" stroke-width="1" rx="0"/><text x="966.0" y="168.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">1,000</text><text x="966.0" y="355.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">26%</text><rect x="926.6" y="402.0" width="78.9" height="54.2" fill="#eb6834" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><rect x="926.6" y="454.2" width="78.9" height="187.3" fill="#8c3b17" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="966.0" y="551.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">836 in one day</text><text x="966.0" y="656.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#eb6834" text-anchor="middle" font-weight="600">1,078</text><text x="966.0" y="766.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="normal">2010s</text><rect x="1042.6" y="351.8" width="78.9" height="48.2" fill="#2a78d6" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><rect x="1042.6" y="368.6" width="78.9" height="31.4" fill="#4a3aa7" fill-opacity="0.95" stroke="none" stroke-width="1" rx="0"/><text x="1082.0" y="343.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">215</text><text x="1082.0" y="382.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">65%</text><rect x="1042.6" y="402.0" width="78.9" height="114.2" fill="#eb6834" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="1082.0" y="529.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#eb6834" text-anchor="middle" font-weight="600">510</text><text x="1082.0" y="766.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="normal">2020s</text><line x1="96.0" y1="400.0" x2="1140.0" y2="400.0" stroke="#1c2530" stroke-width="1.6"/><circle cx="966.0" cy="427.1" r="9.5" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="966.0" y="430.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" text-anchor="middle" font-weight="700">1</text><circle cx="48.0" cy="798.0" r="9.5" fill="#eb6834" stroke="none" stroke-width="1"/><text x="48.0" y="801.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="65.0" y="802.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">836 of the 2010s removals went on a single day, 11 October 2018:</text><text x="65.0" y="820.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">the Office of Thrift Supervision's entire rulebook, deleted seven years after Dodd-Frank abolished the agency in 2011. Pruning here is not maintenance — it is one clean-up.</text><text x="40.0" y="878.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: eCFR full-text API (source notes) and versions API, snapshot 2026-09-01. Creation dates are the earliest surviving Federal Register citation.</text><text x="40.0" y="894.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">A wholly rewritten section reads as new and loses its amendment history, so “never amended” means never amended since last republished.</text></svg>