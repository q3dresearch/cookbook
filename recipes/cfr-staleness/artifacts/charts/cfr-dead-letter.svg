<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="956" viewBox="0 0 1080 956"><rect width="1080" height="956" fill="#ffffff"/><rect x="0.0" y="0.0" width="1080.0" height="956.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Rules that say they are dead, and the edits made afterwards</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Every section of CFR Title 12 and Title 29 whose own text sets an expiry date that has passed — all of them are Title 12.</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Up: the day it was last amended. Both axes are the same scale, so the dashed line is “last edited on the day it expired”.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Above the line the agency was still editing text that declares itself no longer in effect. All of it is still printed in the code today.</text><circle cx="44.0" cy="141.0" r="6" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="56.0" y="145.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Title 12 — Banks and Banking</text><circle cx="294.0" cy="141.0" r="6" fill="#eb6834" stroke="none" stroke-width="1"/><text x="306.0" y="145.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Title 29 — Labor · none found</text><line x1="92.0" y1="702.0" x2="612.0" y2="702.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="706.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">1990</text><line x1="118.0" y1="208.0" x2="118.0" y2="728.0" stroke="#dfe4ea" stroke-width="1"/><text x="118.0" y="748.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">1990</text><line x1="92.0" y1="637.0" x2="612.0" y2="637.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="641.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">1995</text><line x1="183.0" y1="208.0" x2="183.0" y2="728.0" stroke="#dfe4ea" stroke-width="1"/><text x="183.0" y="748.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">1995</text><line x1="92.0" y1="572.0" x2="612.0" y2="572.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="576.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">2000</text><line x1="248.0" y1="208.0" x2="248.0" y2="728.0" stroke="#dfe4ea" stroke-width="1"/><text x="248.0" y="748.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2000</text><line x1="92.0" y1="507.0" x2="612.0" y2="507.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="511.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">2005</text><line x1="313.0" y1="208.0" x2="313.0" y2="728.0" stroke="#dfe4ea" stroke-width="1"/><text x="313.0" y="748.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2005</text><line x1="92.0" y1="442.0" x2="612.0" y2="442.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="446.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">2010</text><line x1="378.0" y1="208.0" x2="378.0" y2="728.0" stroke="#dfe4ea" stroke-width="1"/><text x="378.0" y="748.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2010</text><line x1="92.0" y1="377.0" x2="612.0" y2="377.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="381.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">2015</text><line x1="443.0" y1="208.0" x2="443.0" y2="728.0" stroke="#dfe4ea" stroke-width="1"/><text x="443.0" y="748.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2015</text><line x1="92.0" y1="312.0" x2="612.0" y2="312.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="316.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">2020</text><line x1="508.0" y1="208.0" x2="508.0" y2="728.0" stroke="#dfe4ea" stroke-width="1"/><text x="508.0" y="748.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2020</text><line x1="92.0" y1="247.0" x2="612.0" y2="247.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="251.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">2025</text><line x1="573.0" y1="208.0" x2="573.0" y2="728.0" stroke="#dfe4ea" stroke-width="1"/><text x="573.0" y="748.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2025</text><text x="82.0" y="196.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="end" font-weight="600">last amended</text><text x="612.0" y="772.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="end" font-weight="600">stated expiry date</text><line x1="92.0" y1="728.0" x2="612.0" y2="208.0" stroke="#6b7684" stroke-width="1" stroke-dasharray="5 5"/><text x="217.0" y="627.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7684" text-anchor="start" font-weight="normal">edited the day it expired</text><text x="102.0" y="230.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal" font-style="font-style:italic">still being edited after it expired</text><text x="602.0" y="718.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal" font-style="font-style:italic">left alone since</text><line x1="595.0" y1="208" x2="595.0" y2="728" stroke="#4a3aa7" stroke-width="1.2"/><text x="589.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a3aa7" text-anchor="end" font-weight="normal">today</text><circle cx="235.0" cy="392.9" r="7.5" fill="#2a78d6" stroke="none" stroke-width="1"/><line x1="235.0" y1="585.0" x2="235.0" y2="392.9" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="2 3"/><text x="249.0" y="396.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">§ 208.23  ·  28y overdue</text><circle cx="378.0" cy="438.8" r="7.5" fill="#2a78d6" stroke="none" stroke-width="1"/><line x1="378.0" y1="442.0" x2="378.0" y2="438.8" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="2 3"/><text x="392.0" y="442.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">§ 205.3  ·  17y overdue</text><circle cx="417.0" cy="309.8" r="7.5" fill="#2a78d6" stroke="none" stroke-width="1"/><line x1="417.0" y1="403.0" x2="417.0" y2="309.8" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="2 3"/><text x="431.0" y="313.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">§ 238.86  ·  14y overdue</text><circle cx="515.2" cy="306.4" r="7.5" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="529.2" y="342.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">§ 1005.32  ·  6y overdue</text><circle cx="524.2" cy="298.8" r="10" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="524.2" y="302.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="538.2" y="366.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">§ 217.303 / 3.304 / 324.304  ·  5y overdue</text><text x="538.2" y="381.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7684" text-anchor="start" font-weight="normal" font-style="font-style:italic">one rule, three agencies</text><circle cx="589.2" cy="261.2" r="7.5" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="603.2" y="265.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">§ 217.306  ·  0y overdue</text><line x1="40.0" y1="794.0" x2="1040.0" y2="794.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="820.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">8 banking rules have passed their own stated expiry and are still in the code. 3 were amended AFTER that date. Title 29 has none at all.</text><text x="40.0" y="842.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">12 CFR 208.23 states “the terms of this section will no longer be in effect as of January 1, 1999” and was amended in 2013. The 2021 leverage-ratio relief appears three times —</text><text x="40.0" y="859.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">§ 217.303 (Federal Reserve), § 3.304 (OCC) and § 324.304 (FDIC) — all expired, all identical, none removed. Nobody is checking, and the check is one regular expression.</text><text x="40.0" y="883.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Only self-referential expiry counts: “this section expires”, not “the borrower's option expires”. Source notes are stripped first — they are full of dates that are publication, not expiry.</text><text x="40.0" y="900.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Expiry stated without a date cannot appear here: 26 in Title 12, 18 in Title 29. One more, § 1815.115, prints an OMB control number that expired in 1998 and is excluded — it is a stale</text><text x="40.0" y="917.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">artefact, not a rule that sunset. Source: eCFR full-text API, snapshot 2026-09-01.</text></svg>