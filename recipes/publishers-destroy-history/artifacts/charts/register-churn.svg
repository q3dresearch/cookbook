<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="940" height="460" fill="#fcfcfb"/>
<text x="60" y="40" font-size="19" font-weight="600" fill="#0b0b0b">A register that both forgets and flickers, and the two look identical</text>
<text x="60" y="64" font-size="13.5" fill="#52514e">380 notifications vanished from Sweden&#8217;s harvest register in two days. Splitting them by case year separates</text>
<text x="60" y="82" font-size="13.5" fill="#52514e">two phenomena exactly, with no overlap &#8212; and only one of them is the record being destroyed.</text>
<text x="60" y="118" font-size="11.5" fill="#898781">the 380 that disappeared between 04 and 06 September</text>
<rect x="60" y="132" width="642.7" height="34" rx="4" fill="#b9c9e2"/>
<rect x="702.7" y="132" width="125.3" height="34" rx="4" fill="#2361b0"/>
<text x="381" y="154" font-size="13" fill="#0b0b0b" text-anchor="middle">318 returned the next day</text>
<text x="765" y="154" font-size="13" fill="#fcfcfb" text-anchor="middle">62 did not</text>
<text x="60" y="206" font-size="13" font-weight="600" fill="#0b0b0b">318 returned</text>
<text x="60" y="226" font-size="12.5" fill="#52514e">the service answering differently, not the record changing</text>
<rect x="60.0" y="238" width="551.0" height="20" rx="3" fill="#b9c9e2"/>
<text x="336.5" y="252" font-size="11.5" fill="#52514e" text-anchor="middle">2025 &#183; 318</text>
<text x="60" y="298" font-size="13" font-weight="600" fill="#0b0b0b">62 permanently gone</text>
<text x="60" y="318" font-size="12.5" fill="#52514e">the earliest-filed cases of their year, five years on</text>
<rect x="60.0" y="330" width="542.0" height="20" rx="3" fill="#2361b0"/>
<text x="332.0" y="344" font-size="11.5" fill="#fcfcfb" text-anchor="middle">2021 &#183; 61</text>
<rect x="604.0" y="330" width="6.9" height="20" rx="3" fill="#2361b0"/>
<text x="619.0" y="344" font-size="11.5" fill="#52514e">2023 &#183; 1</text>
<text x="60" y="414" font-size="11.5" fill="#898781">Every returner is a 2025 case; every permanent departure but one is 2021. The split is exact.</text>
<text x="60" y="432" font-size="11.5" fill="#898781">Source: wss-forest-harvest, skogsstyrelsen.harvest.notified, 226 partitions, captured 2026-09-04 to 2026-09-07. Diffed by case number.</text>
<text x="60" y="448" font-size="11.5" fill="#898781">Method and code: q3dresearch &#183; recipes/publishers-destroy-history</text>
</svg>