<text x="286.0" y="676.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">it.</text>
<line x1="28" y1="716.0" x2="1012" y2="716.0" stroke="#e3e2db"/>
<text x="28.0" y="736.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">All twelve management categories fall in tons and five reverse sign against their record count: energy recovery, incineration, landfill, other recovery and wastewater treatment all gain records while losing waste.</text>
<text x="28.0" y="751.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">A record count is a measure of reporting practice that happens to be denominated in waste. Incineration gains 48% of its records and loses 46% of its tons.</text>
<text x="28.0" y="766.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Tonnage is managed_tons on both record types: on-site treatment from the generator's own return plus waste received from elsewhere. On-site is 97% of it in 2001 and 91% in 2023 — this is overwhelmingly waste handled where it is made.</text>
</svg>