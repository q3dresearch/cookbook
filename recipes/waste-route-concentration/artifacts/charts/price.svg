<text x="28.0" y="460.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Price up (rho +0.70 with time), tonnage down</text>
<text x="28.0" y="473.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">(-0.73). Pooled in levels that reads as rho</text>
<text x="28.0" y="487.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">-0.24, p 0.009 — significant, and an artefact</text>
<text x="28.0" y="500.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">of these two lines.</text>
