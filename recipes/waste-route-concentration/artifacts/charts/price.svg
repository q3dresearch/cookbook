<text x="830.0" y="488.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">differently either.</text>
<text x="28.0" y="560.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The gate fee, not the metal, is the revenue that decides whether a plant runs. These are disposal businesses that happen to produce</text>
<text x="28.0" y="577.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">metal — so entry is a bet on feedstock contracts and permits, not on zinc.</text>
<line x1="28" y1="617.0" x2="1172" y2="617.0" stroke="#e3e2db"/>
<text x="28.0" y="639.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Price is USGS Data Series 140 unit value, constant 1998 dollars. 2023 has no price on this instrument and 2015 is a non-filing cycle; both excluded. 12</text>
<text x="28.0" y="653.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">plants, classed by whether D008 or K061 carries most of their tonnage. All tests on changes within a plant, never levels. Method in the recipe.</text>
