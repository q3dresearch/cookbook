<text x="408.0" y="468.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">If the hypothesis held these would slope up. Lead</text>
<text x="408.0" y="481.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">against lead: rho -0.002, p 0.99, n 53. Not weak —</text>
<text x="408.0" y="495.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">absent.</text>
<text x="830.0" y="164.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">and no single plant does it either</text>
