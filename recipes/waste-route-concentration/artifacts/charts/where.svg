<text x="28.0" y="802.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Receiving a county's worth of hazardous waste is not one thing: Lamar recovers metals from it, Kern and Kings bury it, Harris injects 97% of it underground.</text>
<text x="28.0" y="817.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">188 counties received waste in 2001 and 191 in 2023, while the tonnage did not grow. The top ten went from 44% to 48%. It gathered rather than spread.</text>
<text x="28.0" y="832.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">All twelve management categories. An earlier version ran on six. remove them, so this concentration is a floor, not a ceiling.</text>
