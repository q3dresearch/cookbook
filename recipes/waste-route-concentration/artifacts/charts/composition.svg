<text x="986.0" y="186.0" font-size="9.5" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">2023</text>
<text x="700.0" y="361.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">95% of it is liquid, down from 97%. Solids</text>
<text x="700.0" y="375.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">are 3%. When this file says two million tons</text>
<text x="700.0" y="389.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">of hazardous waste, it means two million</text>
<text x="700.0" y="403.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">tons of contaminated water.</text>
<text x="700.0" y="435.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Not one plant: dropping the ten largest</text>
<text x="700.0" y="448.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">records per cycle, aqueous still falls 87% to</text>
<text x="700.0" y="461.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">75%. And not purely definition: removing</text>
<text x="700.0" y="474.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">wastewater treatment, whose boundary moved, it</text>
<text x="700.0" y="487.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">still falls 70% to 59%. The direction is real</text>
<text x="700.0" y="500.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">and the magnitude is about half this.</text>
<text x="700.0" y="501.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Band names are read off the free text on the</text>
<text x="700.0" y="514.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">records, not asserted from a lookup: W100s</text>
<text x="700.0" y="527.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">says “chem sewer, acidic waste water”, W300s</text>
<text x="700.0" y="540.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">says “hazardous waste solid”, W500s says</text>
<text x="700.0" y="553.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">“emission control dust”.</text>
<line x1="28" y1="676.0" x2="1032" y2="676.0" stroke="#e3e2db"/>
<text x="28.0" y="696.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Before quoting a tonnage of hazardous waste, know that 95% of it is liquid and the largest single form code is W101, “very dilute aqueous waste”.</text>
<text x="28.0" y="711.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Waste codes cannot do this job. A record can carry twenty of them, so weighting families by tonnage multiplies the total by more than twenty — and by a different amount each cycle. Form code is one per record.</text>
<text x="28.0" y="726.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">11 cycles with tonnage; 2021 publishes none and is absent. All twelve management categories.</text>
</svg>