<text x="28.0" y="679.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Every apparent crossover failed a check — W001 gained 71 points while its tonnage grew sixteenfold, a code reused rather than a material adopted. The</text>
<text x="28.0" y="693.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">buyer shift is only visible measured by receiving industry, because a NAICS code cannot migrate the way a waste code does. Method in the recipe.</text>
<text x="28.0" y="713.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Cement kilns are NAICS 32731. Burnt waste is incineration, energy recovery, fuel blending and solvent reclamation; value captured is the last three.</text>
<text x="28.0" y="727.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">managed_tons on GM and WR rows, which do not overlap. 2021 publishes no tonnage and is omitted.</text>
