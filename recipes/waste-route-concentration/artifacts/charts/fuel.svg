<text x="268.0" y="506.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">2019–23</text>
<text x="28.0" y="528.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Cement kilns are nine to eleven facilities in every cycle, so this is share</text>
<text x="28.0" y="541.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">taken, not capacity built. The generators shipping to them went from 190 to</text>
<text x="28.0" y="555.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">1,242. Refineries take 1% of what they once took and mining takes none.</text>
<text x="640.0" y="174.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">and the economics did not move</text>
<text x="640.0" y="190.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">share of burnt tonnage that someone paid for</text>
