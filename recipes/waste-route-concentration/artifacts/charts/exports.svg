<text x="686.5" y="269.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">F037   11%</text>
<rect x="646" y="280.0" width="26.2" height="17" fill="#b03a2e" fill-opacity="0.45"/>
<text x="679.2" y="293.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">D006   9%</text>
<rect x="646" y="304.0" width="8.3" height="17" fill="#b03a2e" fill-opacity="0.45"/>
<text x="661.3" y="317.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">F002   3%</text>
<rect x="646" y="328.0" width="7.5" height="17" fill="#b03a2e" fill-opacity="0.45"/>
<text x="660.5" y="341.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">D008   2%</text>
<text x="646.0" y="370.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">and what happens to it there</text>
<rect x="646" y="386.0" width="186.5" height="17" fill="#1b7f5a"/>
<text x="651.0" y="399.0" font-size="10" fill="#ffffff" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">metals recovery</text>
<text x="839.5" y="399.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">62%</text>
<rect x="646" y="410.0" width="45.0" height="17" fill="#1b7f5a"/>
<text x="698.0" y="423.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">other recovery   15%</text>
<rect x="646" y="434.0" width="29.6" height="17" fill="#8c2318"/>
<text x="682.6" y="447.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">landfill   10%</text>
<rect x="646" y="458.0" width="26.7" height="17" fill="#9a988f"/>
<text x="679.7" y="471.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">incineration   9%</text>
<rect x="646" y="482.0" width="4.9" height="17" fill="#9a988f"/>
<text x="657.9" y="495.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">other treatment   2%</text>
<text x="646.0" y="522.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Seven tons in ten leave for metals recovery.</text>
<text x="646.0" y="535.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">One in ten leaves to be buried, which is a</text>
<text x="646.0" y="548.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">different transaction: not a material with</text>
<text x="646.0" y="561.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">value in it, just somewhere else to put it.</text>
<line x1="28" y1="654.0" x2="1012" y2="654.0" stroke="#e3e2db"/>
<text x="28.0" y="674.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Exports grew +65% — 110k tons in 2001 to 182k in 2023 — while the tonnage managed in every category fell.</text>
<text x="28.0" y="689.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">K061 is what a steel mill's baghouse catches: zinc, lead and cadmium by definition. It is worth recovering, and the recovery increasingly happens elsewhere.</text>
<text x="28.0" y="704.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">All twelve management categories. Waste exported for incineration would not appear here, so the export total is a floor.</text>
</svg>