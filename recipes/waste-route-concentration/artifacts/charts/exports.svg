<text x="590.0" y="277.3" fill="#0b0b0b" font-size="12.5" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">182k</text>
<text x="106.0" y="234.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Exports grew +65% against -80% for waste</text>
<text x="106.0" y="248.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">shipped anywhere, so the share going</text>
<text x="106.0" y="262.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">abroad rose from 0.3% to 2.8%.</text>
<text x="646.0" y="164.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">what left in 2023</text>
<text x="646.0" y="180.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">by the first waste code on the record</text>
<rect x="646" y="208.0" width="141.0" height="17" fill="#b03a2e" fill-opacity="0.9"/>
<text x="651.0" y="221.0" font-size="10" fill="#ffffff" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">K061  electric-arc-furnace dust</text>
<text x="794.0" y="221.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">47%</text>
