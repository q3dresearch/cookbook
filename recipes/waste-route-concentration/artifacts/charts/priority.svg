<text x="28.0" y="670.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">D008 is the code a waste carries because it leaches lead. It was flagged as a priority chemical on 100% of records at its peak and 16% in 2023.</text>
<text x="28.0" y="685.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The left panel is kept because it is convincing. A merely bad chart teaches nothing; one that would have been believed is the entire lesson.</text>
<text x="28.0" y="700.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Metals recovery and deep-well injection, all cycles with a full-schema extract. Whether EPA revised its priority list or the flag decayed, this cannot say — only that it cannot carry a trend.</text>
