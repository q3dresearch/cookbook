<text x="636.0" y="422.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">These are tons of waste carrying the code, not</text>
<text x="636.0" y="435.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">tons of contained metal — the register records</text>
<text x="636.0" y="448.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">what a waste is classified as, never its assay.</text>
<text x="636.0" y="461.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">A recovery case needs a grade, and the grade is</text>
<text x="636.0" y="474.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">not here.</text>
<text x="636.0" y="488.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Nothing in this file is priced. It cannot say</text>
<text x="636.0" y="501.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">what a facility costs to build, what a gate fee</text>
<text x="636.0" y="514.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">is, or whether recovering a ton of this pays.</text>
<text x="636.0" y="527.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">EREF publishes tipping fees; this register</text>
<text x="636.0" y="540.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">publishes quantities.</text>
<line x1="28" y1="733.0" x2="1032" y2="733.0" stroke="#e3e2db"/>
<text x="28.0" y="753.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Deep-well injection: 9 facilities, 94k tons each, route up +60%. Landfill: 34 sites, 43k each, up +28%. Fuel blending and wastewater treatment are near 70 sites each and both shrinking.</text>
<text x="28.0" y="768.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Concentration is not the same as opportunity. Few incumbents with huge throughput and rising demand is a moat; many small firms in a falling market is a scrap.</text>
<text x="28.0" y="783.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Off-site receipts only — waste a facility took in from someone else, which is the part that is a market. On-site treatment is 91% of all tonnage and is not for sale.</text>
