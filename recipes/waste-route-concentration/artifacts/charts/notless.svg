<rect x="646" y="228.0" width="330.0" height="11" fill="#b03a2e" fill-opacity="0.75"/>
<text x="982.0" y="237.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">40.6M in 2001</text>
<rect x="646" y="242.0" width="25.6" height="11" fill="#1b7f5a" fill-opacity="0.75"/>
<text x="677.6" y="251.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">3.15M in 2023</text>
<text x="646.0" y="272.0" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">FORMER CASPER REFINERY</text>
<rect x="646" y="278.0" width="144.9" height="11" fill="#b03a2e" fill-opacity="0.75"/>
<text x="796.9" y="287.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">17.8M in 2001</text>
<text x="646.0" y="301.0" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">absent from 2023 entirely</text>
<text x="646.0" y="322.0" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">GE SILICONES, LLC</text>
<rect x="646" y="328.0" width="118.2" height="11" fill="#b03a2e" fill-opacity="0.75"/>
<text x="770.2" y="337.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">14.5M in 2001</text>
<rect x="646" y="342.0" width="53.6" height="11" fill="#1b7f5a" fill-opacity="0.75"/>
<text x="705.6" y="351.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">6.58M in 2023</text>
<text x="646.0" y="372.0" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">THE DOW CHEMICAL COMPANY</text>
<rect x="646" y="378.0" width="104.8" height="11" fill="#b03a2e" fill-opacity="0.75"/>
<text x="756.8" y="387.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">12.9M in 2001</text>
<rect x="646" y="392.0" width="1.2" height="11" fill="#1b7f5a" fill-opacity="0.75"/>
<text x="653.2" y="401.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">0.00M in 2023</text>
<text x="646.0" y="422.0" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">CROMPTON CORPORATION</text>
<rect x="646" y="428.0" width="70.7" height="11" fill="#b03a2e" fill-opacity="0.75"/>
<text x="722.7" y="437.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">8.7M in 2001</text>
<rect x="646" y="442.0" width="1.2" height="11" fill="#1b7f5a" fill-opacity="0.75"/>
<text x="653.2" y="451.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">0.01M in 2023</text>
<text x="646.0" y="472.0" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">MOTIVA ENTERPRISES LLC, CONV</text>
<rect x="646" y="478.0" width="58.3" height="11" fill="#b03a2e" fill-opacity="0.75"/>
<text x="710.3" y="487.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">7.2M in 2001</text>
<rect x="646" y="492.0" width="1.2" height="11" fill="#1b7f5a" fill-opacity="0.75"/>
<text x="653.2" y="501.0" font-size="9.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">0.00M in 2023</text>
<text x="646.0" y="528.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">They did not close. Dow files 94 records in 2023</text>
<text x="646.0" y="541.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">reporting 0.00 million tons. Their wastewater</text>
<text x="646.0" y="554.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">stopped being counted here, and EPA's own</text>
<text x="646.0" y="567.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">guidance warns that comparing across the</text>
<text x="646.0" y="580.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">wastewater reporting changes “could produce</text>
<text x="646.0" y="593.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">misleading results”.</text>
<line x1="28" y1="670.0" x2="1032" y2="670.0" stroke="#e3e2db"/>
<text x="28.0" y="690.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Facilities filing 17,360 to 17,111 (-1%); records 192,737 to 237,063 (+23%); tons 239M to 63M (-74%).</text>
<text x="28.0" y="705.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Wastewater fell -83% and everything else -30%. Hazardous wastewater is regulated under the Clean Water Act as well as RCRA, and what it is counted as has changed.</text>
<text x="28.0" y="720.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">So no headline of the form "American hazardous waste fell by X%" survives this file. What survives is the composition, the geography and the network — all within-cycle.</text>
</svg>