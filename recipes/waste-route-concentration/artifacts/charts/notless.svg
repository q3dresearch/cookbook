<text x="608.0" y="538.7" fill="#b03a2e" font-size="11" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">tons reported  -74%</text>
<text x="646.0" y="178.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">the six largest generators of 2001</text>
