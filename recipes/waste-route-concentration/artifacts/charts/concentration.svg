<text x="686.0" y="210.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The ten largest records in</text>
<text x="686.0" y="224.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">2023, all of them deep-well</text>
<text x="686.0" y="238.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">injection at a chemical plant:</text>
<text x="686.0" y="254.0" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">5.59M</text>
<text x="730.0" y="254.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">MPM SILICONES LLC</text>
<text x="686.0" y="269.0" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">3.80M</text>
<text x="730.0" y="269.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">GLOBALFOUNDRIES</text>
<text x="686.0" y="284.0" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">3.71M</text>
<text x="730.0" y="284.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">EASTMAN CHEMICAL</text>
<text x="686.0" y="299.0" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">2.93M</text>
<text x="730.0" y="299.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">EASTMAN KODAK CO &amp; RED - R</text>
<text x="686.0" y="314.0" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">2.80M</text>
<text x="730.0" y="314.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">HF SINCLAIR PARCO REFINING</text>
<text x="686.0" y="329.0" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">2.05M</text>
<text x="730.0" y="329.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ASCEND PERFORMANCE MATERIA</text>
<text x="686.0" y="362.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Counting tonnage once per waste</text>
<text x="686.0" y="375.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">code a record carries inflates</text>
<text x="686.0" y="388.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">it by 22.3x in 2001 and 28.2x in</text>
<text x="686.0" y="401.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">2023 — so any “how much plating</text>
<text x="686.0" y="414.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">waste” figure grows without</text>
<text x="686.0" y="427.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">waste being made.</text>
<line x1="28" y1="660.0" x2="1012" y2="660.0" stroke="#e3e2db"/>
<text x="28.0" y="680.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">A national statement about what is in American hazardous waste is a statement about a handful of plants: 39% of the tonnage is ten records, against 40% in 2001 — severe, and roughly constant.</text>
<text x="28.0" y="695.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Records with twenty or more waste codes were 17.8% of tonnage in 2001 and 13.2% in 2023, while unweighted codes per record fell from 2.9 to 3.4. The giants got wordier; the rest did not.</text>
<text x="28.0" y="710.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">473,908 records in 2001 and 465,189 in 2023, across all twelve management categories. This is a curve over records, not over facilities: it says nothing about plants consolidating. Method in the recipe.</text>
</svg>