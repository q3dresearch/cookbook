<text x="895.7" y="423.0" fill="#c07a1e" font-size="9" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">0.87M</text>
<text x="790.0" y="456.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">30 sites inject, top three 41%, Texas and</text>
<text x="790.0" y="469.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Louisiana 79%. They are chemical plants</text>
<text x="790.0" y="483.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">injecting their own process water — only</text>
<text x="790.0" y="496.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">about nine take waste from anyone else.</text>
<text x="28.0" y="600.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">So it is a collection-route business, not a plant business: 1.7M tons spread over nearly eight thousand customers at a median of</text>
<text x="28.0" y="617.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">three tons each. The tonnage is captive and the customers are not, and which of those two facts you size the opportunity on decides</text>
<text x="28.0" y="634.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">what you build.</text>
<line x1="28" y1="662.0" x2="1172" y2="662.0" stroke="#e3e2db"/>
<text x="28.0" y="682.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Both bases are the generator's own GM rows: managed_tons is what it treats on site, shipped_tons what it sends away, and no row carries both. The</text>
<text x="28.0" y="696.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">merchant series counts receipts at the far end, hence 1.37M against 1.7M shipped. 2021 publishes no tonnage. Method in the recipe.</text>
