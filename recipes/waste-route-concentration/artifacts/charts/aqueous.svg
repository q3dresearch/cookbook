<text x="530.0" y="464.0" font-size="9.5" fill="#8a8880" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">2011</text>
<text x="710.0" y="464.0" font-size="9.5" fill="#8a8880" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">2023</text>
<text x="380.0" y="486.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Total fell 221M to 48M; the off-site slice went</text>
<text x="380.0" y="499.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">1.65M to 1.37M — flat through all of it. Square-root</text>
<text x="380.0" y="513.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">scale.</text>
<text x="790.0" y="182.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">and injection is captive</text>
<text x="790.0" y="198.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">aqueous tonnage injected underground, by site</text>
