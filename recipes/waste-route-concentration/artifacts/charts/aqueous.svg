<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect width="1200" height="730" fill="#fcfcfb"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">Almost no water leaves the plant. Almost every firm ships all of theirs.</text>
<text x="28.0" y="62.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">FOR</text>
<text x="28.0" y="77.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">anyone sizing an aqueous waste business, by tonnage or by</text>
<text x="28.0" y="90.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">customer count</text>
<text x="409.3" y="62.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">DECIDE</text>
<text x="409.3" y="77.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">whether to build treatment capacity or a collection route</text>
<text x="790.7" y="62.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">WRONG IF</text>
<text x="790.7" y="77.0" font-size="11.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">off-site aqueous tonnage breaks out of its 22-year band</text>
<line x1="28" y1="100.0" x2="1172" y2="100.0" stroke="#e3e2db"/>
<text x="28.0" y="166.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">97% of what, though</text>
<text x="28.0" y="182.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">aqueous waste, 2023, on two bases</text>
<text x="28.0" y="208.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">of the tonnage</text>
<rect x="28" y="216.0" width="300" height="22" fill="#c07a1e"/>
<rect x="28" y="216.0" width="289.1" height="22" fill="#4a7fa8"/>
<text x="172.6" y="232.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" style="font-variant-numeric: tabular-nums">96%</text>
<text x="28.0" y="252.0" font-size="9.5" fill="#4a7fa8" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">46.3M tons stay</text>
<text x="328.0" y="252.0" font-size="9.5" fill="#c07a1e" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">1.7M ships</text>
<text x="28.0" y="286.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">of the generators</text>
<rect x="28" y="294.0" width="300" height="22" fill="#c07a1e"/>
<rect x="28" y="294.0" width="15.6" height="22" fill="#4a7fa8"/>
<text x="185.8" y="310.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" style="font-variant-numeric: tabular-nums">95%</text>
<text x="28.0" y="330.0" font-size="9.5" fill="#4a7fa8" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">410 firms treat</text>
<text x="328.0" y="330.0" font-size="9.5" fill="#c07a1e" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">7,722 ship something</text>
<text x="28.0" y="372.0" font-size="10" fill="#4a7fa8" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">kept on site</text>
<text x="328.0" y="372.0" font-size="10" fill="#c07a1e" text-anchor="end" font-weight="700" style="font-variant-numeric: tabular-nums">leaves the site</text>
<text x="28.0" y="394.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Both true, pointing opposite ways: a hundred</text>
<text x="28.0" y="407.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">plants hold 99% of the tonnage, while the median</text>
<text x="28.0" y="421.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">shipper sends 3 tons and 95% have no treatment at</text>
<text x="28.0" y="434.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">all.</text>
<text x="380.0" y="182.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">the merchant slice never grew</text>
<text x="380.0" y="198.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">all aqueous tonnage, and the part that goes off-site</text>
<line x1="380" y1="448.0" x2="710" y2="448.0" stroke="#f0efe9"/>
<text x="373.0" y="452.0" font-size="9.5" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">0</text>
