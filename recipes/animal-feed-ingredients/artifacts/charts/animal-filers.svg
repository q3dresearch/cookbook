<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="938" viewBox="0 0 1060 938"><rect width="1060" height="938" fill="#ffffff"/><rect x="0.0" y="0.0" width="1060.0" height="938.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">More firms are trying, and the ones that keep trying do better</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">The animal-food GRAS programme has roughly doubled in notices and spread across more companies at the same time. Top: notices filed</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">per four-year block, split by how many distinct firms filed them. Bottom: how often a notice clears, by how many times its firm has filed.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">94 notices and 49 firms in total. Every bar here is small — the counts are printed for that reason.</text><text x="96.0" y="224.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">notices filed</text><rect x="140.6" y="356.2" width="97.8" height="83.8" fill="#b9c9dd" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><rect x="140.6" y="389.7" width="97.8" height="50.3" fill="#2361b0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="189.5" y="346.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="middle" font-weight="700">15</text><text x="189.5" y="418.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">60%</text><text x="189.5" y="462.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">2010–13</text><text x="189.5" y="479.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">8 firms</text><rect x="303.6" y="384.1" width="97.8" height="55.9" fill="#b9c9dd" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><rect x="303.6" y="417.6" width="97.8" height="22.4" fill="#2361b0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="352.5" y="374.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="middle" font-weight="700">10</text><text x="352.5" y="432.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">40%</text><text x="352.5" y="462.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">2014–17</text><text x="352.5" y="479.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">9 firms</text><rect x="466.6" y="277.9" width="97.8" height="162.1" fill="#b9c9dd" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><rect x="466.6" y="367.4" width="97.8" height="72.6" fill="#2361b0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="515.5" y="267.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="middle" font-weight="700">29</text><text x="515.5" y="407.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">45%</text><text x="515.5" y="462.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">2018–21</text><text x="515.5" y="479.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">16 firms</text><rect x="629.6" y="250.0" width="97.8" height="190.0" fill="#b9c9dd" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><rect x="629.6" y="395.3" width="97.8" height="44.7" fill="#2361b0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="678.5" y="240.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="middle" font-weight="700">34</text><text x="678.5" y="421.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">24%</text><text x="678.5" y="462.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">2022–25</text><text x="678.5" y="479.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">24 firms</text><rect x="800.0" y="256.0" width="12.0" height="12.0" fill="#2361b0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="818.0" y="266.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">the three biggest filers</text><rect x="800.0" y="280.0" width="12.0" height="12.0" fill="#b9c9dd" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="818.0" y="290.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">everyone else</text><text x="800.0" y="324.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="start" font-weight="normal">Top-3 share falls 60% to 24%.</text><text x="800.0" y="341.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">The programme is broadening,</text><text x="800.0" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">not consolidating.</text><text x="238.0" y="532.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of notices cleared</text><text x="238.0" y="563.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">its first and only notice</text><rect x="250.0" y="548.0" width="196.2" height="22.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="456.2" y="563.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">38%</text><text x="498.2" y="563.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">n=26</text><text x="238.0" y="609.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">a firm filing 2–3</text><rect x="250.0" y="594.0" width="293.2" height="22.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="553.2" y="609.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">57%</text><text x="595.2" y="609.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">n=40</text><text x="238.0" y="655.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">a firm filing 4 or more</text><rect x="250.0" y="640.0" width="273.2" height="22.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="533.2" y="655.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">54%</text><text x="575.2" y="655.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">n=28</text><line x1="40.0" y1="728.0" x2="1020.0" y2="728.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="754.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Filing once and never again clears 38%. Filing repeatedly clears 54–57% — the same direction as human food, where it is 76% against 86%.</text><text x="40.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Which is not necessarily a lesson about persistence. A firm that files four times is a firm that had four ingredients worth filing, and that is a different kind of company</text><text x="40.0" y="795.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">from one with a single product. The data cannot separate learning from selection, and this chart should not be read as saying it can.</text><text x="40.0" y="819.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Firm names matched after stripping trailing legal suffixes. 49 distinct firms across 94 notices. Source: FDA animal food GRAS inventory, agras-notices-2026-09-11.html.</text></svg>