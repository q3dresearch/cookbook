<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="880" viewBox="0 0 1020 880"><rect width="1020" height="880" fill="#ffffff"/><rect x="0.0" y="0.0" width="1020.0" height="880.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">The same companies do worse on the animal side of FDA's wall</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Animal-food notices clear 51% against human food's 79%. The obvious objection is that animal filers are different, smaller companies.</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Eight firms file on both sides, so the objection can be tested instead of argued. Each line joins one firm's two clearance rates.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Holding the company fixed, the animal side is 27 points worse. n is 21 animal notices — the direction is solid, the magnitude is not.</text><circle cx="46.0" cy="143.0" r="6" fill="#2361b0" stroke="none" stroke-width="1"/><text x="57.0" y="147.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">human food</text><circle cx="176.0" cy="143.0" r="6" fill="#c2553e" stroke="none" stroke-width="1"/><text x="187.0" y="147.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">animal food</text><line x1="250.0" y1="230.0" x2="250.0" y2="648.0" stroke="#dfe4ea" stroke-width="1"/><text x="250.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">0%</text><line x1="380.0" y1="230.0" x2="380.0" y2="648.0" stroke="#dfe4ea" stroke-width="1"/><text x="380.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">25%</text><line x1="510.0" y1="230.0" x2="510.0" y2="648.0" stroke="#dfe4ea" stroke-width="1"/><text x="510.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">50%</text><line x1="640.0" y1="230.0" x2="640.0" y2="648.0" stroke="#dfe4ea" stroke-width="1"/><text x="640.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">75%</text><line x1="770.0" y1="230.0" x2="770.0" y2="648.0" stroke="#dfe4ea" stroke-width="1"/><text x="770.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">100%</text><text x="236.0" y="204.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="end" font-weight="normal">share of notices FDA cleared</text><line x1="472.9" y1="244.0" x2="770.0" y2="244.0" stroke="#6b7684" stroke-width="1.6"/><circle cx="770.0" cy="244.0" r="7" fill="#2361b0" stroke="none" stroke-width="1"/><circle cx="472.9" cy="244.0" r="7" fill="#c2553e" stroke="none" stroke-width="1"/><text x="236.0" y="248.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">CJ CheilJedang</text><text x="784.0" y="248.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">7 animal · 3 human</text><line x1="666.0" y1="290.0" x2="770.0" y2="290.0" stroke="#6b7684" stroke-width="1.6"/><circle cx="770.0" cy="290.0" r="7" fill="#2361b0" stroke="none" stroke-width="1"/><circle cx="666.0" cy="290.0" r="7" fill="#c2553e" stroke="none" stroke-width="1"/><text x="236.0" y="294.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">DSM Nutritional</text><text x="784.0" y="294.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">5 animal · 5 human</text><line x1="596.7" y1="336.0" x2="666.0" y2="336.0" stroke="#6b7684" stroke-width="1.6"/><circle cx="666.0" cy="336.0" r="7" fill="#2361b0" stroke="none" stroke-width="1"/><circle cx="596.7" cy="336.0" r="7" fill="#c2553e" stroke="none" stroke-width="1"/><text x="236.0" y="340.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">BASF</text><text x="784.0" y="340.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">3 animal · 5 human</text><line x1="250.0" y1="382.0" x2="645.2" y2="382.0" stroke="#6b7684" stroke-width="1.6"/><circle cx="645.2" cy="382.0" r="7" fill="#2361b0" stroke="none" stroke-width="1"/><circle cx="250.0" cy="382.0" r="7" fill="#c2553e" stroke="none" stroke-width="1"/><text x="236.0" y="386.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">AB Enzymes</text><text x="784.0" y="386.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">2 animal · 25 human</text><line x1="250.0" y1="428.0" x2="770.0" y2="428.0" stroke="#6b7684" stroke-width="1.6"/><circle cx="250.0" cy="428.0" r="7" fill="#2361b0" stroke="none" stroke-width="1"/><circle cx="770.0" cy="428.0" r="7" fill="#c2553e" stroke="none" stroke-width="1"/><text x="236.0" y="432.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">Kerry</text><text x="784.0" y="432.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">1 animal · 1 human</text><line x1="770.0" y1="474.0" x2="770.0" y2="474.0" stroke="#6b7684" stroke-width="1.6"/><circle cx="770.0" cy="467.0" r="7" fill="#2361b0" stroke="none" stroke-width="1"/><circle cx="770.0" cy="481.0" r="7" fill="#c2553e" stroke="none" stroke-width="1"/><text x="756.0" y="478.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7684" text-anchor="end" font-weight="normal">both</text><text x="236.0" y="478.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">Kemin</text><text x="784.0" y="478.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">1 animal · 1 human</text><line x1="250.0" y1="520.0" x2="770.0" y2="520.0" stroke="#6b7684" stroke-width="1.6"/><circle cx="770.0" cy="520.0" r="7" fill="#2361b0" stroke="none" stroke-width="1"/><circle cx="250.0" cy="520.0" r="7" fill="#c2553e" stroke="none" stroke-width="1"/><text x="236.0" y="524.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">Danisco US</text><text x="784.0" y="524.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">1 animal · 5 human</text><line x1="770.0" y1="566.0" x2="770.0" y2="566.0" stroke="#6b7684" stroke-width="1.6"/><circle cx="770.0" cy="559.0" r="7" fill="#2361b0" stroke="none" stroke-width="1"/><circle cx="770.0" cy="573.0" r="7" fill="#c2553e" stroke="none" stroke-width="1"/><text x="756.0" y="570.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7684" text-anchor="end" font-weight="normal">both</text><text x="236.0" y="570.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">Intralytix</text><text x="784.0" y="570.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">1 animal · 5 human</text><line x1="40.0" y1="628.2" x2="980.0" y2="628.2" stroke="#dfe4ea" stroke-width="1"/><line x1="547.1" y1="652.2" x2="686.8" y2="652.2" stroke="#1c2530" stroke-width="3"/><circle cx="686.8" cy="652.2" r="9" fill="#2361b0" stroke="none" stroke-width="1"/><circle cx="547.1" cy="652.2" r="9" fill="#c2553e" stroke="none" stroke-width="1"/><text x="236.0" y="656.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="end" font-weight="700">all eight pooled</text><text x="784.0" y="656.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">21 animal · 50 human</text><text x="547.1" y="640.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#c2553e" text-anchor="middle" font-weight="700">57%</text><text x="686.8" y="640.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#2361b0" text-anchor="middle" font-weight="700">84%</text><line x1="40.0" y1="684.2" x2="980.0" y2="684.2" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="710.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">It is the programme, not the companies. AB Enzymes clears 76% of its 25 human notices and 0% of its 2 animal ones.</text><text x="40.0" y="734.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">That does not make the animal programme stricter for no reason. Feed goes to animals people then eat, and a pet-food ingredient has no human-food twin to borrow</text><text x="40.0" y="751.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">safety data from. It says only that the gap is not explained by who is doing the filing.</text><text x="40.0" y="775.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Firm names matched after stripping trailing legal suffixes, so &quot;AB Enzymes GmbH&quot; and &quot;AB Enzymes, Inc.&quot; are one firm. Sources: FDA human and animal GRAS inventories.</text></svg>