<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="998" viewBox="0 0 1080 998"><rect width="1080" height="998" fill="#ffffff"/><rect x="0.0" y="0.0" width="1080.0" height="998.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Every way an animal notice can fail is more likely than for human food</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">How notices end, animal against human. The animal bars carry a 95% interval, because 94 notices is small enough that a bare</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">percentage invites more confidence than it has earned. Human food is 1,336 notices and its intervals are about two points wide.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">It is not one failure mode: withdrawal is twice as likely, outright refusal four times, and still-pending three times.</text><text x="242.0" y="249.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="end" font-weight="600">FDA had no questions</text><rect x="260.0" y="233.0" width="291.1" height="24.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><line x1="494.4" y1="245" x2="607.3" y2="245" stroke="#1c2530" stroke-width="1.5"/><line x1="494.4" y1="238" x2="494.4" y2="252" stroke="#1c2530" stroke-width="1.5"/><line x1="607.3" y1="238" x2="607.3" y2="252" stroke="#1c2530" stroke-width="1.5"/><text x="619.3" y="249.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="700">51%</text><line x1="710.5" y1="230" x2="710.5" y2="260" stroke="#2361b0" stroke-width="2.5"/><text x="710.5" y="224.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#2361b0" text-anchor="middle" font-weight="700">79%</text><text x="242.0" y="301.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="end" font-weight="600">pulled by the company</text><rect x="260.0" y="285.0" width="194.0" height="24.0" fill="#c2553e" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><line x1="404.0" y1="297" x2="511.3" y2="297" stroke="#1c2530" stroke-width="1.5"/><line x1="404.0" y1="290" x2="404.0" y2="304" stroke="#1c2530" stroke-width="1.5"/><line x1="511.3" y1="290" x2="511.3" y2="304" stroke="#1c2530" stroke-width="1.5"/><text x="523.3" y="301.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="700">34%</text><line x1="356.0" y1="282" x2="356.0" y2="312" stroke="#2361b0" stroke-width="2.5"/><text x="356.0" y="276.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#2361b0" text-anchor="middle" font-weight="700">17%</text><text x="242.0" y="353.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="end" font-weight="600">refused</text><rect x="260.0" y="337.0" width="36.4" height="24.0" fill="#7a2f22" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><line x1="276.9" y1="349" x2="335.4" y2="349" stroke="#1c2530" stroke-width="1.5"/><line x1="276.9" y1="342" x2="276.9" y2="356" stroke="#1c2530" stroke-width="1.5"/><line x1="335.4" y1="342" x2="335.4" y2="356" stroke="#1c2530" stroke-width="1.5"/><text x="347.4" y="353.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="700">6%</text><line x1="268.5" y1="334" x2="268.5" y2="364" stroke="#2361b0" stroke-width="2.5"/><text x="268.5" y="328.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#2361b0" text-anchor="middle" font-weight="700">1%</text><text x="242.0" y="405.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="end" font-weight="600">still pending</text><rect x="260.0" y="389.0" width="48.5" height="24.0" fill="#b9b4a8" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><line x1="284.9" y1="401" x2="350.7" y2="401" stroke="#1c2530" stroke-width="1.5"/><line x1="284.9" y1="394" x2="284.9" y2="408" stroke="#1c2530" stroke-width="1.5"/><line x1="350.7" y1="394" x2="350.7" y2="408" stroke="#1c2530" stroke-width="1.5"/><text x="362.7" y="405.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="700">9%</text><line x1="274.9" y1="386" x2="274.9" y2="416" stroke="#2361b0" stroke-width="2.5"/><text x="274.9" y="380.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#2361b0" text-anchor="middle" font-weight="700">3%</text><text x="260.0" y="214.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">animal bar, with its 95% interval</text><line x1="844" y1="202" x2="844" y2="218" stroke="#2361b0" stroke-width="2.5"/><text x="854.0" y="214.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#2361b0" text-anchor="start" font-weight="normal">human food</text><text x="40.0" y="542.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1c2530" text-anchor="start" font-weight="600">The same outcomes by era, plus the notices FDA declined to assess</text><text x="40.0" y="560.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Withdrawal has no trend. “FDA did not say whether it works” went 0%, 6%, 29%, 14%.</text><rect x="285.6" y="689.6" width="91.2" height="68.4" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="285.6" y="630.9" width="91.2" height="58.7" fill="#c2553e" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="285.6" y="582.0" width="91.2" height="48.9" fill="#7a2f22" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><line x1="285.6" y1="758.0" x2="376.8" y2="758.0" stroke="#f0b44a" stroke-width="3"/><text x="384.8" y="762.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b8860b" text-anchor="start" font-weight="700">0%</text><text x="331.2" y="780.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">2010–14</text><text x="331.2" y="796.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=18</text><rect x="428.1" y="633.8" width="91.2" height="124.2" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="428.1" y="592.4" width="91.2" height="41.4" fill="#c2553e" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="428.1" y="582.0" width="91.2" height="10.4" fill="#7a2f22" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><line x1="428.1" y1="747.6" x2="519.4" y2="747.6" stroke="#f0b44a" stroke-width="3"/><text x="527.4" y="751.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b8860b" text-anchor="start" font-weight="700">6%</text><text x="473.8" y="780.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">2015–19</text><text x="473.8" y="796.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=17</text><rect x="570.6" y="665.4" width="91.2" height="92.6" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="570.6" y="582.0" width="91.2" height="83.4" fill="#c2553e" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><line x1="570.6" y1="707.1" x2="661.9" y2="707.1" stroke="#f0b44a" stroke-width="3"/><text x="669.9" y="711.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b8860b" text-anchor="start" font-weight="700">29%</text><text x="616.2" y="780.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">2020–24</text><text x="616.2" y="796.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=38</text><rect x="713.1" y="682.6" width="91.2" height="75.4" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="713.1" y="649.0" width="91.2" height="33.5" fill="#c2553e" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="713.1" y="582.0" width="91.2" height="67.0" fill="#b9b4a8" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><line x1="713.1" y1="732.9" x2="804.4" y2="732.9" stroke="#f0b44a" stroke-width="3"/><text x="812.4" y="736.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b8860b" text-anchor="start" font-weight="700">14%</text><text x="758.8" y="780.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">2025–29</text><text x="758.8" y="796.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=21</text><rect x="844.0" y="586.0" width="22.0" height="3.0" fill="#f0b44a" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="874.0" y="591.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">share FDA declined</text><text x="874.0" y="607.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">to assess for utility</text><line x1="40.0" y1="820.0" x2="1040.0" y2="820.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="846.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Animal notices clear 51% (95% CI 41–61%) against human food's 79% (77–81%). The intervals do not touch, so this is not a small-sample artefact.</text><text x="40.0" y="870.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">The withdrawal rate itself has no trend and the final block is probably censored — all eight pending notices were filed in 2025 or later, so some will yet be pulled.</text><text x="40.0" y="887.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">The yellow line is the one that moved: nothing before 2015, then FDA clearing a sixth to a third of animal notices while stating it did not evaluate whether the ingredient works.</text><text x="40.0" y="904.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Where exactly that sits depends on the block boundaries — five-year blocks give 0%, 6%, 29%, 14% and four-year blocks give 0%, 0%, 23%, 24%. The rise is the finding, not the last figure.</text><text x="40.0" y="930.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">94 animal notices against 1,336 human ones. Wilson intervals. Sources: FDA animal and human food GRAS inventories, agras-notices-2026-09-11.html.</text></svg>