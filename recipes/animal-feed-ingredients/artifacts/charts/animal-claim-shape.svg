<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="808" viewBox="0 0 1080 808"><rect width="1080" height="808" fill="#ffffff"/><rect x="0.0" y="0.0" width="1080.0" height="808.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">A narrow, specific claim clears more often than a broad vague one</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Two things the notifier chooses, against how often FDA cleared the notice. Bars are the share cleared; the number beside each is how</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">many notices sit in that band. The small figures on the right are the same split under two or three controls.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Neither is a large sample. 94 notices, and every split of it is smaller — read the counts, not the decimals.</text><text x="40.0" y="218.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1c2530" text-anchor="start" font-weight="600">How many species the notice claims</text><text x="282.0" y="241.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">one</text><rect x="300.0" y="226.0" width="266.7" height="22.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="576.7" y="241.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">56% cleared</text><text x="662.7" y="241.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">n=45</text><text x="282.0" y="287.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">two or three</text><rect x="300.0" y="272.0" width="248.9" height="22.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="558.9" y="287.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">52% cleared</text><text x="644.9" y="287.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">n=27</text><text x="282.0" y="333.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">four or more</text><rect x="300.0" y="318.0" width="171.4" height="22.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="481.4" y="333.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">36% cleared</text><text x="567.4" y="333.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">n=14</text><text x="282.0" y="379.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">“all animals”</text><rect x="300.0" y="364.0" width="240.0" height="22.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="550.0" y="379.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">50% cleared</text><text x="636.0" y="379.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">n=8</text><text x="834.0" y="218.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">same split under controls</text><text x="834.0" y="240.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">all notices</text><text x="948.0" y="240.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="start" font-weight="normal">41% vs 54%</text><text x="834.0" y="257.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">no ethanol</text><text x="948.0" y="257.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="start" font-weight="normal">45% vs 55%</text><text x="834.0" y="274.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">2018 on</text><text x="948.0" y="274.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="start" font-weight="normal">43% vs 55%</text><text x="40.0" y="480.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1c2530" text-anchor="start" font-weight="600">How specific the stated use is</text><text x="282.0" y="503.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">shorter than 103 chars</text><rect x="300.0" y="488.0" width="147.7" height="22.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="457.7" y="503.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">31% cleared</text><text x="543.7" y="503.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">n=39</text><text x="282.0" y="549.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">103 chars or more</text><rect x="300.0" y="534.0" width="252.0" height="22.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="562.0" y="549.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">52% cleared</text><text x="648.0" y="549.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">n=40</text><text x="834.0" y="480.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">same split under controls</text><text x="834.0" y="502.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">all described</text><text x="948.0" y="502.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="start" font-weight="normal">31% vs 52%</text><text x="834.0" y="519.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">no ethanol</text><text x="948.0" y="519.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="start" font-weight="normal">31% vs 58%</text><text x="834.0" y="536.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">food-producing</text><text x="948.0" y="536.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="start" font-weight="normal">22% vs 52%</text><line x1="40.0" y1="632.0" x2="1040.0" y2="632.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="658.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Naming one species clears 56%. Naming four or more clears 36%. A use statement over 103 characters clears 52%; a shorter one 31%.</text><text x="40.0" y="682.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">The species result is not just the corn-ethanol cohort that claimed every farm animal at once: it survives dropping those notices and dropping everything before 2018.</text><text x="40.0" y="699.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">The specificity result survives the same two plus restricting to livestock. z = +1.96, which is borderline, and length is a crude proxy for how specific a claim is.</text><text x="40.0" y="723.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Use statements are also getting shorter: median 128 characters in 2010-14, 56 in 2025-29. Claims are getting vaguer at the same time FDA is increasingly declining to</text><text x="40.0" y="740.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">assess whether they work. The 15 notices FDA declined to describe are excluded from the specificity panel — they have no stated use to measure. Source: agras-notices-2026-09-11.html.</text></svg>