<line x1="28" y1="760.0" x2="1032" y2="760.0" stroke="#e3e2db"/>
<text x="28.0" y="780.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">A strike-off proposal is a one-year event: 48% die in year one, then 13% of the survivors in year two — against 12% for a company never flagged. Administration is the opposite, 26% rising to 35%.</text>
<text x="28.0" y="795.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">So the flag is worth acting on immediately and worth little after twelve months. The absence of a flag is worth almost nothing: 81% of departures never had one.</text>
<text x="28.0" y="810.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">5,632,838 companies, 1,369,538 departures. A death is a disappearance between snapshots; the register publishes no dissolution date for the living.</text>
