<text x="473.6" y="213.4" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">— not the expectation</text>
<text x="304.0" y="612.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">official series: enterprises registered for VAT or PAYE</text>
<text x="94.0" y="130.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">this recipe:</text>
<text x="94.0" y="144.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">companies on</text>
<text x="94.0" y="158.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">the register</text>
