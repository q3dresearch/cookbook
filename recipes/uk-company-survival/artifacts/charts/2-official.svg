<text x="191.0" y="534.3" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Transport</text>
<circle cx="305.7" cy="514.5" r="5.5" fill="#1b4f8a" fill-opacity="0.85"/>
<path d="M311.7 514.5 L313.7 552.0" stroke="#8a8880" stroke-width="0.8"/>
<text x="316.7" y="555.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Retail &amp; wholesale</text>
<text x="672.0" y="178.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Eleven of fourteen industries</text>
<text x="672.0" y="193.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">sit below the line, and the</text>
<text x="672.0" y="208.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">ranking agrees at rho +0.79. Two</text>
<text x="672.0" y="223.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">populations, two definitions of</text>
<text x="672.0" y="238.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">death and two periods, and they</text>
<text x="672.0" y="253.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">order industries the same way.</text>
<text x="672.0" y="286.0" font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The three above the line are the</text>
<text x="672.0" y="301.0" font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">sectors full of dormant holding</text>
<text x="672.0" y="316.0" font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">structures — a property vehicle</text>
<text x="672.0" y="331.0" font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">or a holding company sits on the</text>
<text x="672.0" y="346.0" font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">register for years without ever</text>
<text x="672.0" y="361.0" font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">being a VAT or PAYE enterprise,</text>
<text x="672.0" y="376.0" font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">so the register keeps it alive</text>
<text x="672.0" y="391.0" font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">and the official series never</text>
<text x="672.0" y="406.0" font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">counted it born.</text>
<text x="672.0" y="436.0" font-size="11.5" fill="#1b4f8a" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Retail is the largest gap in the</text>
<text x="672.0" y="451.0" font-size="11.5" fill="#1b4f8a" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">other direction, which is where</text>
<text x="672.0" y="466.0" font-size="11.5" fill="#1b4f8a" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">cheap incorporation and quick</text>
<text x="672.0" y="481.0" font-size="11.5" fill="#1b4f8a" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">strike-off concentrate.</text>
<line x1="28" y1="620.0" x2="1032" y2="620.0" stroke="#e3e2db"/>
<text x="28.0" y="640.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Overall the register says 32.9% against the official 38.4%. Lower was the prediction, because the register counts shells the official series never sees.</text>
<text x="28.0" y="655.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">This is a check, not a calibration. Nothing in the recipe was adjusted to fit the official series, and the residuals are left visible rather than absorbed.</text>
<text x="28.0" y="670.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The official deaths are earlier by construction: a company stops trading long before Companies House strikes it off, which pushes this recipe's survival up rather than down.</text>
</svg>