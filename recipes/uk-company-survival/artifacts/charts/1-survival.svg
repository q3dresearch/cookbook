<circle cx="149.1" cy="330.0" r="4.5" fill="#0b0b0b"/>
<text x="315.2" y="175.2" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Half of all UK companies are off the register by age</text>
<text x="315.2" y="190.2" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">2.3. The yearly risk PEAKS in the second year rather</text>
<text x="315.2" y="205.2" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">than the first, because a company cannot be struck</text>
<text x="315.2" y="220.2" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">off for not filing until its first accounts are</text>
<text x="315.2" y="235.2" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">overdue.</text>
<line x1="28" y1="590.0" x2="992" y2="590.0" stroke="#e3e2db"/>
<text x="28.0" y="610.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Sector changes the answer more than anything else here: 17% of retail and wholesale companies reach five years against 59% of real estate ones.</text>
<text x="28.0" y="625.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Leaving the register is not the same as failing. Only 4.5% of departures were in liquidation or administration a year earlier; the rest were dissolved.</text>
<text x="28.0" y="640.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Ages 0-1 disagree between the two measurement years by 6 points, so the first year is the least trustworthy part of this curve. Every other band agrees within 2.</text>
</svg>