<text x="640.0" y="570.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Darker means fewer survive. The Cardiff address is</text>
<text x="640.0" y="583.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">a different business from the Covent Garden one:</text>
<text x="640.0" y="596.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">both hold tens of thousands of companies, and one</text>
<text x="640.0" y="609.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">loses five in six of them within two years.</text>
<line x1="28" y1="732.0" x2="1032" y2="732.0" stroke="#e3e2db"/>
<text x="28.0" y="752.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The 2012 cohorts were indistinguishable — 87.3% against 87.7%. The 2023 cohorts are 33.0% against 54.3%. Whatever changed, it changed recently.</text>
<text x="28.0" y="767.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">449,461 companies at the forty addresses, 5,095,597 elsewhere. Age-standardised survival 68.3% against 77.3%, so the gap is not composition.</text>
<text x="28.0" y="782.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The register carries the address and the outcome and nothing about the relationship. A high-churn address may be a cheap service used by people trying things, or something else.</text>
</svg>