<text x="126.0" y="643.0" font-size="11" fill="#b03a2e" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">at the 40 busiest addresses</text>
<text x="96.0" y="668.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">In 2012 the two were the same. Standardised to the national</text>
<text x="96.0" y="682.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">age mix, agent-address survival is 68.3% against 77.3% — a gap</text>
<text x="96.0" y="696.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">of 8.9 points that is not just these companies being newer.</text>
<text x="640.0" y="164.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">the ten busiest registered offices</text>
<text x="640.0" y="180.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">bar is how many companies; the number is two-year survival</text>
