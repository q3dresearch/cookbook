<text x="735.0" y="435.4" font-size="11" fill="#7a6ea6" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Construction  9.0%</text>
<line x1="721.0" y1="490.2" x2="731.0" y2="490.2" stroke="#b03a2e" stroke-width="1"/>
<text x="735.0" y="494.2" font-size="11" fill="#b03a2e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Manufacturing  3.8%</text>
<text x="132.0" y="200.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Manufacturing fell from 7.6% of new British limited</text>
<text x="132.0" y="215.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">companies in 1998 to 3.8% in 2025, while retail and</text>
<text x="132.0" y="230.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">wholesale went the other way.</text>
