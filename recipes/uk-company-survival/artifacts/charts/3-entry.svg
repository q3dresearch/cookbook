<text x="28.0" y="615.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Before repeating a decline narrative about a sector, check whether people are still forming companies in it. This is the measure that answers that, and it needs no deaths.</text>
<text x="28.0" y="630.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">These are survivors, so early years are thinned unevenly: manufacturing survives worse than average, so its true 1998 share was above 7.6% and the fall is steeper than drawn.</text>
<text x="28.0" y="645.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Entry share is not output. A sector can consolidate into fewer, larger firms and look identical here; distinguishing the two needs employment or turnover, which registers do not carry.</text>
<text x="28.0" y="660.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The industry code is self-declared at incorporation and rarely updated, so it records what the founder intended rather than what the company did.</text>
</svg>