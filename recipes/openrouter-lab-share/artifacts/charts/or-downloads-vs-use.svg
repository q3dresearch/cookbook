"40.0" y1="864.0" x2="1020.0" y2="864.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="890.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">openai/gpt-oss-20b is the most downloaded and serves 0.22% of tokens. deepseek/deepseek-v4-flash serves 17.1% with 4x fewer downloads.</text><text x="40.0" y="914.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Green means a model is used more than its downloads suggest; red, less. If download counts were a usage proxy these lines would be flat, and they are not.</text><text x="40.0" y="938.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">SCOPE: this join can only see OPEN-WEIGHT models. A closed model has no Hugging Face presence, so Claude and the GPT-5 series are absent by construction — it says how</text><text x="40.0" y="955.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">open-weight popularity relates to open-weight use, not how the market works. 15 models is small; the ranks are shown rather than a fitted line for that reason.</text><text x="40.0" y="972.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Sources: OpenRouter rankings and models catalog; Hugging Face model index via the wss-hugging-face archive.</text></svg>