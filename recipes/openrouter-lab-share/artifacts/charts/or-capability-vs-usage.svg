<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="850" viewBox="0 0 1020 850"><rect width="1020" height="850" fill="#ffffff"/><rect x="0.0" y="0.0" width="1020.0" height="850.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Being better does not make you used</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Each dot is one model. Across: an independent intelligence index. Up: the share of August 2026 tokens it actually served on</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">OpenRouter. Colour is price per million input tokens. If capability drove demand this would slope upward.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">It does not: correlation is +0.02. What moves with usage is price, and it moves the wrong way — corr(log price, share) = -0.33.</text><line x1="196.0" y1="644.0" x2="770.0" y2="644.0" stroke="#dfe4ea" stroke-width="1"/><text x="186.0" y="648.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0%</text><line x1="196.0" y1="582.3" x2="770.0" y2="582.3" stroke="#dfe4ea" stroke-width="1"/><text x="186.0" y="586.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">2%</text><line x1