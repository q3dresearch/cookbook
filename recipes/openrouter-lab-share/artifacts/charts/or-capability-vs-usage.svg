" height="16.0" fill="#79b7dd" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="826.0" y="315.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">$0.30-1</text><rect x="800.0" y="324.0" width="18.0" height="16.0" fill="#3d86bf" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="826.0" y="337.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">$1-3</text><rect x="800.0" y="346.0" width="18.0" height="16.0" fill="#20599a" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="826.0" y="359.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">$3-10</text><rect x="800.0" y="368.0" width="18.0" height="16.0" fill="#12336b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="826.0" y="381.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">over $10</text><line x1="40.0" y1="702.0" x2="980.0" y2="702.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="728.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Capability and usage are uncorrelated (+0.02). Price and usage are, negatively (-0.33). The market buys cheap, not smart.</text><text x="40.0" y="752.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">A benchmark table is not a demand forecast. Anyone reading leaderboard position as market position has the wrong variable — which is most coverage of this industry.</text><text x="40.0" y="776.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">46 models join the benchmark feed on model_permaslug, covering 57% of August tokens. Intelligence index from Artificial Analysis; price is input list price.</text><text x="40.0" y="793.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">OpenRouter is a router: it sees everyone who routes through it and nobody who calls a lab directly. Source: OpenRouter, Artificial Analysis.</text></svg>