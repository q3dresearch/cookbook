<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1030" viewBox="0 0 1020 1030"><rect width="1020" height="1030" fill="#ffffff"/><rect x="0.0" y="0.0" width="1020.0" height="1030.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Whoever picks the denominator picks the winner</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Every lab routed through OpenRouter in August 2026. Across: its share of tokens served. Up: its share of what those tokens cost at</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">list price. Both axes are shares of the same population on the same scale, so the dashed line is parity — paid exactly in proportion</text><text x="40.0" y="108.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">to what you serve. Area is absolute tokens.</text><text x="40.0" y="134.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">DeepSeek serves a third of the tokens and takes a tenth of the spend. Anthropic serves 8% and takes 41%. Both are true of the same month.</text><line x1="132.0" y1="810.0" x2="692.0" y2="810.0" stroke="#dfe4ea" stroke-width="1"/><text x="122.0" y="814.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0%</text><line x1="132.0" y1="250.0" x2="132.0" y2="810.0" stroke="#dfe4ea" stroke-width="1"/><text x="132.0" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">0%</text><line x1="132.0" y1="689.8" x2="692.0" y2="689.8" stroke="#dfe4ea" stroke-width="1"/><text x="122.0" y="693.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">10%</text><line x1="252.2" y1="250.0" x2="252.2" y2="810.0" stroke="#dfe4ea" stroke-width="1"/><text x="252.2" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">10%</text><line x1="132.0" y1="569.7" x2="692.0" y2="569.7" stroke="#dfe4ea" stroke-width="1"/><text x="122.0" y="573.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">20%</text><line x1="372.3" y1="250.0" x2="372.3" y2="810.0" stroke="#dfe4ea" stroke-width="1"/><text x="372.3" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">20%</text><line x1="132.0" y1="449.5" x2="692.0" y2="449.5" stroke="#dfe4ea" stroke-width="1"/><text x="122.0" y="453.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">30%</text><line x1="492.5" y1="250.0" x2="492.5" y2="810.0" stroke="#dfe4ea" stroke-width="1"/><text x="492.5" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">30%</text><line x1="132.0" y1="329.4" x2="692.0" y2="329.4" stroke="#dfe4ea" stroke-width="1"/><text x="122.0" y="333.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">40%</text><line x1="612.6" y1="250.0" x2="612.6" y2="810.0" stroke="#dfe4ea" stroke-width="1"/><text x="612.6" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">40%</text><text x="122.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of SPEND</text><text x="122.0" y="238.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">tokens × input list price</text><text x="692.0" y="854.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of TOKENS served</text><line x1="132.0" y1="810.0" x2="692.0" y2="250.0" stroke="#6b7684" stroke-width="1" stroke-dasharray="5 5"/><text x="546.4" y="385.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">paid in proportion to what you serve</text><text x="144.0" y="272.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal" font-style="font-style:italic">paid MORE than it serves</text><text x="680.0" y="798.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal" font-style="font-style:italic">serves MORE than it is paid</text><circle cx="529.5" cy="697.3" r="21.0" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="356.2" cy="595.4" r="17.016086298079422" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="312.3" cy="664.6" r="15.776452914380599" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="269.6" cy="789.3" r="14.415297610380895" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="234.3" cy="310.0" r="13.11607122396009" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="209.6" cy="727.0" r="12.069531767697807" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="167.3" cy="793.7" r="9.76694693091332" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="165.3" cy="733.0" r="9.628239641824479" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="140.8" cy="782.1" r="7.375714250196267" fill="#2a78d6" stroke="none" stroke-width="1"/><circle cx="135.7" cy="807.2" r="6.538054370191494" fill="#eb6834" stroke="none" stroke-width="1"/><text x="254.4" y="314.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">anthropic  9% / 42%</text><text x="557.5" y="701.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">deepseek  33% / 9%</text><text x="380.2" y="599.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">openai  19% / 18%</text><text x="335.1" y="668.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">z-ai  15% / 12%</text><text x="291.0" y="793.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">xiaomi  11% / 2%</text><text x="228.7" y="731.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">google  6% / 7%</text><text x="181.9" y="752.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">moonshotai  3% / 6%</text><text x="184.0" y="767.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">minimax  3% / 1%</text><text x="155.1" y="816.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">x-ai  1% / 2%</text><circle cx="864.0" cy="260.0" r="7" fill="#eb6834" stroke="none" stroke-width="1"/><text x="878.0" y="264.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Chinese lab</text><circle cx="864.0" cy="284.0" r="7" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="878.0" y="288.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">everyone else</text><line x1="40.0" y1="876.0" x2="980.0" y2="876.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="902.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Chinese labs serve 66% of the tokens and take 31% of the spend. Anthropic serves 8% and takes 41%.</text><text x="40.0" y="926.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Both numbers are real. The word “share” is doing the lying, and which one a headline means is usually whichever supports it.</text><text x="40.0" y="950.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Input-token LIST price only — completion tokens cost several times more and are not counted, and nobody large pays list. Covers the 61% of August tokens that join</text><text x="40.0" y="967.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">to a price, keyed on model_permaslug. And this is spend routed through OpenRouter, which is not lab revenue: OpenRouter sees everyone who routes and nobody who calls a lab</text><text x="40.0" y="984.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">directly. A direction, not an invoice. Source: OpenRouter (openrouter.ai/rankings).</text></svg>