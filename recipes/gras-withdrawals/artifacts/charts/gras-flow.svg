<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730"><rect width="1120" height="730" fill="#ffffff"/><rect x="0.0" y="0.0" width="1120.0" height="730.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">What happens to a new food ingredient after a company tells FDA about it</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">All 1,336 filings FDA has closed since 1998. Companies decide for themselves that an ingredient is safe and notify FDA; FDA reads the file and replies.</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Band height is the number of filings, on one scale throughout. The second and third columns follow only the filings the company pulled.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">The best reply available is “we have no questions”. FDA does not approve these; it declines to object.</text><path d="M326,457.60479041916165 C473.0,457.60479041916165 473.0,457.60479041916165 620,457.60479041916165 L620,529.7080838323353 C473.0,529.7080838323353 473.0,499.7080838323353 326,499.7080838323353 Z" fill="#e8963c" fill-opacity="0.28"/><path d="M646,457.60479041916165 C773.0,457.60479041916165 773.0,457.60479041916165 900,457.60479041916165 L900,534.7679640718562 C773.0,534.7679640718562 773.0,470.70359281437123 646,470.70359281437123 Z" fill="#e8963c" fill-opacity="0.28"/><rect x="300.0" y="230.0" width="26.0" height="197.6" fill="#2e9e6b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="286.0" y="322.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">FDA had no questions</text><text x="286.0" y="339.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">its version of a yes</text><text x="335.0" y="332.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">1,056</text><rect x="300.0" y="457.6" width="26.0" height="42.1" fill="#e8963c" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="286.0" y="472.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">The company pulled it</text><text x="286.0" y="489.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">before FDA finished reading</text><text x="335.0" y="482.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">225</text><rect x="300.0" y="529.7" width="26.0" height="6.5" fill="#8a8f98" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="286.0" y="527.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">Still being read</text><text x="286.0" y="544.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">filed, no reply yet</text><text x="335.0" y="537.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">35</text><rect x="300.0" y="566.3" width="26.0" height="3.7" fill="#d1495b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="286.0" y="562.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">FDA said the file was not enough</text><text x="286.0" y="579.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">the only outright no</text><text x="335.0" y="572.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">20</text><rect x="620.0" y="457.6" width="26.0" height="13.1" fill="#e8963c" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="656.0" y="458.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">Filed again later</text><text x="656.0" y="475.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">same ingredient, new number</text><text x="611.0" y="468.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">70</text><rect x="620.0" y="500.7" width="26.0" height="29.0" fill="#8a8f98" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="656.0" y="509.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">Never seen again</text><text x="656.0" y="526.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">FDA's records end here</text><text x="611.0" y="519.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">155</text><rect x="900.0" y="457.6" width="26.0" height="12.2" fill="#2e9e6b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="936.0" y="457.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">FDA had no questions</text><text x="936.0" y="474.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">cleared on a later try</text><text x="891.0" y="467.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">65</text><rect x="900.0" y="499.8" width="26.0" height="2.5" fill="#e8963c" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="936.0" y="499.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">Pulled again</text><text x="891.0" y="505.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">4</text><rect x="900.0" y="532.3" width="26.0" height="2.5" fill="#d1495b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="3"/><text x="936.0" y="531.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">File was not enough</text><text x="891.0" y="537.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">1</text><text x="313.0" y="204.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="normal" font-style="font-style:italic">FDA's reply</text><text x="633.0" y="204.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="normal" font-style="font-style:italic">of the ones pulled…</text><text x="913.0" y="204.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="normal" font-style="font-style:italic">…and then</text><line x1="40.0" y1="598.0" x2="1080.0" y2="598.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="622.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">225 filings were pulled by the company — 17% of everything closed, and 11 times more often than FDA said no.</text><text x="40.0" y="644.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">155 of them were never seen again. FDA links a later filing only when it knows the two are related, so that number is an upper bound on “abandoned” — a company can also refile by</text><text x="40.0" y="661.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">another route, or sell the ingredient without telling FDA at all, which the law allows and this file cannot see.</text><text x="40.0" y="684.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Source: FDA GRAS Notice Inventory, gras-notices-2026-09-11.csv. Chains followed through FDA's own Resubmitted / Resubmission fields, cycle-guarded.</text></svg>