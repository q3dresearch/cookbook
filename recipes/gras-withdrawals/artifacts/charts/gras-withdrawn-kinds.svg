<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="936" viewBox="0 0 1130 936"><rect width="1130" height="936" fill="#ffffff"/><rect x="0.0" y="0.0" width="1130.0" height="936.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Which kinds of ingredient get abandoned before FDA finishes</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">One filing = one company telling FDA about one new ingredient. Across: how many ingredients OF THIS KIND have ever been put to FDA.</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Up: the share of those that the company pulled and never filed again. Colour: how much of that kind comes from companies that file once and never appear again.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">A filing is almost always ONE substance, not a recipe with components: only 20 of 1,336 cover several at once, and those behave no differently (10% dropped against 12%).</text><text x="40.0" y="133.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">The flat line is the rate across everything (12%); the sloping one is the fit. Nothing here was banned — FDA has refused 20 filings ever. Dropped means the company stopped.</text><line x1="150.0" y1="636.0" x2="830.0" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="140.0" y="640.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0%</text><line x1="150.0" y1="591.7" x2="830.0" y2="591.7" stroke="#dfe4ea" stroke-width="1"/><text x="140.0" y="595.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">5%</text><line x1="150.0" y1="547.5" x2="830.0" y2="547.5" stroke="#dfe4ea" stroke-width="1"/><text x="140.0" y="551.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">10%</text><line x1="150.0" y1="503.2" x2="830.0" y2="503.2" stroke="#dfe4ea" stroke-width="1"/><text x="140.0" y="507.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">15%</text><line x1="150.0" y1="459.0" x2="830.0" y2="459.0" stroke="#dfe4ea" stroke-width="1"/><text x="140.0" y="463.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">20%</text><line x1="150.0" y1="414.7" x2="830.0" y2="414.7" stroke="#dfe4ea" stroke-width="1"/><text x="140.0" y="418.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">25%</text><line x1="150.0" y1="370.5" x2="830.0" y2="370.5" stroke="#dfe4ea" stroke-width="1"/><text x="140.0" y="374.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">30%</text><line x1="150.0" y1="326.2" x2="830.0" y2="326.2" stroke="#dfe4ea" stroke-width="1"/><text x="140.0" y="330.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">35%</text><line x1="150.0" y1="282.0" x2="830.0" y2="282.0" stroke="#dfe4ea" stroke-width="1"/><text x="140.0" y="286.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">40%</text><line x1="217.0" y1="236.0" x2="217.0" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="217.0" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">50</text><line x1="284.1" y1="236.0" x2="284.1" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="284.1" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">100</text><line x1="351.1" y1="236.0" x2="351.1" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="351.1" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">150</text><line x1="418.2" y1="236.0" x2="418.2" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="418.2" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">200</text><line x1="485.2" y1="236.0" x2="485.2" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="485.2" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">250</text><line x1="552.3" y1="236.0" x2="552.3" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="552.3" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">300</text><line x1="619.3" y1="236.0" x2="619.3" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="619.3" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">350</text><line x1="686.4" y1="236.0" x2="686.4" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="686.4" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">400</text><line x1="753.4" y1="236.0" x2="753.4" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="753.4" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">450</text><line x1="820.5" y1="236.0" x2="820.5" y2="636.0" stroke="#dfe4ea" stroke-width="1"/><text x="820.5" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">500</text><text x="140.0" y="208.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="end" font-weight="600">abandoned for good</text><text x="140.0" y="224.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">share of this kind's filings</text><text x="830.0" y="680.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="end" font-weight="600">ingredients of this kind ever put to FDA</text><line x1="150" y1="533.3" x2="830" y2="533.3" stroke="#4a3aa7" stroke-width="1.3" stroke-dasharray="5 4"/><text x="824.0" y="525.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a3aa7" text-anchor="end" font-weight="normal">all filings · 12%</text><line x1="150.0" y1="411.3" x2="830.0" y2="636.0" stroke="#6b7684" stroke-width="1.2" stroke-dasharray="6 4"/><text x="558.0" y="564.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">fewer dropped as a category fills out</text><circle cx="768.2" cy="622.6" r="9.5" fill="#5a90cc" stroke="none" stroke-width="1"/><circle cx="372.6" cy="540.0" r="9.5" fill="#cfe0f2" stroke="none" stroke-width="1"/><circle cx="294.8" cy="562.2" r="9.5" fill="#cfe0f2" stroke="none" stroke-width="1"/><circle cx="293.5" cy="511.9" r="9.5" fill="#cfe0f2" stroke="none" stroke-width="1"/><circle cx="280.1" cy="453.5" r="9.5" fill="#2f6cb0" stroke="none" stroke-width="1"/><circle cx="274.7" cy="493.2" r="9.5" fill="#2f6cb0" stroke="none" stroke-width="1"/><circle cx="264.0" cy="563.1" r="9.5" fill="#cfe0f2" stroke="none" stroke-width="1"/><circle cx="250.6" cy="364.6" r="9.5" fill="#93b9e0" stroke="none" stroke-width="1"/><circle cx="227.8" cy="452.9" r="9.5" fill="#2f6cb0" stroke="none" stroke-width="1"/><circle cx="213.0" cy="297.0" r="9.5" fill="#2f6cb0" stroke="none" stroke-width="1"/><circle cx="202.3" cy="386.4" r="9.5" fill="#2f6cb0" stroke="none" stroke-width="1"/><text x="229.5" y="301.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Synthetic or defined chemical</text><text x="267.1" y="368.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Microbial or algal biomass and oil</text><text x="218.8" y="390.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Dairy or animal fraction</text><text x="244.3" y="441.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Fibre or polysaccharide</text><text x="296.6" y="457.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Botanical extract</text><text x="291.2" y="497.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Lipid or oil fraction</text><text x="310.0" y="515.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Novel sugar or oligosaccharide</text><text x="389.1" y="544.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Probiotic, culture or phage</text><text x="311.3" y="566.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Enzyme preparation</text><text x="280.5" y="597.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Recombinant protein</text><text x="751.7" y="626.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="end" font-weight="normal">Other</text><text x="860.0" y="256.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">filed by a company that</text><text x="860.0" y="271.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">appears once, and never again</text><rect x="860.0" y="282.0" width="24.0" height="14.0" fill="#cfe0f2" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="886.0" y="282.0" width="24.0" height="14.0" fill="#93b9e0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="912.0" y="282.0" width="24.0" height="14.0" fill="#5a90cc" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="938.0" y="282.0" width="24.0" height="14.0" fill="#2f6cb0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="964.0" y="282.0" width="24.0" height="14.0" fill="#1a4b85" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="860.0" y="312.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">25%</text><text x="988.0" y="312.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">60%</text><text x="860.0" y="338.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Suggestive only: r = +0.48</text><text x="860.0" y="353.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">across eleven categories.</text><line x1="40.0" y1="686.0" x2="1090.0" y2="686.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="712.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">The more filings a kind of ingredient has behind it, the less often any one of them is dropped — r = -0.65.</text><text x="40.0" y="733.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Synthetic or defined chemical sits worst at 38%, 3.3× the overall rate.</text><text x="40.0" y="757.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">These are overwhelmingly novel ingredients from B2B suppliers and start-ups — precision fermentation, algal oils, enzymes, oligosaccharides — not established additives in</text><text x="40.0" y="774.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">consumer products. Which is what you would expect if the binding constraint is a small company's ability to fund a dossier, rather than the ingredient being unsafe.</text><text x="40.0" y="798.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">“Other” is not a leftover — it is the largest group (454) and it is the conventional additives: sodium bisulfate, transglutaminase, pectin esterase, tasteless smoke. Established</text><text x="40.0" y="815.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">chemistry with a known dossier, which is why it sits at the bottom. Read it as the baseline the novel categories are being compared against, not as a leftover.</text><text x="40.0" y="839.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Each notice is filed under the FIRST category rule its substance name matches; 14% match more than one, usually because the name describes an enzyme by its source organism.</text><text x="40.0" y="856.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">That moves the category SIZES a lot — recombinant protein runs 85 or 18 depending on rule order — but not the slope: across 200 random rule orders r stays between -0.68 and -0.53.</text><text x="40.0" y="880.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Categories are inferred from the substance name and are ours, not FDA's. Kinds under 12 filings are omitted. Source: gras-notices-2026-09-11.csv.</text></svg>