<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="812" viewBox="0 0 1240 812" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect width="1240" height="812" fill="#fcfcfb"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">Inside the competed label, the procedure actually run decides the bid count</text>
<text x="28.0" y="60.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The 402,070 competed-labelled FY2016 awards, split by solicitation_procedures. Width is awards; height is the share that drew a single bid.</text>
<text x="28.0" y="86.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">FOR</text>
