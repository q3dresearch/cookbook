<text x="28.0" y="618.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">and that is where figure 5's headline comes from</text>
<text x="28.0" y="638.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Of the 206,656 awards carrying the strongest label, FULL AND OPEN COMPETITION, 75% are orders placed against a vehicle that was competed once, earlier, by someone else, and 17% carry in</text>
<text x="28.0" y="652.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the same row a recorded reason why only one source could be solicited -- 98% of those drew one bid. The label is inherited from the vehicle rather than earned by the order.</text>
<line x1="28" y1="732.0" x2="1212" y2="732.0" stroke="#e3e2db"/>
<text x="28.0" y="750.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">USAspending API v2 bulk download, fetched 2026-09-22; FY2016, eleven civilian departments. The 402,070 awards carrying a competed label and a usable bid count, where a recorded 0 offers</text>
<text x="28.0" y="764.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">is not a count. CAVEAT: an order under a competed vehicle was competed once, at the vehicle, so this is not a claim that the label is false. Defense (68.6% of federal contract awards) is</text>
<text x="28.0" y="778.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">absent.</text>
