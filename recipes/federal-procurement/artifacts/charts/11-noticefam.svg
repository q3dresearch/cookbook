<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="858" viewBox="0 0 1080 858" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect width="1080" height="858" fill="#fcfcfb"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">One column is consistently negative; the other is two large effects cancelling</text>
<text x="28.0" y="60.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The same 26 product families behind figure 10's two pooled marks, each family's own difference in single-bid rate with award size held fixed.</text>
<text x="28.0" y="86.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">FOR</text>
<text x="28.0" y="101.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">anyone reading a pooled near-zero as evidence that a</text>
<text x="28.0" y="114.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">column does not matter</text>
<text x="369.3" y="86.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">DECIDE</text>
<text x="369.3" y="101.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">whether to act on a column everywhere, or only where</text>
<text x="369.3" y="114.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">its sign is the one you want</text>
<text x="710.7" y="86.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">WRONG IF</text>
<text x="710.7" y="101.0" font-size="11.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the two shapes match, or either one is symmetric about</text>
<text x="710.7" y="114.5" font-size="11.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">zero</text>
<line x1="28" y1="124.0" x2="1052" y2="124.0" stroke="#e3e2db"/>
<text x="28.0" y="160.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">each family's own effect, as a distribution</text>
<text x="28.0" y="177.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">one mark per family; the outline is a kernel density over them and is a shape, not a probability</text>
