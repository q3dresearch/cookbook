<text x="28.0" y="758.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">USAspending API v2 bulk download, fetched 2026-09-22; FY2016, 554,171 awards. Dollars are federal_action_obligation per award with de-obligations kept. CAVEAT: business size is the</text>
