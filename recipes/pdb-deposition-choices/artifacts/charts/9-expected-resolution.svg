<text x="66.0" y="415.0" font-size="9" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">5</text>
<line x1="74.0" y1="471.0" x2="688.0" y2="471.0" stroke="#f0efe9"/>
<text x="66.0" y="474.0" font-size="9" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">6</text>
<line x1="74.0" y1="530.0" x2="688.0" y2="530.0" stroke="#f0efe9"/>
<text x="66.0" y="533.0" font-size="9" fill="#8a8880" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">7</text>
<text x="28.0" y="150.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">resolution, ångström — the whole point is that lower is better</text>
<text x="66.0" y="167.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="8.5" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">better</text>
<text x="66.0" y="167.0" fill="#8a8880" font-size="8.5" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">better</text>
<text x="66.0" y="545.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="8.5" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">worse</text>
<text x="66.0" y="545.0" fill="#8a8880" font-size="8.5" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">worse</text>
