<text x="263.7" y="447.4" fill="#8a8880" font-size="9.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">shaded band is the 10th to 90th percentile</text>
<line x1="102.1" y1="220.2" x2="102.1" y2="308.8" stroke="#52514e" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="110.1" y="267.5" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">1.50 Å apart</text>
<text x="110.1" y="267.5" fill="#52514e" font-size="9.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">1.50 Å apart</text>
<line x1="654.9" y1="294.0" x2="654.9" y2="308.8" stroke="#52514e" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="662.9" y="304.4" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">0.25 Å apart</text>
<text x="662.9" y="304.4" fill="#52514e" font-size="9.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">0.25 Å apart</text>
<text x="790.0" y="150.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">the trap in the top band</text>
<text x="790.0" y="180.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Above 1000 kDa X-ray's median reads better than</text>
<text x="790.0" y="195.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">cryo-EM's — 3.00 Å against 3.25. Read straight, that</text>
<text x="790.0" y="210.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">says crystallise your megadalton complex.</text>
<text x="790.0" y="242.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">X-ray</text>
<text x="852.0" y="242.0" font-size="10.5" fill="#4a7fa8" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">3.00 Å median</text>
<rect x="790.0" y="249.0" width="25.9" height="13" fill="#4a7fa8" fill-opacity="0.55"/>
<text x="822.9" y="259.5" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">701 structures, 3.0% of the band</text>
<text x="822.9" y="259.5" fill="#4a7fa8" font-size="9.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">701 structures, 3.0% of the band</text>
<text x="790.0" y="286.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">cryo-EM</text>
<text x="852.0" y="286.0" font-size="10.5" fill="#8c2318" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">3.25 Å median</text>
<rect x="790.0" y="293.0" width="186.0" height="13" fill="#8c2318" fill-opacity="0.55"/>
<text x="983.0" y="303.5" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">5,040 structures, 97.0% of the band</text>
<text x="983.0" y="303.5" fill="#8c2318" font-size="9.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">5,040 structures, 97.0% of the band</text>
<text x="790.0" y="336.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Those 701 are not what crystallography does with a</text>
<text x="790.0" y="351.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">megadalton complex. They are the ones that</text>
<text x="790.0" y="366.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">crystallised. Nothing that failed is anywhere in the</text>
<text x="790.0" y="381.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">register, so the X-ray column is a survivors'</text>
<text x="790.0" y="396.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">average, and it reads better the harsher the filter</text>
<text x="790.0" y="411.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">behind it.</text>
<rect x="780.0" y="412.0" width="386.0" height="86" fill="#1b7f5a" fill-opacity="0.07"/>
<text x="790.0" y="428.0" font-size="11" fill="#1b7f5a" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">so where is the median an expectation?</text>
<text x="790.0" y="446.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Below about 100 kDa, yes: nearly everything of that</text>
<text x="790.0" y="460.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">size goes the X-ray route, so the sample is barely</text>
<text x="790.0" y="474.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">filtered. Above a few hundred, no — it is the score of</text>
<text x="790.0" y="488.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the winners, and cryo-EM's flat 3.25 Å is the more</text>
<text x="790.0" y="502.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">honest planning number.</text>
<line x1="28" y1="600.0" x2="1172" y2="600.0" stroke="#e3e2db"/>
<text x="28.0" y="620.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">RCSB PDB search API, fetched 2026-09-22; rcsb_entry_info.resolution_combined against molecular_weight, 244,416 structures carrying both. Resolution is</text>
<text x="28.0" y="634.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">histogrammed at 0.25 Å, so every median here is quantised to the bin and adjacent bands differ by one or two bins. Solution NMR is absent because it</text>
<text x="28.0" y="648.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">has no resolution: 4 of its 14,732 entries carry the field at all, which is an annotation artefact rather than a measurement. Points sit at each</text>
<text x="28.0" y="662.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">band's geometric midpoint, with the two open ends placed at 25 and 2000 by hand.</text>
</svg>