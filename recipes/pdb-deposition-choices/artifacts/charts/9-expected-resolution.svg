<text x="364.5" y="548.0" font-size="9" fill="#8a8880" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">200</text>
<line x1="480.0" y1="530.0" x2="480.0" y2="535.0" stroke="#8a8880"/>
<text x="480.0" y="548.0" font-size="9" fill="#8a8880" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">500</text>
