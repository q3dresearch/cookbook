<text x="28.0" y="598.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The 2007 peak is structural genomics — consortia depositing at volume</text>
<text x="28.0" y="611.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">against a target list rather than a paper. The rise after 2023 is</text>
<text x="28.0" y="625.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">right-censoring, and is dashed so the obvious reading, that publishing is</text>
<text x="28.0" y="638.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">collapsing, is not available.</text>
<text x="590.0" y="212.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">and waiting does not clear it</text>
<text x="590.0" y="228.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the same share, against how long the cohort has had</text>
