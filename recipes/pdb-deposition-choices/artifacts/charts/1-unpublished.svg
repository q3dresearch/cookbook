<text x="655.0" y="272.0" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">deposited 2004–2011, the structural genomics years</text>
<circle cx="646.0" cy="282.5" r="3.6" fill="#9aa4ad" fill-opacity="0.85"/>
<text x="655.0" y="286.0" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">every other cohort</text>
<text x="590.0" y="598.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">If the citation were corrected when the paper appeared this would slope down</text>
<text x="590.0" y="611.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">to the right and the oldest cohorts would be clean. It does not: a</text>
<text x="590.0" y="625.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">28-year-old cohort sits near 2% and a 19-year-old one near 26%. The driver</text>
<text x="590.0" y="638.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">is which era the work was done in, not how long it has had — the field</text>
<text x="590.0" y="652.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">records the state at deposition and nobody revisits it.</text>
<line x1="28" y1="782.0" x2="1172" y2="782.0" stroke="#e3e2db"/>
<text x="28.0" y="802.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">RCSB PDB search API, faceted server-side, fetched 2026-09-22: 260,089 experimentally determined entries of which 41,156 cite “To be published”.</text>
<text x="28.0" y="816.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Deposition date, not release date — they differ by up to 2,203 entries in a year and release date measures the embargo as much as the science. The</text>
<text x="28.0" y="830.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">register grows weekly, so this is one fetch, snapshotted beside the cache. Years before 1992 and cohorts under 200 depositions are dropped as too</text>
<text x="28.0" y="844.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">small to carry a share.</text>
