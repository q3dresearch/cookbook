<text x="678.0" y="476.1" fill="#8c2318" font-size="9.5" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">in 2005–2011 it never crosses:</text>
<text x="678.0" y="487.1" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9.5" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">X-ray held 79.5% even above 1000 kDa</text>
<text x="678.0" y="487.1" fill="#8c2318" font-size="9.5" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">X-ray held 79.5% even above 1000 kDa</text>
<text x="28.0" y="636.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">the boundary moved 11-fold; the bottom end did not move at all</text>
<text x="28.0" y="658.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">A 150 kDa complex was a crystallography target in 2015 and is a cryo-EM target now, with nothing</text>
<text x="28.0" y="673.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">about the molecule having changed. Below 50 kDa nothing moved: X-ray is at 90.9% and cryo-EM at</text>
<text x="28.0" y="688.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">4.0%, about where they were twenty years ago, and NMR's surviving 5.0% is entirely in that band.</text>
<text x="28.0" y="703.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The boundary swept down through the middle and stopped.</text>
<text x="728.0" y="660.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="10.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">read it as: above this weight,</text>
<text x="728.0" y="660.0" fill="#1b7f5a" font-size="10.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">read it as: above this weight,</text>
<text x="728.0" y="675.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="10.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">the field now reaches for cryo-EM</text>
<text x="728.0" y="675.0" fill="#1b7f5a" font-size="10.5" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">the field now reaches for cryo-EM</text>
<text x="728.0" y="694.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="12" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">1530 kDa, then 315, then 133</text>
<text x="728.0" y="694.0" fill="#1b7f5a" font-size="12" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums">1530 kDa, then 315, then 133</text>
<text x="728.0" y="710.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="9.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">across 2012–16, 2017–21, 2022–26</text>
<text x="728.0" y="710.0" fill="#8a8880" font-size="9.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">across 2012–16, 2017–21, 2022–26</text>
<line x1="28" y1="743.0" x2="1172" y2="743.0" stroke="#e3e2db"/>
<text x="28.0" y="763.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">RCSB PDB search API, fetched 2026-09-22; deposition date and rcsb_entry_info.molecular_weight, 228,197 structures. Each point sits at its band's</text>
<text x="28.0" y="777.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">geometric midpoint, with 0–50 placed at 25 and the 1000-and-up band at 2000 by hand; the crossings are interpolated between those positions, so they</text>
<text x="28.0" y="791.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">are accurate to the band and not to the kilodalton. The PDB holds solved structures only: a target that resisted every method is not in it, so these</text>
<text x="28.0" y="805.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">are shares of the attempts that worked, never success rates. The boundary's movement is not a trend to extend — see figure 7 on what extrapolating a</text>
<text x="28.0" y="819.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">clean curve in this register cost.</text>
