<text x="590.0" y="608.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Residuals average -1.5% over 2018–2020 and -0.5% over 2022–2025. The shaded</text>
<text x="590.0" y="621.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">band is the range the series already wandered in before AlphaFold existed,</text>
<text x="590.0" y="635.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">±10%. An effect smaller than that is invisible here: this rules out a</text>
<text x="590.0" y="648.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">collapse, not a dent.</text>
<line x1="28" y1="782.0" x2="1172" y2="782.0" stroke="#e3e2db"/>
<text x="28.0" y="802.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">RCSB PDB search API, fetched 2026-09-22, deposition date. The fit is log-linear on 2005–2020 and every point after is out of sample. A second event</text>
<text x="28.0" y="816.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">lands in the same window: SARS-CoV-2 targets are 7.6% of 2020 depositions, 8.3% of 2022 and 5.1% of 2024, so a pandemic added to exactly the years</text>
<text x="28.0" y="830.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">prediction was supposed to subtract from — two mechanisms pointing opposite ways, which is why the raw before-and-after comparison is worthless and</text>
<text x="28.0" y="844.0" font-size="11" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">the detrended one is reported with a detectable-effect size instead of a p-value.</text>
