<text x="28.0" y="608.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The fit is on 2005–2020 only and extended past it as a dashed line.</text>
<text x="28.0" y="621.5" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Deposition keeps to it: 2024 is the busiest year the register has ever had,</text>
<text x="28.0" y="635.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">three years after the release that was supposed to end the need.</text>
<text x="590.0" y="212.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">and the residuals do not move</text>
