<text x="92" y="64" font-size="13.5" fill="#52514e">A dataset nobody downloaded cannot have a notebook somebody wrote. Yet nearly all of them carried one until 2020 &#8212;</text>
<text x="92" y="82" font-size="13.5" fill="#52514e">so &#8220;never opened in a notebook&#8221; measures a platform feature before 2021, not interest. Any trend crossing that line is broken.</text>
