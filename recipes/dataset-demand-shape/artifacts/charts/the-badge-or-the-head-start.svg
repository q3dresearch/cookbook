<text x="92" y="40" font-size="19" font-weight="600" fill="#0b0b0b">The organisation advantage is mostly six years of head start</text>
<text x="92" y="64" font-size="13.5" fill="#52514e">Organisations median 158 lifetime downloads against 8 for individuals &#8212; twentyfold. But they published in 2018 and</text>
<text x="92" y="82" font-size="13.5" fill="#52514e">individuals in 2024. Compared within the same year, the gap is a fraction of that.</text>
