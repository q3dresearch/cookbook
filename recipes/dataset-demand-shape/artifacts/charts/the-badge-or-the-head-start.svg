<text x="92" y="456" font-size="12.5" fill="#0b0b0b">Matched on publication year and size band across 18 strata, the advantage falls from <tspan font-weight="600">20x to 2.8x</tspan>.</text>
<text x="92" y="476" font-size="12.5" fill="#52514e">That residual is real and unexplained &#8212; matching removes year and size, not promotion, audience or subject.</text>
<text x="92" y="570" font-size="11.5" fill="#898781">Source: Kaggle Meta Kaggle, Datasets.csv, retrieved 2026-09-09. Years with at least 20 organisation datasets.</text>
