<text x="70" y="592" font-size="13" font-weight="600" fill="#0b0b0b">The organisation &#8220;advantage&#8221; is mostly a head start</text>
<text x="70" y="616" font-size="12.5" fill="#52514e">organisations median 158 downloads, individuals 8 &#8212; a twentyfold gap.</text>
<text x="70" y="636" font-size="12.5" fill="#52514e">But median publication year is 2018 for organisations and 2024 for individuals. Matched on year and size band,</text>
<text x="70" y="656" font-size="12.5" fill="#0b0b0b">the advantage falls to <tspan font-weight="600">2.8x</tspan>. Most of the headline gap is six extra years of accumulation, not the badge.</text>
