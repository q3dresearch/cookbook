<text x="78.0" y="146.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">papers on the daily feed, per month</text>
<text x="78.0" y="164.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">17,534 in total, across 40 months</text>
<text x="107.7" y="208.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="600" style="">RECOVERED BY BACKFILL</text>
<text x="107.7" y="223.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">membership only — the feed serves today's upvotes,</text>
<text x="107.7" y="236.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">so trajectories are gone the moment a paper rolls off</text>
<text x="107.7" y="264.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#1b4f8a" text-anchor="start" font-weight="600" style="">HELD BY WEEKLY CAPTURE</text>
<text x="107.7" y="279.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">the shaded band — 1 of 40 months, and the only window</text>
<text x="107.7" y="292.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">where anything beyond membership survives</text>
<line x1="107.7" y1="268.0" x2="854.0" y2="268.0" stroke="#1b4f8a" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5"/>
<line x1="858.0" y1="190" x2="858.0" y2="470.0" stroke="#0b0b0b" stroke-width="1.4" stroke-dasharray="5 3"/>
<line x1="28" y1="547.0" x2="912.0" y2="547.0" stroke="#ebeae3" stroke-width="1"/>
<text x="28.0" y="567.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">17,534 papers recovered from 865 days of ?date=YYYY-MM-DD. The registry's 'destroys_own_history' is right about trajectories and wrong about membership.</text>
<text x="28.0" y="582.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Believing it covered both is what made this recipe look like it needed until 2029.</text>
<text x="28.0" y="597.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">What a backfill cannot return is a count as it STOOD: the feed serves today's upvotes. That is why Q14 needs forward capture and cannot be fixed by fetching harder.</text>
<text x="28.0" y="612.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Enrichment archives itself — arXiv keeps its LaTeX, OpenAlex its references, GitHub its repo dates. A number a provider overwrites in place does not.</text>
</svg>