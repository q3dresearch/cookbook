<svg xmlns="http://www.w3.org/2000/svg" width="940" height="630" viewBox="0 0 940 630"><rect width="940" height="630" fill="#fcfcfb"/>
<text x="28.0" y="42.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Membership was recoverable; the trajectories were not</text>
<text x="28.0" y="66.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">Papers per month across the whole daily-papers feed, with the part that weekly capture has actually held marked.</text>
