<text x="28.0" y="418.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Two papers in three and a half years clear the bar the word 'adoption' implies. A rule trained on that label has two positive examples.</text>
<text x="28.0" y="433.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The feed chain loses 99.2% at step one — curated and implemented are different populations. The model-tag chain loses three quarters to redistribution.</text>
<text x="28.0" y="448.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Not a lag that patience fixes: the independent-adoption rate is 0.00% in every quarter of the feed's existence.</text>
<text x="28.0" y="463.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The 19 papers chain B keeps and chain A cannot are older than the feed itself — ViT, BERT, ResNet and CLIP all predate 2023-05-04.</text>
<text x="28.0" y="478.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Top-1,000-by-download listing only, so adoption by models nobody downloads is invisible here.</text>
