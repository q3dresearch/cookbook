<text x="28.0" y="477.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Mean over the two COMPLETE years is 1.18x, not the 1.8x that pooling gives. In 2024 the sign reverses — deadline weeks are quieter than the rest of the year.</text>
<text x="28.0" y="492.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Uptake reverses too: median stars in deadline weeks run 1.69x in 2024 and 0.75x in 2025. On both complete years the upvote difference is a null at p = 0.32.</text>
<text x="28.0" y="507.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Pooling produced the original 1.8x because the feed grew from ~110 papers a month to over 900, so recent years dominate, and two of four years are partial.</text>
<text x="28.0" y="522.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The usable prescription is not 'volume follows the calendar' but 'the seasonal profile is unstable' — a deadline adjustment fitted on one year is wrong in the next.</text>
</svg>