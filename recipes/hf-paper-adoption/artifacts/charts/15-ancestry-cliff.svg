<text x="28.0" y="548.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The real cause is a date cliff: 0 of 77 papers from 2024, 0 of 52 from 2025, 0 of 39 from 2026 are walkable. Same record type on both sides of it.</text>
<text x="28.0" y="563.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">So every ancestry result is about a closed era: the walk sees infrastructure no model card cites, and only the infrastructure of pre-2022 work.</text>
<text x="28.0" y="578.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Whatever the 2024-2026 generation rests on, this instrument cannot say. Unblocking it needs a citation source with preprint coverage.</text>
