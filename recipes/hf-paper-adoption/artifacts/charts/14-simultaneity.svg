<text x="28.0" y="626.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">One dot is one paper. In 9 of 9 terms every paper comes from a different author group — no group publishes twice in the quarter a term appears.</text>
<text x="28.0" y="641.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">ORANGE is a vendor shipping and everyone evaluating it — weeks of work, not held research. BLUE is a technique, the case that would support hoarding.</text>
<text x="28.0" y="656.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">And the blue cases diffuse slowly. GRPO's originating paper is 2024-02; the keyword does not cross 0.3% until 2025Q1, about a year later.</text>
<text x="28.0" y="671.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Every test here sits inside the published set. Work never shipped and never written up is invisible by construction,</text>
<text x="28.0" y="686.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">so the strong 'tip of the iceberg' claim is not falsifiable with this data, and is not claimed either way.</text>
</svg>