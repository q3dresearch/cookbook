<text x="427.5" y="246.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#E69F00" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">vision  1% model-first</text>
