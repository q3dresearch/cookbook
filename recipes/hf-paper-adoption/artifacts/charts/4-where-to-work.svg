<line x1="28" y1="418.0" x2="832.0" y2="418.0" stroke="#ebeae3" stroke-width="1"/>
<text x="28.0" y="438.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">time-series pays 18x what image-gen does per paper — down from 62x when models were counted instead of publishers.</text>
<text x="28.0" y="453.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Up and left is the cheap seat. A BIG dot means much of that field's adoption runs backwards, so paper-watching works least there.</text>
<text x="28.0" y="468.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Dot size used to be the median wait — a statistic that mixes paper-first and model-first pairs and faked a 2.5x field speed difference.</text>
<text x="28.0" y="483.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The real wait is 20-25 months in every field. See 10-shipfirst.</text>
<text x="28.0" y="498.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Agents and RL cannot be drawn: no pipeline_tag exists for them, so they land under LLM-core.</text>
