<text x="28.0" y="516.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Across all 56 keywords that reach 1% and peak away from both edges: median climb 2 quarters, median fall to half the peak 1.</text>
<text x="28.0" y="531.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">GREY = unreadable. A single-word term whose half-life lands in the quarter holding the 2025-12-25 extractor break, where its fall and the instrument's are one event.</text>
<text x="28.0" y="546.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Dots mark each peak, the dashed line half of it. Orange ends below half; blue has not fallen there yet, so its window is open and its length unknown.</text>
<text x="28.0" y="561.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Terms peaking in the first or last two quarters are excluded, not clipped — a curve cut off at the frame edge reads as a plateau.</text>
<text x="28.0" y="576.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">A fall does NOT separate 'superseded' from 'so standard nobody names it'. The test that would — does the artifact side keep growing? — cannot run:</text>
<text x="28.0" y="591.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">the top-1,000-by-download listing holds zero Mamba, Gaussian-splatting and NeRF models, so absence there is its composition and not evidence.</text>
<text x="28.0" y="606.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">2026Q3 is excluded because the extractor changed again — see 11-instrument.</text>
