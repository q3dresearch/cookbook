<text x="28.0" y="706.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Bars span the 10th to 90th percentile, dots are medians — both distributions are heavily skewed, so means would be meaningless.</text>
<text x="28.0" y="721.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The UPVOTE panel is usable: an upvote is cast before any model exists, so the ordering runs the right way. 7-budget turns it into a rule.</text>
<text x="28.0" y="736.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The STAR panel is not. Stars are counted after adoption, and for most of these the repository IS the model release.</text>
<text x="28.0" y="751.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Neither shows attention CAUSING adoption — both are downstream of the same thing: a lab that ships a downloaded model also writes an upvoted paper.</text>
<text x="28.0" y="766.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Log axis, so papers with zero stars are excluded here; the README quotes the median over all papers with a repo, which is 2,975 against 52.</text>
</svg>