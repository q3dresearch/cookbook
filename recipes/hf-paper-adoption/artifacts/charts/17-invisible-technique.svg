<text x="475.6" y="510.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">3</text>
