<svg xmlns="http://www.w3.org/2000/svg" width="940" height="658" viewBox="0 0 940 658"><rect width="940" height="658" fill="#fcfcfb"/>
<text x="28.0" y="42.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">A technique can be universal and still register once</text>
<text x="28.0" y="66.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">Papers cited by a top-1,000 model, by how many independent organisations name them.</text>
