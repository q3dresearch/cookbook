<text x="366.0" y="534.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" style="">independent organisations naming the paper</text>
<text x="366.0" y="550.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal" style="">categorical — only these counts occur, so the gap between 3 and 10 is not a distance</text>
<text x="82.0" y="146.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">papers, of the 430 that any top-1,000 model cites</text>
<text x="82.0" y="164.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#b03a2e" text-anchor="start" font-weight="normal" style="">409 of 430 — 95% — are named by one organisation or none: the lab citing itself</text>
<text x="662.0" y="200.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">where the famous ones land</text>
<text x="662.0" y="220.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#b03a2e" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">1</text>
<text x="682.0" y="220.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">LoRA</text>
<text x="682.0" y="234.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal" style="">plausibly the most-used</text>
<text x="682.0" y="250.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal" style="">technique in the ecosystem</text>
<text x="662.0" y="274.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#1b4f8a" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">10</text>
<text x="682.0" y="274.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">carbon-emissions boilerplate</text>
<text x="682.0" y="288.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal" style="">a model-card template field,</text>
<text x="682.0" y="304.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal" style="">not an implementation</text>
<text x="662.0" y="328.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#1b4f8a" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">2</text>
<text x="682.0" y="328.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">BERT</text>
<text x="662.0" y="350.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#1b4f8a" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">3</text>
<text x="682.0" y="350.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">ViT</text>
<text x="662.0" y="372.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#1b4f8a" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">3</text>
<text x="682.0" y="372.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">RoBERTa</text>
<text x="662.0" y="394.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#1b4f8a" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">2</text>
<text x="682.0" y="394.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">ResNet</text>
<line x1="28" y1="575.0" x2="912.0" y2="575.0" stroke="#ebeae3" stroke-width="1"/>
<text x="28.0" y="595.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">95% of cited papers reach one organisation or none. An arXiv tag is overwhelmingly a lab citing its own paper.</text>
<text x="28.0" y="610.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">LoRA sits in the '1' bar, indistinguishable from a paper nobody has heard of: its adapters are long-tail so they miss the download head, and a LoRA finetune rarely cites the LoRA paper.</text>
<text x="28.0" y="625.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The carbon-emissions paper sits high not because anyone implemented it but because it is a field in Hugging Face's model-card template.</text>
<text x="28.0" y="640.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">So this measures which papers the uploaders of already-popular models chose to name. A technique can be universal and invisible here.</text>
</svg>