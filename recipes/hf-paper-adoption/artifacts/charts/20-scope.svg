<line x1="28" y1="554.0" x2="912.0" y2="554.0" stroke="#ebeae3" stroke-width="1"/>
<text x="28.0" y="574.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Every discipline together accounts for 5.5% of the feed, and most of those papers are AI applied to the field rather than the field itself.</text>
<text x="28.0" y="589.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">There is no category or discipline field in the payload, so this is a keyword scan — and it OVER-counts: 'diagnos' catches 'Diagnosing Metalinguistic Reasoning'.</text>
<text x="28.0" y="604.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">So this recipe answers how AI research reaches AI artifacts on one platform. It cannot support a sentence about research reaching production in general.</text>
<text x="28.0" y="619.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The mechanism it measures — a model card citing an arXiv id — does not exist outside software.</text>
<text x="28.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Another field needs its own definition of 'shipped': a trial phase advance, a patent citation, a market approval.</text>
</svg>