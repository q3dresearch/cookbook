<text x="28.0" y="784.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Same cohort in both panels: 6,134 papers with 18+ months of exposure, of which 73 are named by a top-1,000 model.</text>
<text x="28.0" y="799.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">TOP — the orange gradient is real and measures the wrong thing: a 25-author paper is a lab's model report, and that lab's own models cite it.</text>
<text x="28.0" y="814.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Scored on independent organisations instead, the grey line never leaves the floor.</text>
<text x="28.0" y="829.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">BOTTOM — leak-free by construction, so nothing from the future enters. Eleven-fold, on 26 papers. Act on the lower bound, not the point estimate.</text>
<text x="28.0" y="844.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Both score 'named by any top-1,000 model', which is mostly self-citation — the ceiling on this whole question, drawn in 8-two-positives.</text>
