<text x="28.0" y="714.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">The rule: a keyword share may be compared across 2025-12-25 only if the keyword is multi-word — and even then the level is inflated between the two breaks.</text>
<text x="28.0" y="729.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">KEEP Q27's reinforcement-learning rise: 2.84% to 10.33% entirely inside the first regime, +1.0pp per quarter over eleven quarters.</text>
<text x="28.0" y="744.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">RETRACT Q29's dead topics: llms, gpt-4 and NeRF are all one word, flat for ten quarters, and collapse in the quarter holding the boundary.</text>
<text x="28.0" y="759.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">HAIRCUT the multi-word risers: vision-language models goes 1.9 -&gt; 2.9 inside the regime, jumps to 4.8 across it, falls back to 2.7 at the next change.</text>
<text x="28.0" y="774.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Boundaries located by GMM on five shape features in 21-day bins, declared model held out of the fit. Both reproduce at 21-, 28- and 35-day bins.</text>
