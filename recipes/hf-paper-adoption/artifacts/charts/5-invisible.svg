<text x="28.0" y="477.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">A model card names the model you started from, not the optimizer, the architecture, or the benchmark you used.</text>
<text x="28.0" y="492.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Every adoption measure built on those cards is therefore blind to exactly the ideas that carry the field.</text>
