<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="774" viewBox="0 0 1040 774"><rect width="1040" height="774" fill="#ffffff"/><rect x="0.0" y="0.0" width="1040.0" height="774.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">The feed programme stopped being about waste and started being about protein</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Every notice to FDA's animal-food GRAS programme, by what the ingredient is for. One notice = one company telling FDA about one</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">feed or pet-food ingredient. Bars are shares of each five-year group; the count is printed because eighteen notices and thirty-eight are not</text><text x="40.0" y="108.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">the same evidence.</text><text x="40.0" y="134.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">This corrects the recipe's own earlier headline. Pooled across all years, efficiency is 34% — which is the average of 72% and 10%.</text><rect x="40.0" y="158.0" width="11.0" height="11.0" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="57.0" y="167.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Efficiency — get more from the same feed</text><rect x="327.0" y="158.0" width="11.0" height="11.0" fill="#2361b0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="344.0" y="167.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">New protein source</text><rect x="479.8" y="158.0" width="11.0" height="11.0" fill="#b9b4a8" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="496.8" y="167.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Everything else</text><rect x="614.3" y="158.0" width="11.0" height="11.0" fill="#c2553e" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="631.3" y="167.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">FDA did not say what it is for</text><line x1="96.0" y1="560.0" x2="760.0" y2="560.0" stroke="#dfe4ea" stroke-width="1"/><text x="86.0" y="564.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0%</text><line x1="96.0" y1="477.5" x2="760.0" y2="477.5" stroke="#dfe4ea" stroke-width="1"/><text x="86.0" y="481.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">25%</text><line x1="96.0" y1="395.0" x2="760.0" y2="395.0" stroke="#dfe4ea" stroke-width="1"/><text x="86.0" y="399.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">50%</text><line x1="96.0" y1="312.5" x2="760.0" y2="312.5" stroke="#dfe4ea" stroke-width="1"/><text x="86.0" y="316.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">75%</text><line x1="96.0" y1="230.0" x2="760.0" y2="230.0" stroke="#dfe4ea" stroke-width="1"/><text x="86.0" y="234.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">100%</text><rect x="122.6" y="321.7" width="112.9" height="238.3" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="179.0" y="444.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">13</text><rect x="122.6" y="230.0" width="112.9" height="91.7" fill="#b9b4a8" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="179.0" y="279.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="179.0" y="582.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2010–14</text><text x="179.0" y="598.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=18</text><rect x="288.6" y="385.3" width="112.9" height="174.7" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="345.0" y="476.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">9</text><rect x="288.6" y="307.6" width="112.9" height="77.6" fill="#2361b0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="345.0" y="350.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><rect x="288.6" y="249.4" width="112.9" height="58.2" fill="#b9b4a8" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="345.0" y="282.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><rect x="288.6" y="230.0" width="112.9" height="19.4" fill="#c2553e" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="345.0" y="582.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2015–19</text><text x="345.0" y="598.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=17</text><rect x="454.6" y="490.5" width="112.9" height="69.5" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="511.0" y="529.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">8</text><rect x="454.6" y="455.8" width="112.9" height="34.7" fill="#2361b0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="511.0" y="477.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><rect x="454.6" y="325.5" width="112.9" height="130.3" fill="#b9b4a8" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="511.0" y="394.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">15</text><rect x="454.6" y="230.0" width="112.9" height="95.5" fill="#c2553e" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="511.0" y="281.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">11</text><text x="511.0" y="582.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2020–24</text><text x="511.0" y="598.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=38</text><rect x="620.6" y="528.6" width="112.9" height="31.4" fill="#2e7d5b" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><rect x="620.6" y="450.0" width="112.9" height="78.6" fill="#2361b0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="677.0" y="493.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><rect x="620.6" y="277.1" width="112.9" height="172.9" fill="#b9b4a8" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="677.0" y="367.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">11</text><rect x="620.6" y="230.0" width="112.9" height="47.1" fill="#c2553e" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="677.0" y="257.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="677.0" y="582.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2025–29</text><text x="677.0" y="598.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=21</text><line x1="40.0" y1="624.0" x2="1000.0" y2="624.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="650.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Efficiency ran 72% of the programme's first five years and 10% of its last. It was never a claim about animal feed — it was a claim about 2010–14.</text><text x="40.0" y="674.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">What replaced it is alternative protein: krill meal, methanotroph and methylotroph single-cell protein, crickets, algal residue, yeast expressing an ovine protein, black</text><text x="40.0" y="691.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">soldier fly larvae. Nine of the thirteen protein notices were filed from 2019 on, and five of the thirteen were withdrawn.</text><text x="40.0" y="715.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">The red band is not a category of ingredient. It is notices whose stated use reads “Utility information not evaluated for GRAS, see FDA's letter” — FDA clearing on safety</text><text x="40.0" y="732.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">while explicitly declining to say whether the thing works. That went from 0% before 2016 to a quarter of recent notices, and it is why the purpose of a notice is now often unreadable.</text><text x="40.0" y="756.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">94 notices, 2010 to date. Purpose categories are ours, read off each notice's stated use. Source: FDA animal food GRAS inventory, agras-notices-2026-09-11.html.</text></svg>