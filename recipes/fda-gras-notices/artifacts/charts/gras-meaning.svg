<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="764" viewBox="0 0 1060 764"><rect width="1060" height="764" fill="#ffffff"/><rect x="0.0" y="0.0" width="1060.0" height="764.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">The same share pull out. Far fewer come back.</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Four-year groups of GRAS filings FDA has closed. Orange: the share the company pulled before FDA finished reading. Blue: the share of</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">those pulled filings that the company later filed again for the same ingredient.</text><text x="40.0" y="108.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Both are percentages but of different bases, so read each line's shape, not the gap between them.</text><text x="40.0" y="134.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Pulling out is as common as it ever was. Coming back is not: that line falls off a cliff after 2007 and never recovers. It is not who files, and it is not censoring.</text><line x1="92.0" y1="574.0" x2="810.0" y2="574.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="578.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0%</text><line x1="92.0" y1="502.0" x2="810.0" y2="502.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="506.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">20%</text><line x1="92.0" y1="430.0" x2="810.0" y2="430.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="434.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">40%</text><line x1="92.0" y1="358.0" x2="810.0" y2="358.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="362.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">60%</text><line x1="92.0" y1="286.0" x2="810.0" y2="286.0" stroke="#dfe4ea" stroke-width="1"/><text x="82.0" y="290.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">80%</text><rect x="720.2" y="214.0" width="89.8" height="360.0" fill="#f2f2f0" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="765.1" y="232.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">too recent</text><text x="765.1" y="247.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">to have come back</text><text x="136.9" y="596.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">1996–99</text><text x="226.6" y="596.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2000–03</text><text x="316.4" y="596.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2004–07</text><text x="406.1" y="596.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2008–11</text><text x="495.9" y="596.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2012–15</text><text x="585.6" y="596.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2016–19</text><text x="675.4" y="596.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2020–23</text><text x="765.1" y="596.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2024–27</text><polyline points="136.9,504.8 226.6,536.3 316.4,514.0 406.1,498.9 495.9,517.5 585.6,507.1 675.4,507.7 765.1,515.3" fill="none" stroke="#eb6834" stroke-width="2.4"/><polyline points="136.9,430.0 226.6,377.6 316.4,334.0 406.1,478.7 495.9,472.8 585.6,444.4 675.4,493.2 765.1,511.9" fill="none" stroke="#2a78d6" stroke-width="2.4"/><circle cx="136.9" cy="504.8" r="6.681691098714047" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="136.9" cy="430.0" r="7.854101966249685" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="136.9" y="415.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=5</text><circle cx="226.6" cy="536.3" r="10.92873438191667" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="226.6" cy="377.6" r="9.4749371855331" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="226.6" y="361.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=11</text><circle cx="316.4" cy="514.0" r="10.30163720891674" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="316.4" cy="334.0" r="10.309475019311126" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="316.4" y="316.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=15</text><circle cx="406.1" cy="498.9" r="13.007894901213058" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="406.1" cy="478.7" r="13.246427842267952" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="406.1" y="458.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=34</text><circle cx="495.9" cy="517.5" r="14.258356907095703" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="495.9" cy="472.8" r="12.985281374238571" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="495.9" y="452.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=32</text><circle cx="585.6" cy="507.1" r="16.0060060601568" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="585.6" cy="444.4" r="15.106601717798213" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="585.6" y="422.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=50</text><circle cx="675.4" cy="507.7" r="15.930342804997576" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="675.4" cy="493.2" r="15.0" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="675.4" y="471.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=49</text><circle cx="765.1" cy="515.3" r="13.481872852904226" fill="#eb6834" stroke="none" stroke-width="1"/><circle cx="765.1" cy="511.9" r="12.577747210701755" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="765.1" y="492.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">n=29</text><circle cx="100.0" cy="184.0" r="6" fill="#eb6834" stroke="none" stroke-width="1"/><text x="112.0" y="188.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">pulled by the company · share of everything closed</text><circle cx="432.0" cy="184.0" r="6" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="444.0" y="188.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">filed again later · share of those pulled (area = how many)</text><line x1="40.0" y1="622.0" x2="1020.0" y2="622.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="648.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Before 2010, 51% of pulled filings were filed again. From 2010 to 2022, 29%. Two-proportion z = 2.78, so this is not noise.</text><text x="40.0" y="670.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">It is not composition. One-time filers were 35% of pulled filings before 2008 and 38% after. And the drop holds inside each type: repeat filers 75% to 39%, one-time</text><text x="40.0" y="687.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">filers 27% to 15%. Both roughly halved. Those pre-2008 strata are thin — 20 and 11 notices — so read them as consistent with the whole, not as separate evidence.</text><text x="40.0" y="711.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Comebacks are fast: median 1 year, 94% within 3. So every cohort through 2022 has had time and only the shaded one is censored.</text><text x="40.0" y="728.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">A comeback is counted only where FDA records a resubmission link. A substance refiled by another route, or marketed without any notice at all, is invisible here.</text><text x="40.0" y="745.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Source: FDA GRAS Notice Inventory, gras-notices-2026-09-11.csv.</text></svg>