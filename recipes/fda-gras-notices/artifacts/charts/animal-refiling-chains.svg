314.0" y="832.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="end" font-weight="normal">Serine Endopeptidase</text><text x="904.0" y="832.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">AB Enzymes GmbH</text><line x1="40.0" y1="878.0" x2="1080.0" y2="878.0" stroke="#dfe4ea" stroke-width="1"/><text x="40.0" y="904.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">18 substances, 41 of the 94 notices. 10 of the 32 pulled notices have a later filing — 31%, against human food's 31%.</text><text x="40.0" y="928.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Some chains are long. Methylococcus capsulatus was pulled, then cleared, then pulled again across five years and one company. Alpha-lipoic acid was refused in 2011 and cleared in 2022,</text><text x="40.0" y="945.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">eleven years later. Serine endopeptidase was pulled in 2024 and pulled again in 2025. A solid line is one company; a dashed line means two different firms filed the same substance.</text><text x="40.0" y="969.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Matching is on a normalised substance name, so a refiling under a renamed substance is missed and the 31% is a floor. Source: FDA animal food GRAS inventory, agras-notices-2026-09-11.html.</text></svg>