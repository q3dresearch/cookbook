<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1070" viewBox="0 0 1120 1070"><rect width="1120" height="1070" fill="#ffffff"/><rect x="0.0" y="0.0" width="1120.0" height="1070.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Companies do come back — FDA just does not say so here</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Every substance filed to the animal-food programme more than once. The human-food inventory links a notice to its successor with a</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">`Resubmitted` field; the animal table has no such column, so these chains were recovered by matching normalised substance names.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">31% of pulled notices come back and 8 of those 10 eventually clear — the same comeback rate as human food. The first attempt is what differs, not the persistence.</text><circle cx="46.0" cy="145.0" r="6" fill="#2e7d5b" stroke="none" stroke-width="1"/><text x="57.0" y="149.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">cleared</text><circle cx="133.8" cy="145.0" r="6" fill="#c2553e" stroke="none" stroke-width="1"/><text x="144.8" y="149.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">pulled</text><circle cx="215.2" cy="145.0" r="6" fill="#7a2f22" stroke="none" stroke-width="1"/><text x="226.2" y="149.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">refused</text><circle cx="303.0" cy="145.0" r="6" fill="#b9b4a8" stroke="none" stroke-width="1"/><text x="314.0" y="149.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">pending</text><line x1="343.2" y1="234.0" x2="343.2" y2="848.0" stroke="#dfe4ea" stroke-width="1"/><text x="343.2" y="226.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2010</text><line x1="409.1" y1="234.0" x2="409.1" y2="848.0" stroke="#dfe4ea" stroke-width="1"/><text x="409.1" y="226.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2012</text><line x1="474.9" y1="234.0" x2="474.9" y2="848.0" stroke="#dfe4ea" stroke-width="1"/><text x="474.9" y="226.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2014</text><line x1="540.8" y1="234.0" x2="540.8" y2="848.0" stroke="#dfe4ea" stroke-width="1"/><text x="540.8" y="226.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2016</text><line x1="606.7" y1="234.0" x2="606.7" y2="848.0" stroke="#dfe4ea" stroke-width="1"/><text x="606.7" y="226.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,