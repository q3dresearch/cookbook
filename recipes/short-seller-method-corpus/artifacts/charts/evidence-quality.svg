<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 740" width="940" height="740"><rect width="940.0" height="740.0" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Harder-to-get evidence, bigger fall — in small caps only</text><text x="24.0" y="58.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">Each mark is one report's move against the market the day after publication, split by whether it rests on evidence an</text><text x="24.0" y="75.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">outsider could not obtain: a site visit, an interview, a terminal, a whistleblower.</text><text x="24.0" y="114.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Under $2B the gap is 21 points. Over $2B there is none — a big company absorbs the report whatever is in it.</text><text x="24.0" y="134.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">On 8 against 11 reports, p = 0.022. A lead worth chasing, not a result.</text><line x1="280.3" y1="244.0" x2="280.3" y2="600.0" stroke="#e1e0d9" stroke-width="1"/><text x="280.3" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">-50%</text><line x1="340.8" y1="244.0" x2="340.8" y2="600.0" stroke="#e1e0d9" stroke-width="1"/><text x="340.8" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">-40%</text><line x1="401.3" y1="244.0" x2="401.3" y2="600.0" stroke="#e1e0d9" stroke-width="1"/><text x="401.3" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">-30%</text><line x1="461.9" y1="244.0" x2="461.9" y2="600.0" stroke="#e1e0d9" stroke-width="1"/><text x="461.9" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">-20%</text><line x1="522.4" y1="244.0" x2="522.4" y2="600.0" stroke="#e1e0d9" stroke-width="1"/><text x="522.4" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">-10%</text><line x1="582.9" y1="244.0" x2="582.9" y2="600.0" stroke="#c3c2b7" stroke-width="1.5"/><text x="582.9" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">+0%</text><line x1="643.5" y1="244.0" x2="643.5" y2="600.0" stroke="#e1e0d9" stroke-width="1"/><text x="643.5" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">+10%</text><line x1="704.0" y1="244.0" x2="704.0" y2="600.0" stroke="#e1e0d9" stroke-width="1"/><text x="704.0" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">+20%</text><text x="250.0" y="642.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">return against the market, day after publication</text><text x="24.0" y="256.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">target under $2B</text><text x="234.0" y="290.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal" style="">public or paid only</text><text x="234.0" y="304.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">8 reports</text><circle cx="543.2" cy="289.5" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="615.5" cy="287.1" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="593.5" cy="294.1" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="644.0" cy="286.0" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="568.6" cy="292.5" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="564.6" cy="290.1" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="576.8" cy="285.8" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="576.0" cy="292.1" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><line x1="576.4" y1="274.0" x2="576.4" y2="310.0" stroke="#b8912a" stroke-width="3"/><text x="576.4" y="270.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#b8912a" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">-1%</text><text x="234.0" y="352.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal" style="">needs access to a person</text><text x="234.0" y="366.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">11 reports</text><circle cx="507.5" cy="347.5" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="321.7" cy="353.1" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="439.9" cy="348.0" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="377.8" cy="348.3" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="452.1" cy="352.9" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="419.0" cy="358.6" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="601.7" cy="348.7" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="534.0" cy="350.1" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="626.4" cy="355.8" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="569.8" cy="360.3" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="438.3" cy="355.1" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><line x1="452.1" y1="336.0" x2="452.1" y2="372.0" stroke="#1b4f8a" stroke-width="3"/><text x="452.1" y="332.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#1b4f8a" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">-22%</text><text x="24.0" y="414.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">target over $2B</text><text x="234.0" y="448.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal" style="">public or paid only</text><text x="234.0" y="462.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">9 reports</text><circle cx="649.2" cy="448.6" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="375.4" cy="456.7" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="562.3" cy="443.7" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="408.6" cy="455.0" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="533.3" cy="447.1" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="566.7" cy="445.0" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="584.6" cy="444.6" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="594.8" cy="447.3" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><circle cx="569.4" cy="454.4" r="5" fill="#b8912a" fill-opacity="0.5" stroke="#b8912a" stroke-width="1.4"/><line x1="566.7" y1="432.0" x2="566.7" y2="468.0" stroke="#b8912a" stroke-width="3"/><text x="566.7" y="428.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#b8912a" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">-3%</text><text x="234.0" y="510.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal" style="">needs access to a person</text><text x="234.0" y="524.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">17 reports</text><circle cx="384.3" cy="507.5" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="572.5" cy="513.1" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="541.6" cy="513.9" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="581.2" cy="510.2" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="550.7" cy="512.7" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="380.6" cy="505.9" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="436.6" cy="505.8" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="555.0" cy="507.9" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="533.1" cy="514.5" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="583.1" cy="511.0" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="590.2" cy="509.4" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="589.9" cy="513.2" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="566.0" cy="511.3" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="588.2" cy="509.2" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="548.8" cy="516.1" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="581.6" cy="514.8" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><circle cx="288.3" cy="508.4" r="5" fill="#1b4f8a" fill-opacity="0.5" stroke="#1b4f8a" stroke-width="1.4"/><line x1="555.0" y1="494.0" x2="555.0" y2="530.0" stroke="#1b4f8a" stroke-width="3"/><text x="555.0" y="490.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#1b4f8a" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">-5%</text><text x="718.0" y="272.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">what counts as</text><text x="718.0" y="286.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">hard to get</text><text x="718.0" y="310.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">a terminal subscription,</text><text x="718.0" y="324.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">an import record, an</text><text x="718.0" y="338.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">expert network, a site</text><text x="718.0" y="352.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">visit, an interview, a</text><text x="718.0" y="366.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">whistleblower</text><text x="718.0" y="418.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">This ranks evidence by</text><text x="718.0" y="432.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">what it COSTS to obtain,</text><text x="718.0" y="446.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">not by whether it is</text><text x="718.0" y="460.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">true. A leak can be</text><text x="718.0" y="474.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">wrong; a filing is</text><text x="718.0" y="488.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">nearly always right and</text><text x="718.0" y="502.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">already in the price.</text><text x="718.0" y="516.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Exclusivity is what</text><text x="718.0" y="530.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">should move a stock.</text><text x="24.0" y="644.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">The tiers come from corpuslib, written to ask whether an independent researcher could reproduce this work — before any price data existed. An axis</text><text x="24.0" y="659.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">invented after seeing returns would prove nothing. Over $2B the same split gives p = 0.63: no effect. Four comparisons were run in total, so a</text><text x="24.0" y="674.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Bonferroni threshold for 0.05 is 0.013 and the small-cap result does not clear it. Reports whose target went bankrupt are missing from the price</text><text x="24.0" y="689.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">source, and they are the ones most likely to have rested on the hardest evidence.</text></svg>