<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660"><rect width="960.0" height="660.0" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">One firm learned to interview people</text><text x="24.0" y="58.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">Share of each firm's first-look reports citing someone it interviewed, by era. Bands are 95% intervals — with eight</text><text x="24.0" y="75.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">to fourteen reports in an era, they are wide on purpose.</text><text x="24.0" y="116.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Hindenburg goes 21% to 75% and its intervals separate. Muddy Waters' highest era is its first, in 2010.</text><text x="24.0" y="136.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">So this is not the practice changing. It is one firm growing into a method the others already had.</text><line x1="88.0" y1="564.0" x2="710.0" y2="564.0" stroke="#e1e0d9" stroke-width="1"/><text x="76.0" y="568.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">0%</text><line x1="88.0" y1="485.5" x2="710.0" y2="485.5" stroke="#e1e0d9" stroke-width="1"/><text x="76.0" y="489.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">25%</text><line x1="88.0" y1="407.0" x2="710.0" y2="407.0" stroke="#e1e0d9" stroke-width="1"/><text x="76.0" y="411.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">50%</text><line x1="88.0" y1="328.5" x2="710.0" y2="328.5" stroke="#e1e0d9" stroke-width="1"/><text x="76.0" y="332.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">75%</text><line x1="88.0" y1="250.0" x2="710.0" y2="250.0" stroke="#e1e0d9" stroke-width="1"/><text x="76.0" y="254.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">100%</text><text x="88.0" y="586.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">2010-13</text><text x="243.5" y="586.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">2014-16</text><text x="399.0" y="586.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">2017-19</text><text x="554.5" y="586.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">2020-22</text><text x="710.0" y="586.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">2023-26</text><line x1="88.0" y1="564.0" x2="710.0" y2="564.0" stroke="#c3c2b7" stroke-width="1.5"/><text x="-407.0" y="26" transform="rotate(-90)" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="middle">reports citing an interview</text><polygon points="399.0,445.5 554.5,274.0 710.0,287.7 710.0,391.0 554.5,347.8 399.0,530.5" fill="#2361b0" fill-opacity="0.12"/><polyline points="399.0,497.4 554.5,300.9 710.0,328.5" fill="none" stroke="#2361b0" stroke-width="2.5"/><circle cx="399.0" cy="497.4" r="5.5" fill="#2361b0" stroke="#fcfcfb" stroke-width="2"/><circle cx="554.5" cy="300.9" r="5.5" fill="#2361b0" stroke="#fcfcfb" stroke-width="2"/><circle cx="710.0" cy="328.5" r="5.5" fill="#2361b0" stroke="#fcfcfb" stroke-width="2"/><polygon points="88.0,293.4 243.5,361.2 399.0,383.0 554.5,286.8 710.0,317.6 710.0,496.4 554.5,421.6 399.0,524.2 243.5,526.1 88.0,441.3" fill="#b8912a" fill-opacity="0.12"/><polyline points="88.0,354.7 243.5,459.3 399.0,467.4 554.5,339.7 710.0,407.0" fill="none" stroke="#b8912a" stroke-width="2.5"/><circle cx="88.0" cy="354.7" r="5.5" fill="#b8912a" stroke="#fcfcfb" stroke-width="2"/><circle cx="243.5" cy="459.3" r="5.5" fill="#b8912a" stroke="#fcfcfb" stroke-width="2"/><circle cx="399.0" cy="467.4" r="5.5" fill="#b8912a" stroke="#fcfcfb" stroke-width="2"/><circle cx="554.5" cy="339.7" r="5.5" fill="#b8912a" stroke="#fcfcfb" stroke-width="2"/><circle cx="710.0" cy="407.0" r="5.5" fill="#b8912a" stroke="#fcfcfb" stroke-width="2"/><polygon points="554.5,310.7 710.0,266.1 710.0,399.8 554.5,463.7" fill="#7a4a1e" fill-opacity="0.12"/><polyline points="554.5,380.8 710.0,307.1" fill="none" stroke="#7a4a1e" stroke-width="2.5"/><circle cx="554.5" cy="380.8" r="5.5" fill="#7a4a1e" stroke="#fcfcfb" stroke-width="2"/><circle cx="710.0" cy="307.1" r="5.5" fill="#7a4a1e" stroke="#fcfcfb" stroke-width="2"/><text x="722.0" y="254.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">does the first era differ</text><text x="722.0" y="270.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">from the last?</text><circle cx="728.0" cy="294.0" r="5.5" fill="#2361b0"/><text x="742.0" y="298.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="600" style="">Hindenburg</text><text x="722.0" y="314.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="">21% to 75% — intervals</text><text x="722.0" y="328.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="">separate, the move is real</text><circle cx="728.0" cy="368.0" r="5.5" fill="#b8912a"/><text x="742.0" y="372.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="600" style="">Muddy Waters</text><text x="722.0" y="388.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">67% to 50% — intervals</text><text x="722.0" y="402.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">overlap, no trend shown</text><circle cx="728.0" cy="442.0" r="5.5" fill="#7a4a1e"/><text x="742.0" y="446.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="600" style="">Night Market</text><text x="722.0" y="462.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">58% to 82% — intervals</text><text x="722.0" y="476.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">overlap, no trend shown</text><text x="24.0" y="612.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">First-look reports only. An interview is detected from phrases like “we spoke with”, “we interviewed” and “told us”, so it counts what a report declares</text><text x="24.0" y="627.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">— a firm that interviews someone and does not say so is invisible here. Era boundaries are fixed in advance, not chosen to fit.</text></svg>