<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640"><rect width="980.0" height="640.0" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" opacity="1.0" style="">The same trade, run as two different businesses</text><text x="24.0" y="58.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" opacity="1.0" style="">Every report from Hindenburg Research (2017-2025) and Muddy Waters (2010-2026), grouped into the first report on a</text><text x="24.0" y="75.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" opacity="1.0" style="">target and everything published about that target afterwards. Bubble area is the number of reports.</text><text x="24.0" y="118.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" opacity="1.0" style="">Muddy Waters publishes 87 follow-ups against 55 first reports — 61% of its output. Hindenburg publishes 9 against 94 — 9%.</text><text x="24.0" y="138.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" opacity="1.0" style="">Follow-ups are short and cite little at both firms, so pooling them in makes a campaigning firm look like an easy corpus.</text><line x1="92.0" y1="503.1" x2="712.0" y2="503.1" stroke="#e1e0d9" stroke-width="1"/><text x="80.0" y="507.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">0</text><line x1="92.0" y1="445.3" x2="712.0" y2="445.3" stroke="#e1e0d9" stroke-width="1"/><text x="80.0" y="449.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">1</text><line x1="92.0" y1="387.5" x2="712.0" y2="387.5" stroke="#e1e0d9" stroke-width="1"/><text x="80.0" y="391.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">2</text><line x1="92.0" y1="329.6" x2="712.0" y2="329.6" stroke="#e1e0d9" stroke-width="1"/><text x="80.0" y="333.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">3</text><line x1="92.0" y1="271.8" x2="712.0" y2="271.8" stroke="#e1e0d9" stroke-width="1"/><text x="80.0" y="275.8" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">4</text><line x1="92.0" y1="214.0" x2="712.0" y2="214.0" stroke="#e1e0d9" stroke-width="1"/><text x="80.0" y="218.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">5</text><line x1="92.0" y1="214.0" x2="92.0" y2="532.0" stroke="#e1e0d9" stroke-width="1"/><text x="92.0" y="552.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">0</text><line x1="216.0" y1="214.0" x2="216.0" y2="532.0" stroke="#e1e0d9" stroke-width="1"/><text x="216.0" y="552.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">2,000</text><line x1="340.0" y1="214.0" x2="340.0" y2="532.0" stroke="#e1e0d9" stroke-width="1"/><text x="340.0" y="552.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">4,000</text><line x1="464.0" y1="214.0" x2="464.0" y2="532.0" stroke="#e1e0d9" stroke-width="1"/><text x="464.0" y="552.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">6,000</text><line x1="588.0" y1="214.0" x2="588.0" y2="532.0" stroke="#e1e0d9" stroke-width="1"/><text x="588.0" y="552.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">8,000</text><line x1="712.0" y1="214.0" x2="712.0" y2="532.0" stroke="#e1e0d9" stroke-width="1"/><text x="712.0" y="552.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">10,000</text><line x1="92.0" y1="532.0" x2="712.0" y2="532.0" stroke="#c3c2b7" stroke-width="1.5"/><line x1="92.0" y1="214.0" x2="92.0" y2="532.0" stroke="#c3c2b7" stroke-width="1.5"/><text x="92.0" y="574.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" opacity="1.0" style="">median words per report</text><text x="-373.0" y="30" transform="rotate(-90)" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="middle">median kinds of evidence cited</text><circle cx="504.2" cy="214.0" r="33.0" fill="#1b4f8a" fill-opacity="0.22" stroke="#1b4f8a" stroke-width="2"/><text x="461.2" y="210.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600" opacity="1.0" style="">Hindenburg</text><text x="461.2" y="226.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="end" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">initial reports — 94</text><circle cx="199.3" cy="503.1" r="10.2" fill="#1b4f8a" fill-opacity="0.22" stroke="#1b4f8a" stroke-width="2"/><text x="179.1" y="499.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600" opacity="1.0" style="">Hindenburg</text><text x="179.1" y="515.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="end" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">follow-ups — 9</text><circle cx="645.1" cy="271.8" r="25.4" fill="#d17b00" fill-opacity="0.22" stroke="#d17b00" stroke-width="2"/><text x="645.1" y="224.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" opacity="1.0" style="">Muddy Waters</text><text x="645.1" y="239.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">initial reports — 56</text><circle cx="284.2" cy="445.3" r="31.9" fill="#d17b00" fill-opacity="0.22" stroke="#d17b00" stroke-width="2"/><text x="326.1" y="441.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" opacity="1.0" style="">Muddy Waters</text><text x="326.1" y="457.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">follow-ups — 88</text><text x="738.0" y="238.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="600" opacity="1.0" style="">bubble area = reports</text><circle cx="772.0" cy="290.2" r="10.2" fill="none" stroke="#898781" stroke-width="1.5"/><text x="816.0" y="294.2" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">9</text><circle cx="772.0" cy="349.6" r="25.2" fill="none" stroke="#898781" stroke-width="1.5"/><text x="816.0" y="353.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">55</text><circle cx="772.0" cy="430.5" r="31.7" fill="none" stroke="#898781" stroke-width="1.5"/><text x="816.0" y="434.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="font-variant-numeric: tabular-nums;">87</text><text x="738.0" y="500.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="">A follow-up is any report on a</text><text x="738.0" y="517.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="">target the firm had already</text><text x="738.0" y="534.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="">covered — from Muddy Waters'</text><text x="738.0" y="551.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="">URL structure, from</text><text x="738.0" y="568.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="">Hindenburg's titles. Under the</text><text x="738.0" y="585.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="">structural rule Hindenburg has</text><text x="738.0" y="602.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="">5, not 9; the gap holds either</text><text x="738.0" y="619.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="">way.</text><text x="24.0" y="594.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" opacity="1.0" style="">Hindenburg initial reports carry a median 5 kinds of evidence in 6,648 words; its follow-ups 0 in 1,730. Muddy Waters: 4 in 8,920 against 1 in 3,100.</text></svg>