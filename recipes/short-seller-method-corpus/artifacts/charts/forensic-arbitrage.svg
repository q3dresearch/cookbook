<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 790" width="940" height="790"><rect width="940.0" height="790.0" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">The reports most likely to be proved right move the stock least</text><text x="24.0" y="58.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">57 short-report targets, split on two things knowable the morning a report drops: the target's size, and whether it</text><text x="24.0" y="75.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">had ALREADY filed a restatement or delisting notice before the report existed. Each cell shows how often it went on to</text><text x="24.0" y="92.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">file another one.</text><text x="24.0" y="131.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">A small target with a flagged filing history went on to file again 9 times out of 9. Fisher p = 0.0001.</text><text x="24.0" y="151.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">That is the cell the market discounts — it falls 0.5% on the day against 2.7% for the clean-history targets beside it.</text><text x="268.0" y="262.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="600" style="">had already filed a restatement or delisting notice</text><text x="393.0" y="280.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600" style="">yes</text><text x="657.0" y="280.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600" style="">no</text><text x="252.0" y="352.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" style="">target under $2B</text><rect x="268.0" y="292.0" width="250.0" height="132.0" fill="#b03a2e"/><text x="286.0" y="344.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="34" fill="#ffffff" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums;">100%</text><text x="286.0" y="366.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">9 of 9 later filed again</text><text x="286.0" y="396.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#ffffff" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">-0.5% on the day</text><rect x="532.0" y="292.0" width="250.0" height="132.0" fill="#ecd9d4"/><text x="550.0" y="344.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="34" fill="#0b0b0b" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums;">19%</text><text x="550.0" y="366.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">3 of 16 later filed again</text><text x="550.0" y="396.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#b8912a" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">-2.7% on the day</text><text x="252.0" y="498.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" style="">target over $2B</text><rect x="268.0" y="438.0" width="250.0" height="132.0" fill="#e0b8af"/><text x="286.0" y="490.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="34" fill="#0b0b0b" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums;">33%</text><text x="286.0" y="512.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">2 of 6 later filed again</text><text x="286.0" y="542.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#b8912a" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">-6.3% on the day</text><rect x="532.0" y="438.0" width="250.0" height="132.0" fill="#f4f1ef"/><text x="550.0" y="490.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="34" fill="#0b0b0b" text-anchor="start" font-weight="700" style="font-variant-numeric: tabular-nums;">8%</text><text x="550.0" y="512.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">2 of 26 later filed again</text><text x="550.0" y="542.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#b8912a" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">-2.4% on the day</text><text x="24.0" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">is it just the same filing repeating?</text><text x="24.0" y="636.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">Six of the nine filed the same kind of document again. Three did not — COCP and LOOP went from a restatement</text><text x="24.0" y="651.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">to a delisting, RIOT from a delisting to a restatement. The distress changes form rather than repeating, which</text><text x="24.0" y="666.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">is not what pure persistence looks like.</text><text x="24.0" y="708.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Nine reports in that cell. A delisting notice can follow a late filing or a share price under a dollar rather than fraud, and 'filed something' is</text><text x="24.0" y="723.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">corroboration rather than proof the allegation was right. Targets whose price could not be recovered — the bankrupt ones — are absent entirely, which</text><text x="24.0" y="738.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">understates the bad-outcome side. Item codes come from SEC's submissions API, which returns only the most recent ~1000 filings, so older history is</text><text x="24.0" y="753.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">truncated for frequent filers.</text></svg>