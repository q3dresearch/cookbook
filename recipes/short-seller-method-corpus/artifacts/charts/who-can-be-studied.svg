<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 730" width="980" height="730"><rect width="980.0" height="730.0" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Only part of this field can be studied</text><text x="24.0" y="58.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">Every activist short-research firm probed. Horizontal: how many pages its sitemap lists. Vertical: how many words a</text><text x="24.0" y="75.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">reader can extract from one report. Filled marks were measured from a captured archive; open marks are a four-page</text><text x="24.0" y="92.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">sample.</text><text x="24.0" y="131.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">4 of 17 firms are not on this plot at all — they refuse the connection.</text><text x="24.0" y="151.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">Of those that answer, the ones you can actually read are a corner of it. That corner is what every finding here rests on.</text><line x1="92.0" y1="242.0" x2="92.0" y2="558.0" stroke="#e1e0d9" stroke-width="1"/><text x="92.0" y="578.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">0</text><line x1="248.5" y1="242.0" x2="248.5" y2="558.0" stroke="#e1e0d9" stroke-width="1"/><text x="248.5" y="578.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">100</text><line x1="405.0" y1="242.0" x2="405.0" y2="558.0" stroke="#e1e0d9" stroke-width="1"/><text x="405.0" y="578.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">200</text><line x1="561.5" y1="242.0" x2="561.5" y2="558.0" stroke="#e1e0d9" stroke-width="1"/><text x="561.5" y="578.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">300</text><line x1="718.0" y1="242.0" x2="718.0" y2="558.0" stroke="#e1e0d9" stroke-width="1"/><text x="718.0" y="578.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">400</text><line x1="92.0" y1="558.0" x2="718.0" y2="558.0" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="562.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">0</text><line x1="92.0" y1="512.9" x2="718.0" y2="512.9" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="516.9" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">2k</text><line x1="92.0" y1="467.7" x2="718.0" y2="467.7" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="471.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">4k</text><line x1="92.0" y1="422.6" x2="718.0" y2="422.6" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="426.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">6k</text><line x1="92.0" y1="377.4" x2="718.0" y2="377.4" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="381.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">8k</text><line x1="92.0" y1="332.3" x2="718.0" y2="332.3" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="336.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">10k</text><line x1="92.0" y1="287.1" x2="718.0" y2="287.1" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="291.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">12k</text><line x1="92.0" y1="242.0" x2="718.0" y2="242.0" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="246.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">14k</text><line x1="92.0" y1="558.0" x2="718.0" y2="558.0" stroke="#c3c2b7" stroke-width="1.5"/><text x="92.0" y="602.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">pages listed in the sitemap</text><text x="-400.0" y="26" transform="rotate(-90)" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="middle">words extractable per report</text><line x1="92.0" y1="524.1" x2="718.0" y2="524.1" stroke="#898781" stroke-width="1.2" stroke-dasharray="4 4"/><text x="82.0" y="528.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">1.5k</text><text x="82.0" y="516.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="end" font-weight="normal" style="">readable</text><circle cx="339.3" cy="368.1" r="7.5" fill="#2361b0" fill-opacity="0.55" stroke="#2361b0" stroke-width="2"/><text x="352.3" y="372.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">Fuzzy Panda  n=29*</text><circle cx="336.1" cy="407.9" r="7.5" fill="#2361b0" fill-opacity="0.55" stroke="#2361b0" stroke-width="2"/><text x="349.1" y="411.9" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">Hindenburg  n=94</text><circle cx="600.6" cy="462.3" r="7.5" fill="#b8912a" fill-opacity="0.55" stroke="#b8912a" stroke-width="2"/><text x="587.6" y="466.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums;">Muddy Waters  n=144</text><circle cx="137.4" cy="476.4" r="7.5" fill="#2361b0" fill-opacity="0.55" stroke="#2361b0" stroke-width="2"/><text x="150.4" y="480.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">Night Market  n=26</text><circle cx="671.1" cy="521.3" r="7.5" fill="#2361b0" fill-opacity="0.55" stroke="#2361b0" stroke-width="2"/><text x="671.1" y="507.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">Viceroy  n=9*</text><circle cx="250.1" cy="523.0" r="7.5" fill="#b8912a" fill-opacity="0.55" stroke="#b8912a" stroke-width="2"/><text x="250.1" y="509.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">J Capital  n=50</text><circle cx="647.6" cy="543.9" r="7.5" fill="#2361b0" fill-opacity="0.55" stroke="#2361b0" stroke-width="2"/><text x="647.6" y="529.9" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">Spruce Point  n=48*</text><circle cx="229.7" cy="544.5" r="6" fill="#fcfcfb" stroke="#7a4a1e" stroke-width="2" stroke-dasharray="3 2"/><text x="229.7" y="530.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">Wolfpack</text><circle cx="254.8" cy="546.8" r="6" fill="#fcfcfb" stroke="#7a4a1e" stroke-width="2" stroke-dasharray="3 2"/><text x="254.8" y="493.8" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">Citron</text><circle cx="182.8" cy="548.7" r="6" fill="#fcfcfb" stroke="#7a4a1e" stroke-width="2" stroke-dasharray="3 2"/><text x="182.8" y="456.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">Gotham City</text><circle cx="358.1" cy="551.0" r="6" fill="#fcfcfb" stroke="#b8912a" stroke-width="2" stroke-dasharray="3 2"/><text x="358.1" y="472.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">Bonitas</text><circle cx="101.4" cy="552.7" r="6" fill="#fcfcfb" stroke="#b8912a" stroke-width="2" stroke-dasharray="3 2"/><text x="101.4" y="512.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">Scorpion</text><circle cx="93.6" cy="558.0" r="6" fill="#fcfcfb" stroke="#7a4a1e" stroke-width="2" stroke-dasharray="3 2"/><text x="93.6" y="544.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">Hunterbrook</text><text x="734.0" y="244.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">what you can read</text><circle cx="741.0" cy="266.0" r="6.5" fill="#2361b0" fill-opacity="0.55" stroke="#2361b0" stroke-width="2"/><text x="756.0" y="270.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">full text in HTML</text><circle cx="741.0" cy="290.0" r="6.5" fill="#b8912a" fill-opacity="0.55" stroke="#b8912a" stroke-width="2"/><text x="756.0" y="294.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">a teaser, plus a PDF</text><circle cx="741.0" cy="314.0" r="6.5" fill="#7a4a1e" fill-opacity="0.55" stroke="#7a4a1e" stroke-width="2"/><text x="756.0" y="318.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">a teaser, and nothing</text><circle cx="741.0" cy="348.0" r="7.5" fill="#898781" fill-opacity="0.55" stroke="#898781" stroke-width="2"/><text x="756.0" y="352.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">archive captured here</text><circle cx="741.0" cy="370.0" r="6" fill="#fcfcfb" stroke="#898781" stroke-width="2" stroke-dasharray="3 2"/><text x="756.0" y="374.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="">four-page sample</text><text x="734.0" y="394.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">* capture cut short — n is what</text><text x="734.0" y="407.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">  was read, not what exists</text><text x="734.0" y="428.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">not on the plot</text><text x="734.0" y="448.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">Blue Orca — HTTP 403</text><text x="734.0" y="464.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">Kerrisdale — HTTP 403</text><text x="734.0" y="480.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">Culper — HTTP 403</text><text x="734.0" y="496.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">Grizzly — HTTP 000</text><text x="24.0" y="656.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">A firm counts as readable when a report yields 1,500 words or more. Sitemap page counts include index and tag pages, so they are an upper bound on</text><text x="24.0" y="671.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">reports, not a count of them. For PDF firms the height is the PDF, which is the report; their HTML pages hold a few hundred words. The sampled marks</text><text x="24.0" y="686.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">are weak — the same sampler read Muddy Waters' teaser pages as 1,940 words of report by landing on a mixed tier of URLs, which is why a measured</text><text x="24.0" y="701.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">corpus overrides a sample wherever one exists.</text></svg>