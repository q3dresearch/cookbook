<text x="46.0" y="404.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">And the economics lean is mostly composition: split by filer size class it nearly vanishes — 31% vs 20% among</text>
