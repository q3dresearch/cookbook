<text x="56.0" y="72.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">Every short-seller target whose last annual figures before the report can be read and whose 3-year</text>
<text x="56.0" y="89.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">window has closed, placed by operating margin. The companies that went on to disclose a Wells notice,</text>
<text x="56.0" y="106.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">grand jury, subpoena or formal order of investigation sit to the RIGHT — their margins looked better,</text>
<text x="56.0" y="123.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">not worse.</text>
