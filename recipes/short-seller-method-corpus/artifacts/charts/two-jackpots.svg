<text x="56.0" y="737.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">tested. A company losing money in public is not hiding anything; fraud has to look healthy.</text>
