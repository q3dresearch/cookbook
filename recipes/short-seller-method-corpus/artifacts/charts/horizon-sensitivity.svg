oe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">coin toss</text><polyline points="92.0,502.6 176.0,530.2 260.0,546.0 344.0,534.2 428.0,549.9 512.0,569.6 596.0,565.7 680.0,579.3 764.0,578.9" fill="none" stroke="#d17b00" stroke-width="2.5"/><circle cx="92.0" cy="502.6" r="4.5" fill="#d17b00" stroke="#fcfcfb" stroke-width="1.6"/><text x="92.0" y="490.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#d17b00" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">78%</text><circle cx="176.0" cy="530.2" r="4.5" fill="#d17b00" stroke="#fcfcfb" stroke-width="1.6"/><text x="176.0" y="518.2" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#d17b00" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">69%</text><circle cx="260.0" cy="546.0" r="4.5" fill="#d17b00" stroke="#fcfcfb" stroke-width="1.6"/><text x="260.0" y="534.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#d17b00" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">65%</text><circle cx="344.0" cy="534.2" r="4.5" fill="#d17b00" stroke="#fcfcfb" stroke-width="1.6"/><text x="344.0" y="522.2" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#d17b00" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">68%</text><circle cx="428.0" cy="549.9" r="4.5" fill="#d17b00" stroke="#fcfcfb" stroke-width="1.6"/><text x="428.0" y="537.9" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#d17b00" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">64%</text><circle cx="512.0" cy="569.6" r="4.5" fill="#d17b00" stroke="#fcfcfb" stroke-width="1.6"/><text x="512.0" y="557.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#d17b00" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">58%</text><circle cx="596.0" cy="565.7" r="4.5" fill="#d17b00" stroke="#fcfcfb" stroke-width="1.6"/><text x="596.0" y="553.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#d17b00" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">59%</text><circle cx="680.0" cy="579.3" r="4.5" fill="#d17b00" stroke="#fcfcfb" stroke-width="1.6"/><text x="680.0" y="567.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#d17b00" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">55%</text><circle cx="764.0" cy="578.9" r="4.5" fill="#d17b00" stroke="#fcfcfb" stroke-width="1.6"/><text x="764.0" y="566.9" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#d17b00" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums;">55%</text><text x="92.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="">1 day</text><text x="92.0" y="648.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">1d</text><text x="176.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="">3 days</text><text x="176.0" y="648.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">3d</text><text x="260.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="">1 week</text><text x="260.0" y="648.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">5d</text><text x="344.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="">2 weeks</text><text x="344.0" y="648.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">10d</text><text x="428.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="">1 month</text><text x="428.0" y="648.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">21d</text><text x="512.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="">2 months</text><text x="512.0" y="648.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">42d</text><text x="596.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="">1 quarter</text><text x="596.0" y="648.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">63d</text><text x="680.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="">6 months</text><text x="680.0" y="648.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">126d</text><text x="764.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" style="">1 year</text><text x="764.0" y="648.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">252d</text><text x="92.0" y="674.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">trading days after publication</text><text x="24.0" y="702.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Horizons are trading days, so weekends and holidays are already excluded — 21 is a calendar month, 63 a quarter. The earlier version of this recipe</text><text x="24.0" y="717.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">used 30, which is not a calendar period and sits near a local trough in the top panel. Survivors only: a target that was delisted before a horizon</text><text x="24.0" y="732.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">drops out of it, which is why the one-year column has 82 events and the one-day column has 85.</text></svg>