<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" width="940" height="760"><rect width="940.0" height="760.0" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">The effect size is your window choice. The hit rate is not.</text><text x="24.0" y="58.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">85 short-report targets at nine horizons, each measured from the day before the report and net of the Russell 2000.</text><text x="24.0" y="97.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">The median wanders — -3.4% at a day, -6.7% at a month, -2.9% at two, -8.3% at a year.</text><text x="24.0" y="117.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">The share that underperform decays cleanly: 78% to 55%. That is the number to quote.</text><text x="24.0" y="198.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="600" style="">median abnormal return, with interquartile range</text><line x1="92.0" y1="426.7" x2="764.0" y2="426.7" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="430.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-40%</text><line x1="92.0" y1="390.1" x2="764.0" y2="390.1" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="394.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-30%</text><line x1="92.0" y1="353.6" x2="764.0" y2="353.6" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="357.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-20%</text><line x1="92.0" y1="317.0" x2="764.0" y2="317.0" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="321.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-10%</text><line x1="92.0" y1="280.5" x2="764.0" y2="280.5" stroke="#c3c2b7" stroke-width="1.5"/><text x="82.0" y="284.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">+0%</text><line x1="92.0" y1="243.9" x2="764.0" y2="243.9" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="247.9" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">+10%</text><polygon points="92.0,282.5 176.0,278.4 260.0,276.1 344.0,276.8 428.0,265.7 512.0,242.9 596.0,228.2 680.0,238.6 764.0,225.0 764.0,419.0 680.0,398.2 596.0,383.8 512.0,372.0 428.0,371.9 344.0,353.2 260.0,337.9 176.0,323.4 92.0,319.2" fill="#1b4f8a" fill-opacity="0.10"/><polyline points="92.0,292.9 176.0,293.1 260.0,291.6 344.0,301.6 428.0,304.9 512.0,291.2 596.0,297.8 680.0,290.3 764.0,311.0" fill="none" stroke="#1b4f8a" stroke-width="2.5"/><circle cx="92.0" cy="292.9" r="4.5" fill="#1b4f8a" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="176.0" cy="293.1" r="4.5" fill="#1b4f8a" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="260.0" cy="291.6" r="4.5" fill="#1b4f8a" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="344.0" cy="301.6" r="4.5" fill="#1b4f8a" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="428.0" cy="304.