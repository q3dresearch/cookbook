<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700"><rect width="960.0" height="700.0" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">A short report is worth about three per cent on the day</text><text x="24.0" y="58.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">85 short-report targets, thirty trading days either side of publication. Indexed to the day BEFORE the report and</text><text x="24.0" y="75.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">measured against the Russell 2000, so the line is what the report did rather than what the month around it did. Band</text><text x="24.0" y="92.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">is the interquartile range.</text><text x="24.0" y="131.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">The report itself is worth about -3%. A month later the median target is -7% behind the market.</text><text x="24.0" y="151.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">78% underperform within a day, and the drift keeps going — it does not stop at the announcement.</text><line x1="84.0" y1="531.0" x2="714.0" y2="531.0" stroke="#e1e0d9" stroke-width="1"/><text x="74.0" y="535.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-25%</text><line x1="84.0" y1="499.5" x2="714.0" y2="499.5" stroke="#e1e0d9" stroke-width="1"/><text x="74.0" y="503.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-20%</text><line x1="84.0" y1="468.0" x2="714.0" y2="468.0" stroke="#e1e0d9" stroke-width="1"/><text x="74.0" y="472.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-15%</text><line x1="84.0" y1="436.6" x2="714.0" y2="436.6" stroke="#e1e0d9" stroke-width="1"/><text x="74.0" y="440.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-10%</text><line x1="84.0" y1="405.1" x2="714.0" y2="405.1" stroke="#e1e0d9" stroke-width="1"/><text x="74.0" y="409.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-5%</text><line x1="84.0" y1="373.6" x2="714.0" y2="373.6" stroke="#c3c2b7" stroke-width="1.5"/><text x="74.0" y="377.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">+0%</text><line x1="84.0" y1="342.1" x2="714.0" y2="342.1" stroke="#e1e0d9" stroke-width="1"/><text x="74.0" y="346.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">+5%</text><line x1="84.0" y1="310.7" x2="714.0" y2="310.7" stroke="#e1e0d9" stroke-width="1"/><text x="74.0" y="314.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" st