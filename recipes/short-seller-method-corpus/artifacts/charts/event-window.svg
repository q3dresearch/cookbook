ize="11" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">-8.1%,  89% fell</text><text x="728.0" y="304.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Muddy Waters (10)</text><text x="728.0" y="317.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">-2.9%,  100% fell</text><text x="728.0" y="338.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Night Market (11)</text><text x="728.0" y="351.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">-1.2%,  64% fell</text><text x="728.0" y="372.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Spruce Point (25)</text><text x="728.0" y="385.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">-1.0%,  56% fell</text><text x="24.0" y="632.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">85 of 273 reports. A report needs a date, a ticker SEC recognises, and a price series that spans the window. 2 target symbols returned no history at</text><text x="24.0" y="647.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">all. The price source keys on a company's CURRENT symbol, so a target that went bankrupt is absent — Zynex trades as ZYXIQ now, Nikola as NKLAQ — which</text><text x="24.0" y="662.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">means the cases where the short thesis landed hardest are the ones most likely missing from this figure. Read it as what happened to the survivors.</text></svg>