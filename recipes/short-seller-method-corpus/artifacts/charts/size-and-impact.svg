<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720"><rect width="960.0" height="720.0" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Size decides whether a short report lands</text><text x="24.0" y="58.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">67 reports, placed by the target's market capitalisation the day before publication against what the stock did</text><text x="24.0" y="75.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">relative to the Russell 2000. Light marks are single reports at one day; heavy marks are band medians.</text><text x="24.0" y="114.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Companies over $10B do not move — a coin toss whether they fall at all. The hit peaks in the middle of the range.</text><text x="24.0" y="134.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">Micro caps are the slow case: barely a move on the day, down 17% against the market a month later.</text><line x1="92.0" y1="563.4" x2="728.0" y2="563.4" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="567.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-40%</text><line x1="92.0" y1="514.3" x2="728.0" y2="514.3" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="518.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight=