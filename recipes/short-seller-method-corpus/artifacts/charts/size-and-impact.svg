14e" text-anchor="start" font-weight="normal" style="">Correlation between log</text><text x="744.0" y="378.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">market cap and the</text><text x="744.0" y="392.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">one-day move is -0.08.</text><text x="744.0" y="406.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">Reported as a slope this</text><text x="744.0" y="420.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">relationship disappears;</text><text x="744.0" y="434.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">it is not a slope.</text><text x="24.0" y="640.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">67 of 273 reports: needs a date, a ticker SEC recognises, a price series, and a share count from SEC's XBRL filings. Market cap is price times the most</text><text x="24.0" y="655.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">recent cover-page share count, so it is stale by up to a quarter and includes restricted stock — good enough to band by, not to rank within. Targets</text><text x="24.0" y="670.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">that went bankrupt are missing from the price source entirely, and they are more likely to have been small.</text></svg>