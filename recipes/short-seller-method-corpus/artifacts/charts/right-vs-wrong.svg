<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790"><rect width="960.0" height="790.0" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">The method barely predicts which calls land. The filing record does.</text><text x="24.0" y="58.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">74 targets on the same clock: those that later filed a restatement, delisting notice or bankruptcy, against those that</text><text x="24.0" y="75.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">did not. Right-hand panel is every candidate explanation for the gap.</text><text x="24.0" y="114.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">A year on, corroborated targets are -33% against the market and the rest are +5%. The paths separate and stay separated.</text><text x="24.0" y="134.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">But almost nothing about how the report was researched tells you in advance which group it is in.</text><text x="92.0" y="252.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="600" style="">cumulative return vs the Russell 2000, from the report</text><line x1="92.0" y1="561.2" x2="492.0" y2="561.2" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="565.2" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-70%</text><line x1="92.0" y1="527.1" x2="492.0" y2="527.1" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="531.1" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-60%</text><line x1="92.0" y1="493.0" x2="492.0" y2="493.0" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="497.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-50%</text><line x1="92.0" y1="458.9" x2="492.0" y2="458.9" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="462.9" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-40%</text><line x1="92.0" y1="424.8" x2="492.0" y2="424.8" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="428.8" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-30%</text><line x1="92.0" y1="390.7" x2="492.0" y2="390.7" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="394.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-20%</text><line x1="92.0" y1="356.6" x2="492.0" y2="356.6" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="360.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">-10%</text><line x1="92.0" y1="322.5" x2="492.0" y2="322.5" stroke="#c3c2b7" stroke-width="1.4"/><text x="82.0" y="326.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">+0%</text><line x1="92.0" y1="288.5" x2="492.0" y2="288.5" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="292.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">+10%</text><text x="92.0" y="588.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal" style="">1 mo</text><text x="172.0" y="588.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal" style="">1 qr</text><text x="252.0" y="588.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal" style="">6 mo</text><text x="332.0" y="588.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal" style="">1 yr</text><text x="412.0" y="588.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal" style="">2 yr</text><text x="492.0" y="588.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal" style="">3 yr</text><polyline points="92.0,351.8 172.0,390.3 252.0,379.8 332.0,436.3 412.0,537.6 492.0,488.9" fill="none" stroke="#b03a2e" stroke-width="3"/><circle cx="92.0" cy="351.8" r="5" fill="#b03a2e" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="172.0" cy="390.3" r="5" fill="#b03a2e" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="252.0" cy="379.8" r="5" fill="#b03a2e" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="332.0" cy="436.3" r="5" fill="#b03a2e" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="412.0" cy="537.6" r="5" fill="#b03a2e" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="492.0" cy="488.9" r="5" fill="#b03a2e" stroke="#fcfcfb" stroke-width="1.6"/><text x="502.0" y="492.9" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#b03a2e" text-anchor="start" font-weight="600" style="">later filed (19)</text><polyline points="92.0,318.1 172.0,311.9 252.0,309.2 332.0,304.9 412.0,338.1 492.0,338.0" fill="none" stroke="#1b4f8a" stroke-width="3"/><circle cx="92.0" cy="318.1" r="5" fill="#1b4f8a" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="172.0" cy="311.9" r="5" fill="#1b4f8a" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="252.0" cy="309.2" r="5" fill="#1b4f8a" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="332.0" cy="304.9" r="5" fill="#1b4f8a" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="412.0" cy="338.1" r="5" fill="#1b4f8a" stroke="#fcfcfb" stroke-width="1.6"/><circle cx="492.0" cy="338.0" r="5" fill="#1b4f8a" stroke="#fcfcfb" stroke-width="1.6"/><text x="502.0" y="342.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#1b4f8a" text-anchor="start" font-weight="600" style="">did not (55)</text><text x="610.0" y="238.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="600" style="">what separates the two groups</text><text x="610.0" y="252.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">12 corroborated vs 48 not — a smaller set than the panel at left</text><text x="610.0" y="276.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">already flagged before</text><line x1="610.0" y1="292.0" x2="810.0" y2="292.0" stroke="#e1e0d9" stroke-width="1"/><circle cx="743.3" cy="292.0" r="5.5" fill="#b03a2e"/><circle cx="643.3" cy="292.0" r="5.5" fill="#1b4f8a"/><text x="822.0" y="296.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">67% / 17%</text><text x="610.0" y="316.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">paid terminal</text><line x1="610.0" y1="332.0" x2="810.0" y2="332.0" stroke="#e1e0d9" stroke-width="1"/><circle cx="676.7" cy="332.0" r="5.5" fill="#b03a2e"/><circle cx="751.7" cy="332.0" r="5.5" fill="#1b4f8a"/><text x="822.0" y="336.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">33% / 71%</text><text x="610.0" y="356.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">own field legwork</text><line x1="610.0" y1="372.0" x2="810.0" y2="372.0" stroke="#e1e0d9" stroke-width="1"/><circle cx="643.3" cy="372.0" r="5.5" fill="#b03a2e"/><circle cx="672.5" cy="372.0" r="5.5" fill="#1b4f8a"/><text x="822.0" y="376.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">17% / 31%</text><text x="610.0" y="396.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">expert network</text><line x1="610.0" y1="412.0" x2="810.0" y2="412.0" stroke="#e1e0d9" stroke-width="1"/><circle cx="710.0" cy="412.0" r="5.5" fill="#b03a2e"/><circle cx="680.8" cy="412.0" r="5.5" fill="#1b4f8a"/><text x="822.0" y="416.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">50% / 35%</text><text x="610.0" y="436.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">original interviews</text><line x1="610.0" y1="452.0" x2="810.0" y2="452.0" stroke="#e1e0d9" stroke-width="1"/><circle cx="760.0" cy="452.0" r="5.5" fill="#b03a2e"/><circle cx="747.5" cy="452.0" r="5.5" fill="#1b4f8a"/><text x="822.0" y="456.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">75% / 69%</text><text x="610.0" y="476.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">court / litigation</text><line x1="610.0" y1="492.0" x2="810.0" y2="492.0" stroke="#e1e0d9" stroke-width="1"/><circle cx="726.7" cy="492.0" r="5.5" fill="#b03a2e"/><circle cx="735.0" cy="492.0" r="5.5" fill="#1b4f8a"/><text x="822.0" y="496.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">58% / 62%</text><text x="610.0" y="516.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">SEC filings</text><line x1="610.0" y1="532.0" x2="810.0" y2="532.0" stroke="#e1e0d9" stroke-width="1"/><circle cx="793.3" cy="532.0" r="5.5" fill="#b03a2e"/><circle cx="789.2" cy="532.0" r="5.5" fill="#1b4f8a"/><text x="822.0" y="536.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">92% / 90%</text><text x="610.0" y="564.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">0%</text><text x="810.0" y="564.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">100%</text><circle cx="31.0" cy="618.0" r="5.5" fill="#b03a2e"/><text x="46.0" y="622.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">later filed a restatement, delisting notice or bankruptcy (19)</text><circle cx="31.0" cy="637.0" r="5.5" fill="#1b4f8a"/><text x="46.0" y="641.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">did not (55)</text><text x="24.0" y="674.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">"Did not file" is not "was wrong": nothing obliges a company to file a document conceding a related-party or paid-promotion allegation, and most</text><text x="24.0" y="689.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">short-seller claims are not accounting claims. 12 corroborated reports against 48 carry every comparison on the right, so the flat method result is a</text><text x="24.0" y="704.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">null rather than a measurement. The left panel uses a larger set because it needs only a price series. Reports that were NOT corroborated used paid</text><text x="24.0" y="719.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">terminal data more often, 71% against 33%, and ran four thousand words longer.</text></svg>