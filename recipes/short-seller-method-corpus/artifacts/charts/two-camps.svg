<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 740" width="940" height="740"><rect width="940.0" height="740.0" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Two businesses, not one practice</text><text x="24.0" y="58.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">Every activist short-research firm whose reports could be read in full. Horizontal: how many companies it has</text><text x="24.0" y="75.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">attacked. Vertical: how many reports it published doing it. The diagonal is one report per target.</text><text x="24.0" y="116.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">4 firms sit on the line and fire once. 2 sit above it and run campaigns — Muddy Waters has 9 reports on one target.</text><text x="24.0" y="136.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" style="">Hindenburg is on the line with Night Market, Fuzzy Panda and Spruce Point. It is a clean example of one model, not an outlier from a single practice.</text><line x1="84.0" y1="614.0" x2="84.0" y2="232.0" stroke="#e1e0d9" stroke-width="1"/><line x1="84.0" y1="614.0" x2="466.0" y2="614.0" stroke="#e1e0d9" stroke-width="1"/><text x="84.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">0</text><text x="74.0" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">0</text><line x1="160.4" y1="614.0" x2="160.4" y2="232.0" stroke="#e1e0d9" stroke-width="1"/><line x1="84.0" y1="537.6" x2="466.0" y2="537.6" stroke="#e1e0d9" stroke-width="1"/><text x="160.4" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">50</text><text x="74.0" y="541.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">50</text><line x1="236.8" y1="614.0" x2="236.8" y2="232.0" stroke="#e1e0d9" stroke-width="1"/><line x1="84.0" y1="461.2" x2="466.0" y2="461.2" stroke="#e1e0d9" stroke-width="1"/><text x="236.8" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">100</text><text x="74.0" y="465.2" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">100</text><line x1="313.2" y1="614.0" x2="313.2" y2="232.0" stroke="#e1e0d9" stroke-width="1"/><line x1="84.0" y1="384.8" x2="466.0" y2="384.8" stroke="#e1e0d9" stroke-width="1"/><text x="313.2" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">150</text><text x="74.0" y="388.8" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">150</text><line x1="389.6" y1="614.0" x2="389.6" y2="232.0" stroke="#e1e0d9" stroke-width="1"/><line x1="84.0" y1="308.4" x2="466.0" y2="308.4" stroke="#e1e0d9" stroke-width="1"/><text x="389.6" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">200</text><text x="74.0" y="312.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">200</text><line x1="466.0" y1="614.0" x2="466.0" y2="232.0" stroke="#e1e0d9" stroke-width="1"/><line x1="84.0" y1="232.0" x2="466.0" y2="232.0" stroke="#e1e0d9" stroke-width="1"/><text x="466.0" y="634.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums;">250</text><text x="74.0" y="236.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums;">250</text><line x1="84.0" y1="614.0" x2="466.0" y2="614.0" stroke="#c3c2b7" stroke-width="1.5"/><line x1="84.0" y1="614.0" x2="84.0" y2="232.0" stroke="#c3c2b7" stroke-width="1.5"/><text x="84.0" y="656.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">companies attacked</text><text x="-423.0" y="26" transform="rotate(-90)" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="middle">reports published</text><line x1="84.0" y1="614.0" x2="466.0" y2="232.0" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 5"/><text x="458.0" y="252.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="end" font-weight="normal" style="">one report per target</text><circle cx="233.7" cy="456.6" r="9" fill="#1b4f8a" fill-opacity="0.25" stroke="#1b4f8a" stroke-width="2.5"/><text x="247.7" y="448.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Hindenburg</text><text x="247.7" y="463.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">98 targets, 103 reports</text><text x="247.7" y="477.6" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">5% follow-up</text><circle cx="169.6" cy="394.0" r="9" fill="#d17b00" fill-opacity="0.25" stroke="#d17b00" stroke-width="2.5"/><text x="183.6" y="386.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Muddy Waters</text><text x="183.6" y="401.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">56 targets, 144 reports</text><text x="183.6" y="415.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">61% follow-up</text><circle cx="119.1" cy="574.3" r="9" fill="#1b4f8a" fill-opacity="0.25" stroke="#1b4f8a" stroke-width="2.5"/><text x="133.1" y="566.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Night Market</text><text x="133.1" y="581.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">23 targets, 26 reports</text><text x="133.1" y="595.3" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">12% follow-up</text><circle cx="122.2" cy="569.7" r="9" fill="#1b4f8a" fill-opacity="0.25" stroke="#1b4f8a" stroke-width="2.5"/><text x="136.2" y="561.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Fuzzy Panda</text><text x="136.2" y="576.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">25 targets, 29 reports</text><text x="136.2" y="590.7" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">14% follow-up</text><circle cx="232.2" cy="285.5" r="9" fill="#d17b00" fill-opacity="0.25" stroke="#d17b00" stroke-width="2.5"/><text x="246.2" y="277.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">J Capital</text><text x="246.2" y="292.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">97 targets, 215 reports</text><text x="246.2" y="306.5" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">55% follow-up</text><circle cx="157.3" cy="528.4" r="9" fill="#1b4f8a" fill-opacity="0.25" stroke="#1b4f8a" stroke-width="2.5"/><text x="171.3" y="520.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Spruce Point*</text><text x="171.3" y="535.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums;">48 targets, 56 reports</text><text x="171.3" y="549.4" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">14% follow-up</text><text x="496.0" y="252.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">the two camps</text><circle cx="504.0" cy="278.0" r="7" fill="#1b4f8a" fill-opacity="0.25" stroke="#1b4f8a" stroke-width="2.5"/><text x="520.0" y="282.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">fire once</text><text x="496.0" y="298.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">one report, then the next</text><text x="496.0" y="315.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">target</text><circle cx="504.0" cy="344.0" r="7" fill="#d17b00" fill-opacity="0.25" stroke="#d17b00" stroke-width="2.5"/><text x="520.0" y="348.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">campaign</text><text x="496.0" y="364.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">keep publishing on the</text><text x="496.0" y="381.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">same target</text><text x="496.0" y="432.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Targets come from whatever</text><text x="496.0" y="449.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">each site exposes:</text><text x="496.0" y="466.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Hindenburg's slugs, Muddy</text><text x="496.0" y="483.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Waters' URLs, J Capital's</text><text x="496.0" y="500.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">and Spruce Point's PDF</text><text x="496.0" y="517.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">filenames. J Capital's 26</text><text x="496.0" y="534.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">macro notes are excluded —</text><text x="496.0" y="551.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">they attack no company.</text><text x="24.0" y="696.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="">A target is a company the firm published about at least once; a follow-up is any later report on that same target. Ranges: Hindenburg 2017-2025;</text><text x="24.0" y="713.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="">Muddy Waters 2010-2026; Night Market 2020-2026; Fuzzy Panda 2018-2026; J Capital 2013-2025; Spruce Point* 2010-2025. * Spruce Point is a 45-of-134</text><text x="24.0" y="730.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="">sample, evenly spaced across its archive; every other firm is its whole archive.</text></svg>